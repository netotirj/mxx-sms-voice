[general]
static=yes
writeprotect=no

[globals]
MOHCLASS=default

[spy-control]
exten => 9999,1,Answer()
	same => n,NoOp(>>> Escuta iniciada no canal: ${SPY_CHANNEL})
	same => n,ChanSpy(${SPY_CHANNEL},${SPY_OPTS})
	same => n,Goto(ari-control,start,1)

[from-internal]
exten => _X.,1,NoOp(📞 ${CALLERID(num)} → ${EXTEN})

; ✅ ramal/origem
same => n,Set(__ENDPOINT=${CHANNEL(endpoint)})
same => n,Set(__RAMAL=${CHANNEL(endpoint)})

; ==============================
; 1️⃣ ENDPOINT (Tarifação e Saldo)
; ==============================
same => n,Set(EPDATA=${ODBC_GET_ENDPOINT_FULL(${CHANNEL(endpoint)})})
same => n,GotoIf($["${EPDATA}"=""]?FAIL_NO_PERMISSION)

same => n,Set(OWNER_ID=${CUT(EPDATA,\,,1)})
same => n,Set(TENANT_ID=${CUT(EPDATA,\,,2)})
same => n,Set(ROLE=${CUT(EPDATA,\,,3)})
same => n,Set(CALL_MINUTE_COST=${CUT(EPDATA,\,,4)})
same => n,Set(BAL_ADMIN=${CUT(EPDATA,\,,5)})
same => n,Set(BAL_RESELLER=${CUT(EPDATA,\,,6)})
same => n,Set(ENDPOINT_SERVICE_FEE=${CUT(EPDATA,\,,7)})

; ==============================
; 2️⃣ ROTA
; ==============================
same => n,Set(ROUTEDATA=${ODBC_GET_ROUTE_FULL(${TENANT_ID},${OWNER_ID},${EXTEN},${ROLE})})
same => n,GotoIf($["${ROUTEDATA}"=""]?FAIL_NO_ROUTE)

same => n,Set(TRUNK_ID=${CUT(ROUTEDATA,\,,1)})
same => n,Set(ROUTE_STRIP=${CUT(ROUTEDATA,\,,2)})
same => n,Set(TRUNK_CLI_TYPE=${CUT(ROUTEDATA,\,,3)})
same => n,Set(ROUTE_DIAL_MODE=${CUT(ROUTEDATA,\,,4)})
same => n,Set(ROUTE_ACCESS_PREFIX=${CUT(ROUTEDATA,\,,5)})

; ==============================
; 3️⃣ TRUNK
; ==============================
same => n,Set(TRUNKDATA=${ODBC_GET_TRUNK_FULL(${TENANT_ID},${TRUNK_ID},${OWNER_ID},${ROLE})})
same => n,GotoIf($["${TRUNKDATA}"=""]?FAIL_NO_TRUNK)

same => n,Set(TRUNK=${CUT(TRUNKDATA,\,,1)})
same => n,Set(TECHPREFIX=${CUT(TRUNKDATA,\,,2)})
same => n,Set(DIAL_PREFIX=${CUT(TRUNKDATA,\,,3)})
same => n,Set(DIAL_STRIP=${CUT(TRUNKDATA,\,,4)})
same => n,Set(TRUNK_CLI_FIXED=${CUT(TRUNKDATA,\,,5)})
same => n,Set(TRUNK_IS_SYSTEM=${CUT(TRUNKDATA,\,,6)})

; ==============================
; 💰 REGRA DE CUSTO & SALDO (Sua lógica original)
; ==============================
same => n,GotoIf($["${TRUNK_IS_SYSTEM}"="1"]?COST_TARIFF:COST_FEE)
same => n(COST_TARIFF),Set(TAXA_OF_SERVICE=0)
	same => n,Set(VARIABLE_TYPE=OUTBOUND)
	same => n,Goto(COST_DONE)
same => n(COST_FEE),Set(CALL_MINUTE_COST=0)
	same => n,Set(TAXA_OF_SERVICE=${ENDPOINT_SERVICE_FEE})
	same => n,Set(VARIABLE_TYPE=service_fee)
same => n(COST_DONE),Set(CHECK_COST=${IF($["${VARIABLE_TYPE}"="service_fee"]?${TAXA_OF_SERVICE}:${CALL_MINUTE_COST})})

same => n,GotoIf($["${ROLE}"="admin"]?CHECK_ADMIN)
same => n,GotoIf($["${ROLE}"="reseller"]?CHECK_RESELLER)
same => n,Goto(FAIL_NO_PERMISSION)
same => n(CHECK_ADMIN),GotoIf($[${BAL_ADMIN} >= ${CHECK_COST}]?PASS:FAIL_NO_BALANCE)
same => n(CHECK_RESELLER),GotoIf($[${BAL_RESELLER} >= ${CHECK_COST} & ${BAL_ADMIN} >= ${CHECK_COST}]?PASS:FAIL_NO_BALANCE)

; ==============================
; 📟 CLI / BINA
; ==============================
same => n(PASS),Set(OUT_CLI=${CALLERID(num)})
same => n,Set(CLI_TYPE=${TOLOWER(${TRUNK_CLI_TYPE})})
same => n,GotoIf($["${CLI_TYPE}"="cli_fechada"]?FORCE_CLI)
same => n,GotoIf($["${CLI_TYPE}"="bina_inteligente"]?SMART_CLI)
same => n,Goto(APPLY_CLI)
same => n(FORCE_CLI),Set(OUT_CLI=${TRUNK_CLI_FIXED})
	same => n,Goto(APPLY_CLI)
same => n(SMART_CLI),Set(__PS_ENDPOINT_ID=${CHANNEL(endpoint)})
	same => n,Set(__IS_RAMAL=1)
	same => n,Set(__RAMAL=${CHANNEL(endpoint)})
	same => n,Set(OUT_CLI=${CHANNEL(endpoint)})
same => n(APPLY_CLI),Set(CALLERID(num)=${OUT_CLI})
	same => n,Set(CALLERID(name)=${OUT_CLI})
	same => n,Set(__OUT_CLI=${OUT_CLI})

; ==============================
; 📞 DISCAGEM (AQUI É A ÚNICA MUDANÇA)
; ==============================
same => n,Set(DIAL_RAW=${EXTEN})

; ✅ TRAVA DE HIERARQUIA: 
; Só remove o prefixo (ROUTE_STRIP) se o tronco NÃO for do sistema (IS_SYSTEM=0)
; Se for sistema (55/65), ele ignora o strip e o número segue inteiro
same => n,ExecIf($["${TRUNK_IS_SYSTEM}"="0" & ${ROUTE_STRIP} > 0]?Set(DIAL_RAW=${DIAL_RAW:${ROUTE_STRIP}}))

; 2) strip do trunk (mantido original)
same => n,ExecIf($[${DIAL_STRIP} > 0]?Set(DIAL_RAW=${DIAL_RAW:${DIAL_STRIP}}))

; 3) segurança (mantido original)
same => n,ExecIf($["${DIAL_PREFIX}"!="" & "${DIAL_RAW:0:${LEN(${DIAL_PREFIX})}}"="${DIAL_PREFIX}"]?Set(DIAL_RAW=${DIAL_RAW:${LEN(${DIAL_PREFIX})}}))

; 4) format-dial original
same => n,Gosub(format-dial,s,1(${TENANT_ID},${OWNER_ID},${EXTEN},${TRUNK_ID},${TECHPREFIX},${DIAL_RAW},${ROUTE_DIAL_MODE},${ROUTE_ACCESS_PREFIX}))
same => n,Set(DIAL_DEST=${GOSUB_RETVAL})

; 5) techprefix original
same => n,Set(DIAL_OUT=${DIAL_DEST})
same => n,ExecIf($["${TECHPREFIX}"!=""]?Set(DIAL_OUT=${TECHPREFIX}${DIAL_DEST}))

; ==============================
; 🔥 HERANÇA E ENVIO (Sem alterações)
; ==============================
same => n,Set(ORIGINAL_DEST=${DIAL_RAW})
same => n,Set(DESTINATION=${DIAL_RAW})
same => n,Set(__OWNER_ID=${OWNER_ID})
same => n,Set(__TENANT_ID=${TENANT_ID})
same => n,Set(__ROLE=${ROLE})
same => n,Set(__TRUNK=${TRUNK})
same => n,Set(__TRUNK_ID=${TRUNK_ID})
same => n,Set(__TRUNK_IS_SYSTEM=${TRUNK_IS_SYSTEM})
same => n,Set(__TECHPREFIX=${TECHPREFIX})
same => n,Set(__VARIABLE_TYPE=${VARIABLE_TYPE})
same => n,Set(__CALL_MINUTE_COST=${CALL_MINUTE_COST})
same => n,Set(__TAXA_OF_SERVICE=${TAXA_OF_SERVICE})
same => n,Set(__OUT_CLI=${OUT_CLI})
same => n,Set(__ORIGINAL_DEST=${ORIGINAL_DEST})
same => n,Set(__DESTINATION=${DESTINATION})
same => n,Set(__DIAL_RAW=${DIAL_RAW})
same => n,Set(__DIAL_DEST=${DIAL_DEST})
same => n,Set(__DIAL_OUT=${DIAL_OUT})

same => n,GotoIf($["${IS_DIALER}"="1"]?SKIP_STASIS:DO_STASIS)
same => n(DO_STASIS),Set(__IS_MANUAL=1)
	same => n,Set(IS_MANUAL=1)
	same => n,Set(__ARI_LEG=A)
	same => n,Stasis(app-asterisk,manual)
	same => n,Goto(AFTER_STASIS)
same => n(SKIP_STASIS),Goto(AFTER_STASIS)

same => n(AFTER_STASIS),Dial(PJSIP/${DIAL_OUT}@${TRUNK},60,rtTb(stasis-b^s^1(${DIAL_OUT},${TRUNK})))
same => n,Hangup()

; --- Blocos de Erro originais mantidos ---
same => n(FAIL_NO_ROUTE),Set(CERROR_CODE=NO_ROUTE)
same => n,Goto(FAIL_COMMON)
same => n(FAIL_NO_TRUNK),Set(CERROR_CODE=NO_TRUNK)
same => n,Goto(FAIL_COMMON)
same => n(FAIL_NO_BALANCE),Set(CERROR_CODE=NO_BALANCE)
same => n,Goto(FAIL_COMMON)
same => n(FAIL_NO_PERMISSION),Set(CERROR_CODE=NO_PERMISSION)
same => n,Goto(FAIL_COMMON)
same => n(FAIL_COMMON),NoOp(⛔ FAIL ${CERROR_CODE})
same => n,Set(__CERROR_CODE=${CERROR_CODE})
same => n,Stasis(app-asterisk,fail)
same => n,Hangup()




[stasis-b]
exten => s,1,NoOp(📌 Canal B (pre-dial))
; arma handler de hangup no B-leg (vai rodar quando o B encerrar)

  same => n,Set(CHANNEL(hangup_handler_push)=bhangup,s,1)

; (opcional) log útil
 same => n,NoOp(🛰️ B-leg handler armado)

 same => n,NoOp(📍 B-LEG RAMAL=${RAMAL} ENDPOINT=${ENDPOINT})
 same => n,GotoIf($["${STASIS_B_DONE}"="1"]?done)
 same => n,Set(STASIS_B_DONE=1)
 

 ; ==========================================
 ; ✅ VARS HERDADAS CHEGAM SEM "__"
 ; (porque no B-leg vira OWNER_ID, não __OWNER_ID)
 ; ==========================================

 ; --- Identificação ---
 same => n,Set(OWNER_ID=${OWNER_ID})
 same => n,Set(ROLE=${ROLE})
 same => n,Set(TENANT_ID=${TENANT_ID})

 ; --- Tronco ---
 same => n,Set(TRUNK=${ARG2})
 same => n,Set(TRUNK_ID=${TRUNK_ID})
 same => n,Set(TRUNK_IS_SYSTEM=${TRUNK_IS_SYSTEM})
 same => n,Set(TECHPREFIX=${TECHPREFIX})

 ; --- Destino lógico ---
 same => n,Set(DESTINATION=${ORIGINAL_DEST})
 same => n,Set(EXTENSION=${ORIGINAL_DEST})

 ; --- CallerID / CLI ---
 same => n,Set(OUT_CLI=${OUT_CLI})
 same => n,Set(CALLERID(num)=${OUT_CLI})
 same => n,Set(CALLERID(name)=${OUT_CLI})
 same => n,Set(CALLERID_NUM=${OUT_CLI})

 ; --- Custos ---
 same => n,Set(CALL_MINUTE_COST=${CALL_MINUTE_COST})
 same => n,Set(TAXA_OF_SERVICE=${TAXA_OF_SERVICE})
 same => n,Set(VARIABLE_TYPE=${VARIABLE_TYPE})

 ; --- Flags ---
 same => n,Set(IS_MANUAL=${IS_MANUAL})
 same => n,Set(IS_DIALER=${IS_DIALER})

 ; --- Controle ARI ---
 same => n,Set(__ARI_LEG=B)
 same => n,Set(__DIAL_OUT=${ARG1})
 same => n,Set(__TRUNK=${ARG2})
 same => n,Set(__ARI_B_READY=1)

 same => n(done),Return()





[format-dial]
; ARG1=TENANT_ID, ARG2=OWNER_ID, ARG3=EXTEN, ARG4=TRUNK_ID, ARG5=TECHPREFIX, ARG6=DIAL_RAW, ARG7=DIAL_MODE, ARG8=ACCESS_PREFIX
exten => s,1,NoOp(🌍 FORMAT-DIAL tenant=${ARG1} owner=${ARG2} exten=${ARG3} trunk=${ARG4} raw=${ARG6} mode=${ARG7} access=${ARG8})
    same => n,Set(NUM=${ARG6})

    ; vem do caller (rota) - blindado
    same => n,Set(DIAL_MODE=${IF($["${ARG7}"=""]?E164_BR:${ARG7})})
    same => n,Set(ACCESS_PREFIX=${ARG8})
    same => n,NoOp(🌍 mode=${DIAL_MODE} access_prefix=${ACCESS_PREFIX})

    ; limpeza básica (normaliza entrada)
    same => n,ExecIf($["${NUM:0:1}"="+"]?Set(NUM=${NUM:1}))
    same => n,ExecIf($["${NUM:0:2}"="00"]?Set(NUM=${NUM:2}))

    ; roteamento por modo
    same => n,GotoIf($["${DIAL_MODE}"="RAW"]?MODE_RAW)
    same => n,GotoIf($["${DIAL_MODE}"="E164_BR_00"]?MODE_BR_00)
    same => n,GotoIf($["${DIAL_MODE}"="BR_0"]?MODE_BR_0)

    ; default
    same => n,Goto(MODE_BR_55)

; -------------------------
; BR: força 55
; -------------------------
exten => s,n(MODE_BR_55),NoOp(🌍 MODE_BR_55)
    same => n,ExecIf($["${NUM:0:1}"="0"]?Set(NUM=${NUM:1}))
    same => n,ExecIf($["${NUM:0:2}"!="55"]?Set(NUM=55${NUM}))
    same => n,Goto(APPLY_ACCESS)

; -------------------------
; BR: 00 + 55
; -------------------------
exten => s,n(MODE_BR_00),NoOp(🌍 MODE_BR_00)
    same => n,ExecIf($["${NUM:0:1}"="0"]?Set(NUM=${NUM:1}))
    same => n,ExecIf($["${NUM:0:2}"!="55"]?Set(NUM=55${NUM}))
    same => n,Set(NUM=00${NUM})
    same => n,Goto(APPLY_ACCESS)

; -------------------------
; BR: 0 + nacional (remove 55 se vier)
; -------------------------
exten => s,n(MODE_BR_0),NoOp(🌍 MODE_BR_0)
    same => n,ExecIf($["${NUM:0:2}"="55"]?Set(NUM=${NUM:2}))
    same => n,Set(NUM=0${NUM})
    same => n,Goto(APPLY_ACCESS)

; -------------------------
; RAW: não mexe no número (usa o que veio em ARG6)
; -------------------------
exten => s,n(MODE_RAW),NoOp(🌍 MODE_RAW)
    same => n,Set(NUM=${ARG6})
    same => n,Goto(APPLY_ACCESS)

; -------------------------
; aplica access_prefix e retorna destino
; -------------------------
exten => s,n(APPLY_ACCESS),NoOp(🌍 APPLY_ACCESS)
    same => n,ExecIf($["${ACCESS_PREFIX}"!=""]?Set(NUM=${ACCESS_PREFIX}${NUM}))
    same => n,NoOp(🌍 OUT_NUM=${NUM})
    same => n,Return(${NUM})
	
	
	
[bhangup]
exten => s,1,NoOp(📴 B-HANGUP: dialstatus=${DIALSTATUS} hangupcause=${HANGUPCAUSE})

  ; Copia causas do B para o canal A (MASTER_CHANNEL = canal que iniciou o Dial)
  same => n,Set(MASTER_CHANNEL(__B_HANGUPCAUSE)=${HANGUPCAUSE})
  same => n,Set(MASTER_CHANNEL(__B_DIALSTATUS)=${DIALSTATUS})

  ; ====== SIP / PJSIP detalhes (depende da sua versão) ======
  ; 1) Reason header (às vezes vem)
  same => n,Set(MASTER_CHANNEL(__B_SIP_REASON)=${PJSIP_HEADER(read,Reason)})

  ; 2) Se sua versão expõe algum response code (nem sempre existe!)
  ; tente registrar e veja no NoOp se aparece algo:
  same => n,Set(MASTER_CHANNEL(__B_PJSIP_RESPONSE)=${PJSIP_HEADER(read,P-Asserted-Identity)}) ; exemplo só pra teste
  ; (melhor: você pode tentar também):
  ; same => n,Set(MASTER_CHANNEL(__B_SIP_CAUSE)=${CHANNEL(pjsip,hangup_cause)})

  same => n,NoOp(📴 Copiado p/ A: B_HANGUPCAUSE=${MASTER_CHANNEL(__B_HANGUPCAUSE)} B_REASON=${MASTER_CHANNEL(__B_SIP_REASON)})
  same => n,Return()