</head>

<body
    class="m-0 font-sans text-base antialiased font-normal dark:bg-slate-900 leading-default bg-gray-50 text-slate-500">
    <div class="absolute w-full bg-blue-500 dark:hidden min-h-75"></div>
    {{menu}}

    <main class="relative h-full transition-all duration-200 ease-in-out xl:ml-68 rounded-xl">
        {{header}}
        {{content}}
        {{footer}}

        <a id="support-whatsapp-floating"
           href="https://wa.me/5521968943160"
           target="_blank"
           rel="noopener noreferrer"
           class="support-whatsapp-floating"
           aria-label="Fale conosco no WhatsApp">
            <span class="support-whatsapp-floating__status" aria-hidden="true"></span>
            <span class="support-whatsapp-floating__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.52 3.48A11.87 11.87 0 0 0 12 0a11.88 11.88 0 0 0-10.6 17.25L0 24l6.9-1.81A11.88 11.88 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.2-1.25-6.21-3.48-8.52zm-8.52 18c-1.57 0-3.09-.4-4.44-1.15l-.32-.18-4.08 1.07 1.09-3.97-.21-.33a9.92 9.92 0 0 1 8.95-14.92c5.48 0 9.93 4.45 9.93 9.93s-4.45 9.93-9.93 9.93zm5.47-7.5c-.3-.15-1.77-.87-2.04-.96-.27-.1-.47-.15-.66.15s-.76.96-.93 1.15-.34.22-.63.07a8.08 8.08 0 0 1-2.38-1.46 8.8 8.8 0 0 1-1.62-2.01c-.17-.3 0-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.38-.02-.53s-.66-1.6-.91-2.2c-.24-.58-.49-.5-.67-.5-.17 0-.36 0-.55 0-.2 0-.53.08-.8.38s-1.05 1.02-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.24 5.13 4.55.72.31 1.28.5 1.72.64.72.23 1.37.2 1.88.12.57-.08 1.77-.73 2.02-1.43.25-.7.25-1.3.18-1.43-.07-.13-.27-.2-.57-.35z"/>
                </svg>
            </span>
            <span class="support-whatsapp-floating__copy">
                <span id="support-whatsapp-status-text" class="support-whatsapp-floating__eyebrow">Verificando status</span>
                <span id="support-whatsapp-label" class="support-whatsapp-floating__label">Fale com a Maxx</span>
                <span id="support-whatsapp-hours" class="support-whatsapp-floating__hours">Seg a sex, 09h as 18h</span>
            </span>
        </a>
    </main>


    <!-- Plugins -->
    <script src="{{URL}}/resources/assets/js/plugins/chartjs.min.js"></script>
    <script src="{{URL}}/resources/assets/js/plugins/perfect-scrollbar.min.js"></script>
    <script src="{{URL}}/resources/assets/js/argon-dashboard-tailwind.js?v=1.0.1"></script>
    <script src="{{URL}}/resources/view/login/assets/js/notify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="{{URL}}/resources/assets/js/camp.js"></script>
    <script src="{{URL}}/resources/assets/js/heartbeat.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


    <style>
        /* Estilização customizada para bater com as cores do seu dashboard (Azul Maxx) */
        :root {
            --plyr-color-main: #007bff; /* Ajuste para o azul exato do seu sistema */
        }
        .swal2-html-container {
            padding: 1em 2em !important;
        }
        .plyr--audio .plyr__controls {
            background: transparent !important;
            padding: 0 !important;
        }
        .support-whatsapp-floating {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            min-height: 3.75rem;
            max-width: calc(100vw - 2rem);
            padding: 0.58rem 0.95rem 0.58rem 0.62rem;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #0f172a 0%, #112240 48%, #059669 100%);
            border: 1px solid rgba(148, 163, 184, 0.26);
            border-radius: 1.1rem;
            box-shadow: 0 18px 45px -20px rgba(2, 6, 23, 0.9), 0 12px 30px -18px rgba(5, 150, 105, 0.8);
            backdrop-filter: blur(16px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .support-whatsapp-floating:hover {
            transform: translateY(-3px);
            border-color: rgba(45, 206, 137, 0.55);
            box-shadow: 0 22px 55px -22px rgba(2, 6, 23, 0.95), 0 16px 34px -18px rgba(5, 150, 105, 0.9);
        }
        .support-whatsapp-floating.is-offline {
            background: linear-gradient(135deg, #111827 0%, #1f2937 55%, #475569 100%);
            box-shadow: 0 18px 45px -22px rgba(2, 6, 23, 0.95);
        }
        .support-whatsapp-floating__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.55rem;
            height: 2.55rem;
            flex: 0 0 auto;
            color: #ffffff;
            background: rgba(45, 206, 137, 0.2);
            border: 1px solid rgba(167, 243, 208, 0.28);
            border-radius: 0.9rem;
        }
        .support-whatsapp-floating.is-offline .support-whatsapp-floating__icon {
            background: rgba(148, 163, 184, 0.18);
            border-color: rgba(203, 213, 225, 0.22);
        }
        .support-whatsapp-floating__icon svg {
            width: 1.35rem;
            height: 1.35rem;
        }
        .support-whatsapp-floating__copy {
            display: flex;
            min-width: 0;
            flex-direction: column;
            line-height: 1.05;
        }
        .support-whatsapp-floating__eyebrow {
            margin-bottom: 0.18rem;
            color: #a7f3d0;
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .support-whatsapp-floating.is-offline .support-whatsapp-floating__eyebrow {
            color: #cbd5e1;
        }
        .support-whatsapp-floating__label {
            color: #f8fafc;
            font-size: 0.86rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .support-whatsapp-floating__hours {
            margin-top: 0.2rem;
            color: rgba(226, 232, 240, 0.72);
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .support-whatsapp-floating__status {
            position: absolute;
            top: 0.36rem;
            right: 0.48rem;
            width: 0.58rem;
            height: 0.58rem;
            background: #34d399;
            border: 2px solid #0f172a;
            border-radius: 999px;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.72);
            animation: supportWhatsAppPulse 1.8s infinite;
        }
        .support-whatsapp-floating.is-offline .support-whatsapp-floating__status {
            background: #94a3b8;
            box-shadow: none;
            animation: none;
        }
        @keyframes supportWhatsAppPulse {
            70% {
                box-shadow: 0 0 0 8px rgba(52, 211, 153, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
            }
        }
        @media (max-width: 520px) {
            .support-whatsapp-floating {
                right: 1rem;
                bottom: 1rem;
                min-height: 3.25rem;
                padding: 0.42rem;
                border-radius: 1rem;
            }
            .support-whatsapp-floating__copy {
                display: none;
            }
            .support-whatsapp-floating__icon {
                width: 2.45rem;
                height: 2.45rem;
            }
        }
    </style>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>


    <script>
    (function () {
        const button = document.getElementById('support-whatsapp-floating');
        if (!button) return;

        const statusText = document.getElementById('support-whatsapp-status-text');
        const label = document.getElementById('support-whatsapp-label');
        const hours = document.getElementById('support-whatsapp-hours');
        const phone = '5521968943160';
        const onlineMessage = 'Ola, gostaria de falar com o suporte da Maxx.';
        const offlineMessage = 'Ola, gostaria de atendimento. Sei que o horario de suporte e de segunda a sexta, das 09h as 18h.';

        function isBusinessOpen(date) {
            const day = date.getDay();
            const minutes = date.getHours() * 60 + date.getMinutes();
            return day >= 1 && day <= 5 && minutes >= 540 && minutes < 1080;
        }

        function updateWhatsAppSupportStatus() {
            const online = isBusinessOpen(new Date());
            const message = online ? onlineMessage : offlineMessage;

            button.classList.toggle('is-offline', !online);
            button.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            button.setAttribute('aria-label', online ? 'Abrir atendimento online pelo WhatsApp' : 'Enviar mensagem para o suporte no WhatsApp');

            if (statusText) statusText.textContent = online ? 'Suporte online' : 'Suporte offline';
            if (label) label.textContent = online ? 'Fale com a Maxx' : 'Enviar mensagem';
            if (hours) hours.textContent = online ? 'Atendimento ate 18h' : 'Seg a sex, 09h as 18h';
        }

        updateWhatsAppSupportStatus();
        window.setInterval(updateWhatsAppSupportStatus, 60000);
    })();

    </script>

    <script>
    const notyf = new Notyf({
    duration: 4000,
    position: { x: 'right', y: 'top' }
    });
    </script>

<script>
        const flashError = localStorage.getItem('flash_error');
        if (flashError) {
            notyf.error(flashError);
            localStorage.removeItem('flash_error');
        }
    </script>

    <!-- Tailwind custom animation -->
    <style>
        @keyframes pulse-custom {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }

        .animate-pulse-custom {
            animation: pulse-custom 1.5s infinite;
        }
    </style>

    <!-- Dropdown Handler -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userDropdownTrigger = document.getElementById('userDropdownTrigger');
            const userDropdownMenu = document.getElementById('userDropdownMenu');

            const toggleDropdown = () => {
                if (userDropdownMenu.classList.contains('hidden')) {
                    userDropdownMenu.classList.remove('hidden');
                    setTimeout(() => {
                        userDropdownMenu.classList.add('opacity-100', 'pointer-events-auto');
                        userDropdownMenu.classList.remove('opacity-0', 'pointer-events-none');
                    }, 10);
                } else {
                    userDropdownMenu.classList.remove('opacity-100', 'pointer-events-auto');
                    userDropdownMenu.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        userDropdownMenu.classList.add('hidden');
                    }, 250);
                }
            };

            userDropdownTrigger?.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleDropdown();
            });

            document.addEventListener('click', (e) => {
                if (!userDropdownMenu?.contains(e.target) && !userDropdownTrigger?.contains(e.target)) {
                    userDropdownMenu?.classList.remove('opacity-100', 'pointer-events-auto');
                    userDropdownMenu?.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        userDropdownMenu?.classList.add('hidden');
                    }, 250);
                }
            });
        });
    </script>

</body>

</html>
