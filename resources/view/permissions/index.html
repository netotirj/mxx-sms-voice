<!-- Modal de Permissões -->
<div id="permissions-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-start justify-center z-50 pt-20">
    <div class="bg-white dark:bg-slate-800 rounded-lg w-3/4 max-w-4xl p-6 relative shadow-lg">
        <h2 id="permission-title" class="text-lg font-bold mb-4 dark:text-white"></h2>


        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                <thead class="bg-gray-100 dark:bg-slate-700">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-white uppercase tracking-wider">Menu</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-white uppercase tracking-wider">Tela</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 dark:text-white uppercase tracking-wider">Status</th>
                </tr>
                </thead>
                <tbody id="permissions-content" class="bg-white dark:bg-slate-800 divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Linhas inseridas via JS -->
                </tbody>
            </table>
        </div>

        <button id="close-modal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 dark:hover:text-white text-xl font-bold">✖</button>
    </div>
</div>







<script>

    document.addEventListener('DOMContentLoaded', function () {
        const modal = document.getElementById('permissions-modal');
        const modalContent = document.getElementById('permissions-content');
        const closeModal = document.getElementById('close-modal');


        // Delegação de evento para todos os botões .btn-edit-role, inclusive dinâmicos
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.btn-edit-role');
            if (!btn) return;

            const roleId = btn.dataset.id;

            // Limpa conteúdo anterior
            modalContent.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500 dark:text-gray-300">Carregando...</td></tr>';

            // Buscar permissões via API
            fetch(`${baseUrl}/permissions/${roleId}/search`)
                .then(res => res.json())
                .then(data => {




                    modalContent.innerHTML = '';
                    const permissions = data.data?.permissions || [];

                    if (permissions.length > 0) {
                        const description = data.data.description || 'Permissão Desconhecida';
                        // Atualiza o título no HTML
                        document.getElementById('permission-title').innerText = `${description}`;
                    }
                        if (permissions.length > 0) {
                        permissions.forEach((perm) => {



                            const row = document.createElement('tr');
                            row.className = 'hover:bg-gray-50 dark:hover:bg-slate-700';


                            // Ajuste para switch Tailwind com estado real
                            const isActive = perm.active ?? true;

                            row.innerHTML = `

                              <td class="px-6 py-2 text-sm text-gray-700 dark:text-white">${perm.name}</td>
                              <td class="px-6 py-2 text-sm text-gray-700 dark:text-white">${perm.label}</td>
                              <td class="px-6 py-2 text-center">
                                <label class="inline-flex relative items-center cursor-pointer">
                                  <input type="checkbox" class="sr-only peer permission-toggle" data-permission-router="${perm.router}" data-permission-id="${perm.id}" ${isActive ? 'checked' : ''}>
                                  <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-teal-600 peer-focus:ring-2 peer-focus:ring-teal-300 transition-all"></div>
                                  <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all peer-checked:translate-x-full"></div>
                                </label>
                              </td>
                            `;

                            modalContent.appendChild(row);
                        });

                        // Evento para toggles de permissão
                        modalContent.querySelectorAll('.permission-toggle').forEach(toggle => {
                            toggle.addEventListener('change', function () {
                                const permissionId = this.dataset.permissionId;
                                const permissionRouter = this.dataset.permissionRouter;
                                const isActive = this.checked;

                                //console.log(permissionRouter)
                                //console.log(roleId)
                                const formData = new FormData();
                                formData.append('permission_index', permissionId);
                                formData.append('permission_router', permissionRouter)
                                formData.append('active', isActive ? 1 : 0);

                                // Enviar atualização para backend
                                fetch(`${baseUrl}/permissions/${roleId}/update`, {
                                    method: 'POST',
                                    body: formData
                                    //headers: { 'Content-Type': 'application/json' },
                                    //body: JSON.stringify({ permission_index: permissionId, active: isActive })
                                })
                                    .then(res => res.json())
                                    .then(resp => console.log(resp))
                                    .catch(err => console.error(err));
                            });
                        });

                    } else {
                        modalContent.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-500 dark:text-gray-300">Nenhuma permissão</td></tr>';
                    }
                });

            // Mostrar modal
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });


        // Fechar modal
        closeModal.addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        // Fechar modal ao clicar fora
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        });
    });
</script>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const tbody = document.querySelector('table tbody');

        fetch(`${baseUrl}/permissions/search`)
            .then(response => response.json())
            .then(result => {
                tbody.innerHTML = '';

                if (!result.data || !Array.isArray(result.data)) {
                    console.error('Formato inválido', result);
                    return;
                }

             //console.log(result.data)

                result.data.forEach(role => {
                    const statusBadge = role.status === 'y'
                        ? `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                <i data-feather="check-circle" class="w-4 h-4"></i> Ativo
           </span>`
                        : `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">
                <i data-feather="x-circle" class="w-4 h-4"></i> Inativo
           </span>`;

                    const row = `
                                    <tr data-id="${role.id}" class="hover:bg-gray-50 transition">
                                        <!-- Nome da Role -->
                                        <td class="p-3 align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
                                            <div class="flex items-center gap-2">
                                                <i data-feather="user-check" class="w-4 h-4 text-blue-500"></i>
                                                <h6 class="mb-0 text-sm font-medium text-gray-800">${role.role_name}</h6>
                                            </div>
                                        </td>

                                        <!-- Status -->
                                        <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
                                            ${statusBadge}
                                        </td>

                                        <!-- Ações -->
                                        <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
                                            <button
                                                class="btn-edit-role inline-flex items-center gap-1 bg-orange-100 text-orange-700 hover:bg-orange-200 font-semibold text-xs px-3 py-1 rounded transition"
                                                title="Gerenciar Permissões"
                                                data-id="${role.id}">
                                                <i data-feather="key" class="w-4 h-4"></i> Permissões
                                            </button>
                                        </td>
                                    </tr>
                                `;

                    tbody.insertAdjacentHTML('beforeend', row);
                });

                // Renderiza os ícones Feather
                feather.replace();

            })
            .catch(error => console.error('Erro ao buscar permissões:', error));
    });
</script>
