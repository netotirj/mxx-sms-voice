<!doctype html>
<html lang="pt-br" class="dark">

<head>
  <title>{{title}} | Maxx Solutions</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="base-url" content="{{URL}}">
  <link rel="icon" type="image/png" href="{{URL}}/resources/assets/img/favicon-transparent.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/fonts/tabler-icons.min.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/notify.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/auth-notify.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/support-whatsapp.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              "50": "#eff6ff", "100": "#dbeafe", "200": "#bfdbfe", "300": "#93c5fd", "400": "#60a5fa",
              "500": "#38bdf8", "600": "#0ea5e9", "700": "#0284c7", "800": "#0369a1", "900": "#075985", "950": "#082f49"
            },
            darkSurface: "#0f172a",
            darkCard: "#1e293b"
          }
        }
      }
    };
  </script>
  
  <script src="{{captchaScriptUrl}}" async defer></script>
</head>

<body class="bg-darkSurface font-sans text-white antialiased">

  <section class="min-h-screen flex items-center justify-center py-8 px-4 lg:py-0">
    <div class="max-w-6xl w-full grid lg:grid-cols-12 gap-12 items-center">
      
      <div class="lg:col-span-7 flex flex-col items-center lg:items-end">
        <div class="w-full max-w-lg bg-darkCard rounded-2xl shadow-2xl p-8 border border-gray-700">
          
          <div class="mb-8 flex items-center gap-4">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center">
              <img src="{{URL}}/resources/view/login/assets/images/maxx-logo-transparent.png" alt="Maxx Solutions" class="h-12 w-12 object-contain">
            </div>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.28em] text-gray-400">Plataforma</p>
              <p class="text-lg font-semibold tracking-tight text-gray-100">Maxx Solutions</p>
            </div>
          </div>

          <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">Bem-vindo de volta</h1>
            <p class="text-gray-400">
              Acesse sua conta para gerenciar seus disparos. Não tem conta? 
              <a href="{{URL}}/register" class="text-primary-500 font-semibold hover:underline">Cadastre-se</a>
            </p>
          </div>

          <form id="loginForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="email" class="block mb-2 text-sm font-medium text-gray-300">E-mail ou Código</label>
                <input type="text" id="email" required
                       class="bg-gray-700 border border-gray-600 text-white text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3.5 transition duration-200" 
                       placeholder="nome@empresa.com">
              </div>
              <div>
                <label for="password" class="block mb-2 text-sm font-medium text-gray-300">Senha</label>
                <input type="password" id="password" required
                       class="bg-gray-700 border border-gray-600 text-white text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3.5 transition duration-200" 
                       placeholder="••••••••">
              </div>
            </div>

            <div class="relative flex items-center justify-center">
              <div class="w-full border-t border-gray-700"></div>
              <span class="absolute bg-darkCard px-3 text-xs font-bold uppercase tracking-widest text-gray-500">ou continue com</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <button type="button" data-social-provider="google" data-social-url="{{SOCIAL_URL}}/auth/social/google?intent=login" class="social-login-btn flex w-full items-center justify-center gap-3 rounded-xl border border-gray-600 bg-transparent px-5 py-3 text-sm font-medium text-white transition-all duration-200 hover:border-primary-500/70 hover:bg-slate-700">
                <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5A9.5 9.5 0 1 0 12 21.5c5.5 0 9.1-3.8 9.1-9.2 0-.6-.1-1.1-.2-1.6H12Z"/>
                  <path fill="#FBBC05" d="M3.6 7.9 6.8 10.2A5.9 5.9 0 0 1 12 6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.5 12 2.5c-3.7 0-7 2.1-8.4 5.4Z"/>
                  <path fill="#34A853" d="M12 21.5c2.5 0 4.7-.8 6.3-2.3l-3-2.5c-.8.6-1.9 1.1-3.3 1.1-3.8 0-5.1-2.5-5.4-3.7l-3.2 2.5c1.4 3.3 4.8 4.9 8.6 4.9Z"/>
                  <path fill="#4285F4" d="M21.1 12.3c0-.6-.1-1.1-.2-1.6H12v3.9h5.5c-.3 1.3-1.1 2.3-2.2 3.1l3 2.5c1.8-1.7 2.8-4.2 2.8-7.9Z"/>
                </svg>
                <span>Google</span>
              </button>
              <button type="button" data-social-provider="apple" data-social-url="{{SOCIAL_URL}}/auth/social/apple?intent=login" class="social-login-btn flex w-full items-center justify-center gap-3 rounded-xl border border-gray-600 bg-transparent px-5 py-3 text-sm font-medium text-white transition-all duration-200 hover:border-primary-500/70 hover:bg-slate-700">
                <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.702z"/></svg>
                <span>Apple</span>
              </button>
              <button type="button" data-social-provider="facebook" data-social-url="{{SOCIAL_URL}}/auth/social/facebook?intent=login" class="social-login-btn flex w-full items-center justify-center gap-3 rounded-xl border border-gray-600 bg-transparent px-5 py-3 text-sm font-medium text-white transition-all duration-200 hover:border-primary-500/70 hover:bg-slate-700">
                <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#1877F2" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.24 10.44 22v-7.03H7.9v-2.91h2.54V9.84c0-2.52 1.49-3.91 3.77-3.91 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.9h2.78l-.44 2.91h-2.34V22C18.34 21.24 22 17.08 22 12.06Z"/>
                </svg>
                <span>Facebook</span>
              </button>
            </div>

            <div class="flex items-center justify-between">
              <label class="flex items-center cursor-pointer">
                <input id="remember" type="checkbox" checked class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-primary-600 focus:ring-primary-600 focus:ring-offset-gray-800">
                <span class="ml-2 text-sm text-gray-400">Lembrar de mim</span>
              </label>
              <a href="{{URL}}/reset-pass" class="text-sm font-semibold text-primary-500 hover:underline">Esqueceu a senha?</a>
            </div>

            <div class="{{captchaWidgetClass}} flex justify-center">
              <div class="cf-turnstile" data-sitekey="{{captchaSiteKey}}" data-theme="dark" data-language="pt-BR"></div>
            </div>

            <button id="btnLogin" type="submit"
                    class="w-full text-white bg-gradient-to-r from-sky-500 via-cyan-500 to-blue-500 hover:from-sky-400 hover:via-cyan-400 hover:to-blue-500 focus:ring-4 focus:ring-cyan-800 font-bold rounded-xl text-md px-5 py-4 text-center transition-all flex items-center justify-center gap-3 shadow-lg shadow-cyan-950/25">
              <span class="btn-text">Entrar na minha conta</span>
              <svg class="btn-spinner hidden h-6 w-6 animate-spin text-white" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-5 hidden lg:block">
        <div class="relative">
          <div class="absolute -top-20 -left-20 w-64 h-64 bg-cyan-400/20 rounded-full blur-3xl"></div>
          <div class="absolute -bottom-20 -right-10 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>
          
          <img src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/authentication/illustration.svg" 
               alt="Ilustração Maxx" 
               class="relative z-10 w-full transform hover:scale-105 transition duration-700">
        </div>
      </div>

    </div>
  </section>

  <a id="support-whatsapp-floating"
     href="https://wa.me/5521968943160"
     target="_blank"
     rel="noopener noreferrer"
     class="support-whatsapp-floating"
     aria-label="Fale conosco no WhatsApp">
    <span class="support-whatsapp-floating__status" aria-hidden="true"></span>
    <span class="support-whatsapp-floating__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.52 3.48A11.87 11.87 0 0 0 12 0a11.88 11.88 0 0 0-10.6 17.25L0 24l6.9-1.81A11.88 11.88 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.2-1.25-6.21-3.48-8.52zm-8.52 18c-1.57 0-3.09-.4-4.44-1.15l-.32-.18-4.08 1.07 1.09-3.97-.21-.33a9.92 9.92 0 0 1 8.95-14.92c5.48 0 9.93 4.45 9.93 9.93s-4.45 9.93-9.93 9.93zm5.47-7.5c-.3-.15-1.77-.87-2.04-.96-.27-.1-.47-.15-.66.15s-.76.96-.93 1.15-.34.22-.63.07a8.08 8.08 0 0 1-2.38-1.46 8.8 8.8 0 0 1-1.62-2.01c-.17-.3 0-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.38-.02-.53s-.66-1.6-.91-2.2c-.24-.58-.49-.5-.67-.5-.17 0-.36 0-.55 0-.2 0-.53.08-.8.38s-1.05 1.02-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.24 5.13 4.55.72.31 1.28.5 1.72.64.72.23 1.37.2 1.88.12.57-.08 1.77-.73 2.02-1.43.25-.7.25-1.3.18-1.43-.07-.13-.27-.2-.57-.35z"/>
      </svg>
    </span>
    <span class="support-whatsapp-floating__copy">
      <span id="support-whatsapp-status-text" class="support-whatsapp-floating__eyebrow">Verificando status</span>
      <span id="support-whatsapp-label" class="support-whatsapp-floating__label">Fale com a Maxx</span>
      <span id="support-whatsapp-hours" class="support-whatsapp-floating__hours">Seg a sex, 09h as 18h</span>
    </span>
  </a>

  <script src="{{URL}}/resources/view/login/assets/js/notify.js"></script>
  <script src="{{URL}}/resources/view/login/assets/js/support-whatsapp.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const btnText = btnLogin.querySelector('.btn-text');
    const btnSpinner = btnLogin.querySelector('.btn-spinner');
    const socialButtons = document.querySelectorAll('.social-login-btn');
    const notyf = new Notyf({
      duration: 5000,
      ripple: false,
      position: { x: 'right', y: 'top' },
      types: [
        {
          type: 'success',
          backgroundColor: '#10b981',
          icon: {
            className: 'notyf__icon--success',
            tagName: 'i'
          }
        },
        {
          type: 'error',
          backgroundColor: '#e11d48',
          icon: {
            className: 'notyf__icon--error',
            tagName: 'i'
          }
        },
        {
          type: 'info',
          backgroundColor: '#334155',
          icon: false
        }
      ]
    });

    const authParams = new URLSearchParams(window.location.search);
    const authStatus = authParams.get('auth_status');
    const authMessage = authParams.get('auth_message');

    if (authStatus && authMessage) {
      if (authStatus === 'success') {
        notyf.success(authMessage);
      } else if (authStatus === 'info') {
        notyf.open({ type: 'info', message: authMessage });
      } else {
        notyf.error(authMessage);
      }

      authParams.delete('auth_status');
      authParams.delete('auth_message');
      const nextQuery = authParams.toString();
      window.history.replaceState({}, document.title, `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}`);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('remember').checked ? 'on' : '';
      const captcha = document.querySelector('[name="cf-turnstile-response"]')?.value;

      if ("{{captchaEnabled}}" === 'true' && !captcha) {
        notyf.error('Por favor, complete a verificação de segurança.');
        return;
      }

      btnLogin.disabled = true;
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      try {
        const dataPost = new FormData();
        dataPost.append('email', email);
        dataPost.append('password', password);
        dataPost.append('remember', remember);
        if (captcha) dataPost.append('cf-turnstile-response', captcha);

        const response = await fetch("{{URL}}/login", { method: "POST", body: dataPost });
        const data = await response.json();

        if (data.status === 'OK') {
          notyf.success('Bem-vindo à Maxx Solutions!');
          localStorage.setItem('loginSuccess', data.message);
          setTimeout(() => window.location.href = "{{URL}}/dashboard", 1200);
        } else {
          notyf.error(data.message || 'Dados incorretos.');
          resetButton();
        }
      } catch (err) {
        notyf.error('Falha de conexão.');
        resetButton();
      }
    });

    socialButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const targetUrl = button.dataset.socialUrl;
        if (!targetUrl) {
          notyf.error('A rota de login social nao foi configurada.');
          return;
        }

        window.location.href = targetUrl;
      });
    });

    function resetButton() {
      btnLogin.disabled = false;
      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
    }
  </script>
</body>
</html>
