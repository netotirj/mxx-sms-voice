                        <div class="text-center mb-8 animate-bounce">

                        </div>

                        <h4 class="text-center text-2xl font-extrabold mb-2 text-primary-500 drop-shadow-md">
                            Digite o Código
                        </h4>
                        {{content}}

                            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-400 z-10">
                                <i class="ti ti-lock"></i>
                            </span>
                            <input type="text" maxlength="6" inputmode="numeric" pattern="\d*"

                                   placeholder="Digite o código de 6 dígitos" id="inputCode">
                        </div>


                        <button id="btnValidateCode"
                                class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg">
                            <span class="btn-text">Confirmar</span>
                            <span class="btn-spinner hidden">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                        </span>
                        </button>

                        <!-- Timer -->
                        <p id="timerText" class="text-center text-gray-600 mb-4">
                            Você poderá reenviar o código em <span id="countdown">60</span>s

                        <!-- Botão Reenviar -->
                        <!--<button id="btnResendCode"
                                class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 hidden"
                                disabled>

                           style="pointer-events: none;">
                            Reenviar código
                        </a>



                        <!-- Voltar -->

                            <a href="{{URL}}/login"
                               class="text-primary-500 font-semibold text-base relative group">
                                Voltar ao Login

                            </a>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const btnValidate = document.getElementById("btnValidateCode");
        const btnResend   = document.getElementById("btnResendCode");
        const countdownEl = document.getElementById("countdown");
        const notyf = new Notyf({
            duration: 5000,
            position: { x: 'right', y: 'top' },
        });

        let countdown = 60;
        let timer;

        // -------- TIMER / COUNTDOWN --------
        function startCountdown() {
            btnResend.classList.add("hidden");
            btnResend.style.pointerEvents = "none";
            countdown = 60;
            countdownEl.textContent = countdown;

            timer = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(timer);
                    btnResend.classList.remove("hidden");
                    btnResend.style.pointerEvents = "auto";
                }
            }, 1000);
        }

        startCountdown();
        btnValidate.addEventListener("click", async () => {
            const code = document.getElementById("inputCode").value.trim();

            if (code.length !== 6 || !/^\d+$/.test(code)) {
                notyf.error("Código inválido. Digite 6 números.");
                return;
            }

            btnValidate.disabled = true;
            btnValidate.innerHTML = `<span class="loader border-2 border-t-2 border-white border-t-transparent rounded-full w-5 h-5 inline-block animate-spin"></span> Validando...`;

            const dataPost = new FormData();
            dataPost.append('code', code);

            try {
                const response = await fetch("{{URL}}/validate-reset-code", {
                    method: "POST",
                    body: dataPost
                });

                const data = await response.json();

                if (response.ok) {

                    notyf.success(data.message || "Código validado com sucesso!");

                    setTimeout(() => {
                        window.location.href = "{{URL}}/pass-confirmed";
                    }, 2000);

                } else {
                    notyf.error(data.message || "Código inválido.");
                }
            } catch (err) {
                console.error(err);
                notyf.error("Erro ao validar o código.");
            } finally {
                btnValidate.disabled = false;
                btnValidate.innerHTML = "Confirmar";
            }
        });

        // -------- REENVIAR CÓDIGO --------
        btnResend.addEventListener("click", async (e) => {
            e.preventDefault(); // previne reload

            try {
                const response = await fetch("{{URL}}/reset-code", {
                    method: "POST",
                });

                const data = await response.json();

                if (response.ok) {
                    notyf.success("Novo código enviado!");
                    startCountdown(); // reinicia o timer
                } else {
                    notyf.error(data.message || "Erro ao reenviar o código.");
                }
            } catch (err) {
                console.error(err);
                notyf.error("Erro na comunicação com o servidor.");
            }
        });
    });
</script>



</body>
</html>
