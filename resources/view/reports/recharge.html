<div id="table-resellers-wrapper" class="w-full px-6 py-6 mx-auto">
    <div class="flex flex-wrap -mx-3">
        <div class="w-full max-w-full px-3">
            <div class="relative flex flex-col min-w-0 break-words bg-white dark:bg-slate-850 shadow-xl rounded-2xl">

                <!-- Cabeçalho -->
                <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                    <h6 class="text-lg font-semibold text-slate-700 dark:text-slate-200">
                        👥 Painel de Recargas de Resellers
                    </h6>
                </div>

                <!-- Tabela -->
                <div class="p-6 overflow-x-auto">
                    <table id="table-resellers" class="min-w-full divide-y divide-gray-200 dark:divide-slate-700 text-sm center-header">
                        <thead class="bg-gray-50 dark:bg-slate-800 text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase">
                        <tr>
                            <th class="px-4 py-3">ID</th>
                            <th class="px-4 py-3">ID Transação</th>
                            <th class="px-4 py-3">E-mail</th>
                            <th class="px-4 py-3">Valor</th>
                            <th class="px-4 py-3">Tipo</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3">IP</th>
                            <th class="px-4 py-3">Data</th>
                            <th class="px-4 py-3">Comprovante</th>
                        </tr>
                        </thead>
                        <tbody class="bg-white dark:bg-slate-900 divide-y divide-gray-200 dark:divide-slate-700 text-sm text-slate-700 dark:text-slate-300 text-center">

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    /* Alinha menu e busca lado a lado */
    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .dataTables_wrapper .dataTables_length {
        float: left;
    }

    .dataTables_wrapper .dataTables_filter {
        float: right;
    }

    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input {
        margin-left: 0.5rem;
    }

    /* Remove margin lateral padrão */
    #table-sms_wrapper {
        margin-left: 0;
        margin-right: 0;
    }

    /* Reduz fontes e padding do info abaixo */
    .dataTables_wrapper .dataTables_info {
        font-size: 0.75rem;
        color: #475569; /* slate-600 */
        padding-top: 0.5rem;
    }

    /* Remove float no responsivo */
    @media (max-width: 640px) {
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            float: none;
            justify-content: space-between;
            flex-wrap: wrap;
        }
    }

    /* Faz o conteúdo da célula quebrar linhas e ter largura máxima ajustável */
    .break-message {
        white-space: normal;
        word-break: break-word;
    }

    /* Permite que a largura da célula se ajuste automaticamente */
    .auto-width-message {
        display: inline-block;
        max-width: 100%;
        width: auto;
        min-width: 150px;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // 🔹 Colunas Painel de Resellers (Admin)
        const resellersPanelColumns = [
            { data: 'id', className: "dt-head-center dt-body-center", render: d => `#${d}` },
            { data: 'transaction_id', className: "dt-head-center dt-body-center" },
            { data: 'email', className: "dt-head-center dt-body-center" },
            { data: 'balance', className: "dt-head-center dt-body-center",
                render: d => {
                    const value = parseFloat(d || 0);
                    const formatted = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
                    const classes = value >= 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    return `<span class="px-2 py-1 rounded-full text-sm font-semibold ${classes}">${formatted}</span>`;
                }
            },
            { data: 'type', className: "dt-head-center dt-body-center" },
            { data: 'status', className: "dt-head-center dt-body-center",
                render: d => {
                    const map = {
                        'completed': { text: 'Concluído', classes: 'bg-green-100 text-green-800' },
                        'pending':   { text: 'Pendente', classes: 'bg-yellow-100 text-yellow-800' },
                        'failed':    { text: 'Falhou',   classes: 'bg-red-100 text-red-800' }
                    };
                    const status = map[d?.toLowerCase()] || { text: d, classes: 'bg-gray-100 text-gray-800' };
                    return `<span class="px-2 py-1 rounded-full text-sm font-semibold ${status.classes}">${status.text}</span>`;
                }
            },
            { data: 'client_ip', className: "dt-head-center dt-body-center" },
            { data: 'created_at', className: "dt-head-center dt-body-center",
                render: d => d ? new Date(d).toLocaleString('pt-BR') : '-' },

            {
                data: 'id',
                className: "dt-head-center dt-body-center",
                render: id => id
                    ? `<a href="generate/${id}/invoice" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center justify-center p-2 text-red-600 hover:text-red-800 transition"
                title="Gerar comprovante (PDF)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20" fill="currentColor">
                    <path d="M240 112L128 112C119.2 112 112 119.2 112 128L112 512C112 520.8 119.2 528 128 528L208 528L208 576L128 576C92.7 576 64 547.3 64 512L64 128C64 92.7 92.7 64 128 64L261.5 64C278.5 64 294.8 70.7 306.8 82.7L429.3 205.3C441.3 217.3 448 233.6 448 250.6L448 400.1L400 400.1L400 272.1L312 272.1C272.2 272.1 240 239.9 240 200.1L240 112.1zM380.1 224L288 131.9L288 200C288 213.3 298.7 224 312 224L380.1 224zM272 444L304 444C337.1 444 364 470.9 364 504C364 537.1 337.1 564 304 564L292 564L292 592C292 603 283 612 272 612C261 612 252 603 252 592L252 464C252 453 261 444 272 444zM304 524C315 524 324 515 324 504C324 493 315 484 304 484L292 484L292 524L304 524zM400 444L432 444C460.7 444 484 467.3 484 496L484 560C484 588.7 460.7 612 432 612L400 612C389 612 380 603 380 592L380 464C380 453 389 444 400 444zM432 572C438.6 572 444 566.6 444 560L444 496C444 489.4 438.6 484 432 484L420 484L420 572L432 572zM508 464C508 453 517 444 528 444L576 444C587 444 596 453 596 464C596 475 587 484 576 484L548 484L548 508L576 508C587 508 596 517 596 528C596 539 587 548 576 548L548 548L548 592C548 603 539 612 528 612C517 612 508 603 508 592L508 464z"/>
                </svg>
        </a>`
                    : '-'
            }
        ];

        // 🔹 Inicializa DataTable (Admin apenas)
        function initResellersPanel() {
            // Garante que o wrapper esteja visível
            $('#table-resellers-wrapper').removeClass('hidden');

            // Destrói DataTable existente, se houver
            if ($.fn.DataTable.isDataTable('#table-resellers')) {
                $('#table-resellers').DataTable().destroy();
                $('#table-resellers tbody').empty();
            }

            $('#table-resellers').DataTable({
                responsive: true,
                serverSide: true,
                processing: true,
                pageLength: 10,
                autoWidth: false,
                ajax: {
                    url: 'recharge-realtime', // endpoint backend
                    type: 'GET',
                    dataSrc: json => json.data || []
                },
                columns: resellersPanelColumns,
                order: [[0, 'desc']],
                language: {
                    lengthMenu: "_MENU_",
                    zeroRecords: "Nenhum Registro encontrado",
                    info: "_START_-_END_ de _TOTAL_",
                    infoEmpty: "Nenhum Registro encontrado",
                    infoFiltered: "(de _MAX_)",
                    search: "🔍",
                    paginate: { first: "«", last: "»", next: "›", previous: "‹" }
                },
                drawCallback: function(settings) {
                    if (typeof feather !== 'undefined') feather.replace();
                }
            });
        }

        // 🔹 Inicializa tabela
        initResellersPanel();

    });
</script>
