<div class="w-full px-6 py-6 mx-auto">
    <div class="flex flex-wrap -mx-3">
        <div class="flex-none w-full max-w-full px-3">
            <div class="relative flex flex-col min-w-0 mb-6 bg-white dark:bg-slate-850 shadow-xl rounded-2xl border border-slate-100 dark:border-slate-700">

                <div class="flex items-center gap-3 px-6 pt-6 pb-3">
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-blue-500 text-white text-lg shadow-lg shadow-blue-200">
                        <i class="ni ni-credit-card"></i>
                    </span>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 dark:text-white uppercase italic tracking-tighter">Planos de Recarga</h2>
                        <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Escolha seu pacote de créditos</p>
                    </div>
                </div>

                <div class="flex-auto p-6 pb-12">
                    <div id="plansContainer" class="flex flex-wrap -mx-3 justify-center items-start gap-y-12">
                        <div class="w-full text-center py-10">
                            <p class="text-slate-400 animate-pulse font-bold uppercase tracking-widest text-xs italic">
                                Buscando planos...
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalPix" class="fixed inset-0 z-[999] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 transition-all duration-300">
    <div id="modalPixContent" class="relative bg-white dark:bg-slate-850 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] w-full max-w-[360px] p-6 border border-slate-100 dark:border-slate-700 transform transition-all scale-95 opacity-0">

        <button onclick="closePixModal()" class="absolute top-6 right-6 text-slate-400 hover:text-rose-500 transition-colors duration-200">
            <i class="fa fa-times text-lg"></i>
        </button>

        <div class="mb-4 flex flex-col gap-3">
            <div class="flex items-center gap-3">
                <span class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-emerald-500/10 text-emerald-600 flex items-center justify-center shrink-0 shadow-sm">
                    <i class="fa fa-qrcode text-base"></i>
                </span>
                <h2 class="text-lg font-black text-slate-800 dark:text-white uppercase italic tracking-tighter leading-none">
                    Checkout Pix
                </h2>
            </div>

            <div class="pl-1 w-full">
                <div class="border-l-4 border-emerald-500/30 pl-3 flex flex-col">
                    <span id="planNameDisplay" class="block text-[10px] font-black text-slate-700 dark:text-slate-200 uppercase tracking-widest leading-tight">
                        PLANO SELECIONADO
                    </span>
                    <span id="planDescDisplay" class="block text-[9px] text-slate-400 font-bold uppercase tracking-tight leading-normal break-words whitespace-normal">
                        CARREGANDO DETALHES...
                    </span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-4 p-3 bg-slate-50 dark:bg-slate-900/50 rounded-[1.2rem] border border-slate-100 dark:border-slate-800 shadow-inner">
            <div class="text-center border-r border-slate-200 dark:border-slate-700 pr-1">
                <p class="text-[7px] font-black text-slate-400 uppercase mb-0.5">Tarifa Unitária</p>
                <p class="text-[10px] font-extrabold text-slate-700 dark:text-slate-200 italic">R$ <span id="smsVal">0,0000</span></p>
            </div>
            <div class="text-center pl-1">
                <p class="text-[7px] font-black text-slate-400 uppercase mb-0.5">Outros Serv.</p>
                <p class="text-[10px] font-extrabold text-slate-700 dark:text-slate-200 italic">R$ <span id="voiceVal">0,0000</span></p>
            </div>
        </div>

        <div class="text-center mb-4">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.1em] mb-0.5">Total da Recarga</p>
            <span id="valuePix" class="text-3xl font-black text-slate-800 dark:text-white italic tracking-tighter leading-none">R$ 0,00</span>
        </div>

        <div class="bg-white p-4 rounded-2xl mb-4 shadow-inner text-center border border-slate-100 w-fit mx-auto">

            <!-- Loader -->
            <div id="qr-loading" class="flex items-center justify-center w-32 h-32 mx-auto">
                <div class="animate-spin rounded-full h-8 w-8 border-2 border-blue-500 border-t-transparent"></div>
            </div>

            <!-- QR Code -->
            <img id="qr-code-image"
                 src=""
                 class="w-32 h-32 mx-auto rounded-lg hidden"
                 alt="QR Code Pix" />

            <!-- Fallback -->
            <p id="qr-error" class="text-xs text-red-500 mt-2 hidden">
                Erro ao carregar QR Code
            </p>

        </div>

        <div class="space-y-4">
            <input id="pixLine" readonly type="text" class="w-full rounded-2xl border-2 border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-400 p-4 text-[9px] font-bold outline-none text-center truncate" />

            <button id="btnCopyMain" onclick="textCopy()" class="w-full bg-emerald-500 text-white font-black uppercase tracking-[0.15em] py-4 rounded-xl shadow-xl shadow-emerald-500/20 hover:bg-emerald-600 active:scale-95 transition-all duration-300 text-[11px] flex items-center justify-center gap-2">
                <i class="fa fa-copy"></i>
                <span id="btnCopyText">Copiar código Pix</span>
            </button>
        </div>

        <div class="flex items-center justify-center gap-3 text-[10px] font-bold text-slate-500 mt-6 uppercase tracking-widest">
            <div class="flex items-center gap-1.5 opacity-60"><i class="fa fa-lock text-sm"></i> Segura</div>
            <span class="text-slate-200">|</span>
            <div class="flex items-center gap-1.5">
                <i class="fa fa-clock text-rose-500 animate-pulse"></i>
                Expira em <span id="countdown" class="text-rose-500 font-black text-sm">10:00</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Recuperando a animação de toggle suave
    let countdownTimer;
    window.pixStatusInterval = null;
    window.pixCountdownInterval = null;

    // Única função necessária para carregar e mostrar os planos
    async function loadPlans(type = 'sms') {
        const container = document.getElementById('plansContainer');
        if (!container) return;

        try {
            const response = await fetch(`${baseURL}/refills/${type}/plans`);
            const result = await response.json();
            const plans = result.plans;

            container.innerHTML = "";

            // Garante que os populares fiquem no topo
            plans.sort((a, b) => (b.is_popular || 0) - (a.is_popular || 0));

            plans.forEach((plan) => {
                const isPopular = plan.is_popular === true || plan.is_popular === 1;

                const card = `
            <div class="w-full lg:w-4/12 px-3 flex">
                <div class="relative flex flex-col h-full w-full p-8 ${isPopular ? 'bg-white border-2 border-indigo-500 shadow-2xl z-10' : 'bg-slate-50 border border-slate-200'} dark:bg-slate-800 dark:border-slate-700 rounded-[2.5rem] transition-all duration-500 hover:-translate-y-4">

                    ${isPopular ? `<span class="absolute -top-3 left-1/2 -translate-x-1/2 px-4 py-1.5 bg-indigo-600 text-white text-[9px] font-black uppercase tracking-widest rounded-full shadow-lg">Popular</span>` : ""}

                    <div class="mb-6 mt-2 text-center lg:text-left">
                        <h3 class="text-xl font-bold text-indigo-600 uppercase italic tracking-tighter leading-none">${plan.name}</h3>
                        <p class="text-[10px] text-slate-400 mt-2 font-bold uppercase tracking-tight italic">${plan.desc}</p>
                    </div>

                    <div class="mb-8 text-center lg:text-left">
                        <span class="text-4xl font-black text-slate-800 dark:text-white italic tracking-tighter">R$ ${plan.price}</span>
                    </div>

                    <button onclick="generatePix(this, '${plan.id}', '${plan.name}', 'R$ ${plan.price}', '${plan.desc}', '${plan.v_sms}', '${plan.v_voice}')"
                            id="buyButton_${plan.id}"
                            class="w-full py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest ${isPopular ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-700 text-white'} transition-all active:scale-95 mb-4 hover:opacity-90">
                        Recarregar Agora
                    </button>

                    <button onclick="toggleDetails(this)" class="group flex items-center justify-center gap-2 w-full text-[9px] font-black text-slate-400 uppercase tracking-widest hover:text-indigo-500 transition-all outline-none">
                        <span>Ver Detalhes do Plano</span> <i class="fa fa-chevron-down transition-transform duration-300"></i>
                    </button>

                    <div class="details-panel hidden mt-6 pt-6 border-t border-slate-100 dark:border-slate-700 space-y-4 animate-fadeIn">

                        <div class="w-full p-3 bg-slate-100 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 text-center">
                            <p class="text-[8px] font-black text-slate-500 uppercase mb-1 tracking-widest">Taxa de Sistema (Manutenção)</p>
                            <p class="text-xs font-black text-slate-800 dark:text-white italic">R$ ${plan.service_fee || '0,00'}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-center">
                            <div class="p-2 bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">SMS</p>
                                <p class="text-[9px] font-bold text-indigo-500 italic">R$ ${plan.v_sms}</p>
                            </div>
                            <div class="p-2 bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">WhatsApp</p>
                                <p class="text-[9px] font-bold text-indigo-500 italic">R$ ${plan.v_whatsapp}</p>
                            </div>
                            <div class="p-2 bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Voz</p>
                                <p class="text-[9px] font-bold text-indigo-500 italic">R$ ${plan.v_voice}</p>
                            </div>
                            <div class="p-2 bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Torpedo</p>
                                <p class="text-[9px] font-bold text-indigo-500 italic">R$ ${plan.v_torpedo}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-center">
                            <div class="p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Usuários</p>
                                <p class="text-[9px] font-bold text-slate-700 dark:text-white uppercase italic">${plan.users_y_n}</p>
                            </div>
                            <div class="p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Acessos Sim.</p>
                                <p class="text-[9px] font-bold text-slate-700 dark:text-white uppercase italic">${plan.access}</p>
                            </div>
                            <div class="p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Campanhas</p>
                                <p class="text-[9px] font-bold text-slate-700 dark:text-white uppercase italic">${plan.camp}</p>
                            </div>
                            <div class="p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-100 dark:border-slate-800">
                                <p class="text-[7px] font-black text-slate-400 uppercase mb-1 leading-none">Relatórios</p>
                                <p class="text-[9px] font-bold text-slate-700 dark:text-white uppercase italic">Sim</p>
                            </div>
                        </div>

                        <div class="p-3 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl border border-indigo-100 dark:border-indigo-800">
                            <div class="flex flex-col gap-2 mb-3 border-b border-indigo-100 dark:border-indigo-800 pb-2">
                                <span class="text-[8px] font-black text-indigo-600 dark:text-indigo-400 uppercase tracking-widest text-center">
                                    <i class="fa fa-layer-group"></i> Sistema Multicanal Ativado
                                </span>
                                <div class="flex justify-center gap-3 text-[10px] text-indigo-500">
                                    <i class="fa fa-comment-dots" title="SMS"></i>
                                    <i class="fa fa-phone" title="Voz"></i>
                                    <i class="fa fa-whatsapp" title="WhatsApp"></i>
                                    <i class="fa fa-bullhorn" title="Torpedos"></i>
                                </div>
                            </div>
                            <p class="text-[9px] text-slate-600 dark:text-slate-400 italic font-medium leading-tight text-center italic">
                                ${plan.desc}
                            </p>
                        </div>
                    </div>
                </div>
            </div>`;
                container.innerHTML += card;
            });
        } catch (error) {
            console.error("Erro na carga total:", error);
        }
    }

    // Inicia automático
    document.addEventListener('DOMContentLoaded', () => loadPlans('sms'));

    // Função para o Collapse (Ver detalhes)
    function toggleDetails(btn) {
        const panel = btn.nextElementSibling;
        const icon = btn.querySelector('i');
        if (panel.classList.contains('hidden')) {
            panel.classList.remove('hidden');
            panel.classList.add('animate-fadeIn');
            icon.style.transform = 'rotate(180deg)';
        } else {
            panel.classList.add('hidden');
            icon.style.transform = 'rotate(0deg)';
        }
    }

    async function generatePix(btn, planId, name, price, desc, vSms, vVoice) {
        // Feedback de loading no botão do card
        const originalContent = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `
        <svg class="animate-spin h-4 w-4 mr-2 inline-block text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg> Gerando...
    `;

        try {
            // Chamada ao seu backend (usando a rota do seu código antigo)
            const response = await fetch(`${baseURL}/refills/${planId}/checkout-pix`);
            const result = await response.json();

            if (response.ok && result.data) {
                // Preenche o modal com os dados vindos do banco/Asaas
                openPixModalUI({
                    name: name,
                    price: `R$ ${parseFloat(result.value || price.replace('R$ ', '').replace(',', '.')).toFixed(2)}`,
                    desc: desc,
                    payload: result.data.payload,
                    encodedImage: result.data.encodedImage,
                    vSms: vSms,
                    vVoice: vVoice
                });

                // Inicia o Polling (Verificar se pagou)
                const pixId = result.data.id;
                const externalRef = result.data.externalReference;

                clearInterval(window.pixStatusInterval);
                window.pixStatusInterval = setInterval(() => {
                    checkPixStatus(pixId, externalRef);
                }, 10000); // 10 segundos

            } else {
                notyf.error(result.message || 'Erro ao gerar cobrança.');
            }
        } catch (error) {
            console.error('Erro:', error);
            notyf.error('Erro de conexão com o servidor.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalContent;
        }
    }

    // Função Modal Pix (Blindada contra erro de ID)
    function openPixModalUI(data) {
        console.log("Dados recebidos no Modal UI:", data); // Debug: Veja o que está chegando

        try {
            const modal = document.getElementById('modalPix');
            const content = document.getElementById('modalPixContent');
            const qrImage   = document.getElementById('qr-code-image');
            const qrLoading = document.getElementById('qr-loading');
            const qrError   = document.getElementById('qr-error');

            // 1. Validação básica: se não houver imagem, algo está muito errado
            if (!data || !data.encodedImage) {
                console.error("Erro: encodedImage não definido!");
                return;
            }

            // 2. Injeção de textos (usando opcional para não quebrar se o ID não existir)
            if(document.getElementById('planNameDisplay')) document.getElementById('planNameDisplay').textContent = data.name || 'Plano';
            if(document.getElementById('planDescDisplay')) document.getElementById('planDescDisplay').textContent = data.desc || '';
            if(document.getElementById('valuePix')) document.getElementById('valuePix').textContent = data.price || 'R$ 0,00';
            if(document.getElementById('pixLine')) document.getElementById('pixLine').value = data.payload || '';
            if(document.getElementById('smsVal')) document.getElementById('smsVal').textContent = data.vSms || '0,0000';
            if(document.getElementById('voiceVal')) document.getElementById('voiceVal').textContent = data.vVoice || '0,0000';

            // 3. QR Code Image - Tratando o Base64
            //const qrImage = document.getElementById('qr-code-image');

            if (qrImage) {

                // Reset visual
                qrImage.classList.add('hidden');
                qrError.classList.add('hidden');
                qrLoading.classList.remove('hidden');

                if (data.encodedImage) {

                    let base64Limpo = data.encodedImage.replace(/\s/g, '');

                    let srcFinal = base64Limpo.startsWith('data:')
                        ? base64Limpo
                        : `data:image/png;base64,${base64Limpo}`;

                    try {
                        atob(srcFinal.split(',')[1]);

                        qrImage.onload = () => {
                            qrLoading.classList.add('hidden');
                            qrImage.classList.remove('hidden');
                        };

                        qrImage.onerror = () => {
                            qrLoading.classList.add('hidden');
                            qrError.classList.remove('hidden');
                        };

                        qrImage.src = srcFinal;

                    } catch (e) {
                        qrLoading.classList.add('hidden');
                        qrError.classList.remove('hidden');
                    }

                } else {
                    qrLoading.classList.add('hidden');
                    qrError.classList.remove('hidden');
                }
            }

            // 4. Mostrar Modal com animação
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // Pequeno delay para garantir que o 'flex' foi aplicado antes da transição
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 50);

            startCountdown(600);

        } catch (err) {
            console.error("Erro crítico na renderização do modal:", err);
        }
    }

    async function checkPixStatus(id, externalReference) {
        try {
            const response = await fetch(`${baseURL}/refills/${id}/status-pix`);
            const result = await response.json();

            // Se o status for RECEIVED ou CONFIRMED (depende do retorno do seu PHP)
            if (result.status === 200 && (result.data === 'RECEIVED' || result.data === 'CONFIRMED')) {
                clearInterval(window.pixStatusInterval);
                clearInterval(window.pixCountdownInterval);

                notyf.success('Pagamento confirmado com sucesso!');

                // Aguarda um pouco e fecha o modal ou redireciona
                setTimeout(() => {
                    closePixModal();
                    // window.location.reload(); // Opcional: recarrega para atualizar saldo
                }, 3000);
            }
        } catch (error) {
            console.error('Erro ao verificar status:', error);
        }
    }

    function startCountdown(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById('countdown');
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            display.textContent = minutes + ":" + seconds;
            if (--timer < 0) {
                clearInterval(countdownTimer);
                display.textContent = "EXPIRADO";
            }
        }, 1000);
    }

    function closePixModal() {
        const modal = document.getElementById('modalPix');
        const content = document.getElementById('modalPixContent');
        clearInterval(countdownTimer);
        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 200);
    }

    // AJUSTE 3: JavaScript Inteligente para Feedback de Cópia
    function textCopy() {
        const pixLineInput = document.getElementById('pixLine');
        const btnText = document.getElementById('btnCopyText');
        const btn = document.getElementById('btnCopyMain');
        const icon = btn.querySelector('i'); // Pega o ícone dentro do botão

        // Tenta copiar o texto do input
        if (pixLineInput && pixLineInput.value !== '...') {
            pixLineInput.select();
            pixLineInput.setSelectionRange(0, 99999); // Para dispositivos móveis
            navigator.clipboard.writeText(pixLineInput.value)
                .then(() => {
                    // SUCESSO na Cópia - Feedback Visual

                    // Mudar aparência do botão
                    btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
                    btn.classList.add('bg-sky-600'); // Cor de sucesso azul céu

                    // Mudar ícone e texto
                    icon.classList.remove('fa-copy');
                    icon.classList.add('fa-check');
                    btnText.textContent = "Código Copiado!";

                    // Reverter após 2 segundos
                    setTimeout(() => {
                        btn.classList.remove('bg-sky-600');
                        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');

                        icon.classList.remove('fa-check');
                        icon.classList.add('fa-copy');
                        btnText.textContent = "Copiar código Pix";
                    }, 2000);
                })
                .catch(err => {
                    console.error('Falha ao copiar:', err);
                    alert('Erro ao copiar código. Tente selecionar e copiar manualmente.');
                });
        } else {
            alert('Aguardando geração do código Pix...');
        }
    }

</script>

<style>
    /* Animação suave para o painel de detalhes */
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
        animation: slideDown 0.4s ease-out forwards;
    }
</style>
