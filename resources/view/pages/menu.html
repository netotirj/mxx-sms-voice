<aside id="sidenav-main" class="fixed inset-y-0 block w-full max-w-64 p-0 my-4 overflow-y-auto transition-transform duration-200 bg-white border-0 shadow-xl dark:bg-slate-850 xl:ml-6 xl:left-0 xl:translate-x-0 -translate-x-full rounded-2xl antialiased ease-nav-brand z-[990]">

  <div class="px-8 py-6">
    <a class="block text-sm whitespace-nowrap text-slate-700 dark:text-white" href="{{URL}}/dashboard">
      <img src="{{URL}}/resources/assets/img/maxx-logo-transparent-128.png" class="inline h-9 w-9 object-contain align-middle transition-all duration-200" alt="main_logo"/>
      <span class="ml-1 font-semibold">Maxx Solutions</span>
    </a>
  </div>

  <hr class="h-px mt-0 bg-transparent bg-gradient-to-r from-transparent via-black/40 to-transparent dark:via-white"/>

  <div class="block w-auto h-sidenav max-h-screen grow basis-full">
    <ul class="flex flex-col pl-0 mb-0">

      {{item_dashboard}}
      {{item_mensageria}}
      {{item_whatsapp}}
      {{item_voz}}
      {{item_suporte}}
      {{item_recargas}}
      {{item_relatorios}}
      {{item_usuarios}}

    </ul>
  </div>
</aside>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const path = window.location.pathname.replace(/\/$/, '');
    const currentFullPath = path + window.location.search + window.location.hash;
    const navLinks = document.querySelectorAll('a.nav-link');
    let submenuToOpen = null;

    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;
      const hrefUrl = new URL(href, window.location.origin);
      const hrefPath = hrefUrl.pathname.replace(/\/$/, '');
      const hrefFullPath = hrefPath + hrefUrl.search + hrefUrl.hash;
      const hrefHasState = hrefUrl.search !== '' || hrefUrl.hash !== '';
      const currentHasState = window.location.search !== '' || window.location.hash !== '';

      if ((hrefHasState && currentFullPath === hrefFullPath) || (!hrefHasState && !currentHasState && path === hrefPath)) {
        const isInsideSubmenu = link.closest('.submenu-items');

        // Mantemos o texto estático: pl-6 apenas no principal
        if (isInsideSubmenu) {
          link.classList.add('bg-blue-500/10', 'font-semibold', 'text-slate-700');
        } else {
          link.classList.add('bg-blue-500/10', 'font-semibold', 'text-slate-700', 'pl-6');
        }

        if (!link.querySelector('.active-dot')) {
          const dot = document.createElement('span');

          if (isInsideSubmenu) {
            // PARA SUBMENU:
            // O segredo está no left-8. Ele entra exatamente no espaço do recuo do Argon.
            dot.className = 'active-dot absolute left-8 top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-gradient-to-tl from-blue-500 to-violet-500 z-50';
          } else {
            // PARA MENU PRINCIPAL:
            dot.className = 'active-dot absolute left-3 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-gradient-to-tl from-blue-500 to-violet-500 z-50';
          }

          // USAR PREPEND PARA O POSICIONAMENTO FICAR RELATIVO AO INÍCIO DO BOTÃO
          link.prepend(dot);
        }

        const submenu = link.closest('.submenu');
        if (submenu && !submenuToOpen) submenuToOpen = submenu;
      } else {
        link.classList.remove('bg-blue-500/10', 'font-semibold', 'text-slate-700', 'pl-6');
        const existingDot = link.querySelector('.active-dot');
        if (existingDot) existingDot.remove();
      }
    });

    // Lógica do Toggle (seu padrão)
    document.querySelectorAll('.submenu-header').forEach(header => {
      header.addEventListener('click', function() {
        const submenu = this.closest('.submenu');
        const items = submenu.querySelector('.submenu-items');
        const isOpen = submenu.classList.toggle('open');
        items.style.maxHeight = isOpen ? `${items.scrollHeight}px` : '0px';
        const toggle = this.querySelector('.submenu-toggle');
        if(toggle) toggle.classList.toggle('rotate-180', isOpen);
      });
    });

    if (submenuToOpen) {
      submenuToOpen.classList.add('open');
      const items = submenuToOpen.querySelector('.submenu-items');
      items.style.maxHeight = `${items.scrollHeight}px`;
      const toggle = submenuToOpen.querySelector('.submenu-toggle');
      if(toggle) toggle.classList.add('rotate-180');
    }
  });
</script>
