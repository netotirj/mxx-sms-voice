<div class="w-full px-6 py-6 mx-auto">

    <div class="flex flex-wrap -mx-3">
        <div class="flex-none w-full max-w-full px-3">
            <div class="relative flex flex-col min-w-0 mb-6 bg-white shadow-xl rounded-2xl border border-slate-100">

                <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between px-6 pt-6 pb-3">

                    <div class="flex items-center gap-2">
                        <span
                                class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 text-lg">
                            🎵
                        </span>
                        <div>
                            <h2 class="text-lg font-semibold text-slate-800">Biblioteca de Áudios</h2>
                            <p class="text-xs text-slate-400">Gerenciamento centralizado de arquivos de áudio e gravações</p>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 justify-end">

                        <button id="audioExportCsv"
                                class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium rounded-lg
                                       bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">
                            <span class="text-base">📄</span> CSV
                        </button>

                        <button id="audioReloadBtn"
                                class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium rounded-lg
                                       bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">
                            <span class="text-base">🔄</span> Recarregar
                        </button>

                        <button onclick="openAudioModal()"
                                class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-bold rounded-lg
                       bg-gradient-to-tl from-emerald-600 to-teal-400 text-white hover:opacity-85 transition shadow-sm uppercase">
                            <span class="text-base">➕</span> Enviar Áudio
                        </button>

                        <div class="flex items-center gap-2 ml-2">
                            <label class="inline-flex relative items-center cursor-pointer">

                                <input id="audioAutoReload" type="checkbox"
                                       class="sr-only peer">

                                <div class="w-11 h-6 bg-gray-300 rounded-full transition-all
                                        peer-checked:bg-emerald-500"></div>

                                <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow
                                        transition-all peer-checked:translate-x-full"></div>

                                <span class="ml-2 text-xs text-slate-600">Auto</span>

                            </label>

                            <select id="audioReloadInterval"
                                    class="px-2 py-1 text-xs border border-slate-200 rounded-lg bg-white text-slate-700">
                                <option value="5000">5s</option>
                                <option value="10000" selected>10s</option>
                                <option value="30000">30s</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="px-6 pb-4 pt-3 bg-slate-50 border-y border-slate-100">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">

                        <div>
                            <label class="text-xs font-medium text-slate-500">Mostrar</label>
                            <select id="audioRowsPerPage"
                                    class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm
                                           bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-medium text-slate-500">Status</label>
                            <select id="audioStatusFilter"
                                    class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm
                                           bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <option value="">Todos</option>
                                <option value="Ativo">Ativo</option>
                                <option value="Inativo">Inativo</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-medium text-slate-500">Origem</label>
                            <select id="audioOriginFilter"
                                    class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm
                                           bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <option value="">Todas</option>
                                <option value="upload">Upload</option>
                                <option value="api">API</option>
                                <option value="tts">TTS</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-medium text-slate-500">De</label>
                            <input type="date" id="audioDateFrom"
                                   class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm
                                          bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="text-xs font-medium text-slate-500">Até</label>
                            <input type="date" id="audioDateTo"
                                   class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm
                                          bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>

                        <div class="md:col-span-2 lg:col-span-1">
                            <label class="text-xs font-medium text-slate-500">Buscar</label>
                            <div class="relative mt-1">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M16 10a6 6 0 11-12 0 6 6 0 0112 0z"/>
                                    </svg>
                                </span>
                                <input id="audioSearchInput"
                                       class="w-full pl-9 pr-3 py-1.5 border border-slate-200 rounded-lg text-sm
                                              bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                       placeholder="Nome do áudio...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-auto px-0 pt-0 pb-2">
                    <div class="p-0 overflow-x-auto">
                        <table id="audio-table"
                               class="w-full text-sm text-slate-700 border-collapse text-center">
                            <thead class="bg-slate-100 text-xs uppercase tracking-wide">
                            <tr>
                                <th class="px-4 py-2 border border-slate-100">Criação</th>
                                <th class="px-4 py-2 border border-slate-100 text-left">Nome do Áudio</th>
                                <th class="px-4 py-2 border border-slate-100">Player</th>
                                <th class="px-4 py-2 border border-slate-100">Formato</th>
                                <th class="px-4 py-2 border border-slate-100">Status</th>
                                <th class="px-4 py-2 border border-slate-100">Ações</th>
                            </tr>
                            </thead>
                            <tbody id="audioTableBody">
                            <tr>
                                <td colspan="6"
                                    class="px-4 py-6 text-center text-slate-400 italic">
                                    Carregando áudios...
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="audioStats"
                     class="hidden mx-6 mb-4 mt-1 p-4 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-700">
                </div>

                <div class="px-6 py-4 flex justify-between items-center border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/30 rounded-b-2xl">
                    <p id="audioPageInfo" class="text-xxs font-bold text-slate-400 uppercase">Página 1 de 1</p>
                    <div class="flex gap-1 items-center">
                        <button id="audioPrevPage" class="px-3 py-1 text-xs font-bold border border-slate-200 rounded-lg disabled:opacity-50 transition-all">Anterior</button>
                        <div id="audioPageNumbers" class="flex gap-1"></div>
                        <button id="audioNextPage" class="px-3 py-1 text-xs font-bold border border-slate-200 rounded-lg disabled:opacity-50 transition-all">Próximo</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>


<div id="audioModal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div id="audioModalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeAudioModal()"></div>

    <div class="flex min-h-full items-center justify-center p-4 lg:pl-[280px]">

        <div id="audioModalContent"
             class="relative bg-white dark:bg-slate-850 rounded-2xl shadow-2xl
                    w-full max-w-2xl transition-all duration-200
                    max-h-[90vh] flex flex-col overflow-hidden">

            <div class="flex items-center justify-between p-6 border-b dark:border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center shadow-sm">
                        <i class="fas fa-music text-lg"></i>
                    </div>
                    <div>
                        <h5 class="text-lg font-bold text-slate-800 dark:text-white mb-0">Enviar Áudios</h5>
                        <p class="text-xs text-slate-400 mb-0">Importe arquivos MP3 ou WAV</p>
                    </div>
                </div>
                <button onclick="closeAudioModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-1">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="flex flex-col">
                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Nome do Áudio (Opcional)</label>
                        <input id="importAudioName" type="text"
                               placeholder="Ex: Saudação Inicial"
                               class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-white"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 ml-1">Selecionar Arquivo</label>
                        <label for="audioFile"
                               class="flex items-center justify-center w-full h-[42px] border-2 border-dashed border-emerald-500/30 dark:border-emerald-500/20 rounded-xl cursor-pointer bg-emerald-50/30 dark:bg-slate-800 hover:bg-emerald-50 transition-all">
                            <div class="flex items-center gap-2 text-emerald-600">
                                <i class="fas fa-plus-circle"></i>
                                <p class="text-xs font-bold mb-0 uppercase tracking-tight">Escolher MP3 ou WAV</p>
                            </div>
                            <input id="audioFile" type="file" accept=".mp3,.wav" class="hidden" multiple onchange="handleFileSelection(this)"/>
                        </label>
                    </div>
                </div>

                <p id="previewAudioName" class="text-xs mt-2 truncate w-full text-center font-bold text-emerald-600 hidden"></p>

                <div id="audioList" class="space-y-3 mt-4">
                </div>

            </div>

            <div class="p-6 bg-slate-50 dark:bg-slate-800/50 border-t dark:border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <p id="voiceCount" class="text-xs font-bold text-emerald-600 mb-0 hidden"></p>
                </div>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button onclick="closeAudioModal()" class="flex-1 sm:flex-none px-6 py-2.5 text-xs font-bold text-slate-400 uppercase hover:text-slate-600 transition-colors">
                        Cancelar
                    </button>
                    <button id="uploadAllBtn"
                            class="flex-1 sm:flex-none px-8 py-2.5 text-xs font-bold text-white bg-gradient-to-tl from-emerald-600 to-teal-400 rounded-xl shadow-md hover:scale-[1.02] active:opacity-85 transition-all uppercase">
                        Enviar Todos
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ======= ESTADO GLOBAL =======
    let manualAudios = [];            // Fila de upload
    const audioPlayers = {};          // Players do Modal
    let allRows = [];                 // Dados brutos (JSON)
    let filteredRows = [];            // Dados filtrados
    let currentPage = 1;              // Paginação

    document.addEventListener('DOMContentLoaded', function () {
        const baseUrlElement = document.querySelector('meta[name="base-url"]');
        const baseUrl = baseUrlElement ? baseUrlElement.getAttribute('content') : '';
        const tbody = document.getElementById('audioTableBody');

        // --- 1. CARGA INICIAL DA TABELA ---
        if (tbody) {
            fetch(`${baseUrl}/campaign/voice/audios-search`)
                .then(r => r.json())
                .then(result => {
                    if (result.success && Array.isArray(result.data)) {
                        // Mapeia os dados do seu JSON para o padrão da tabela
                        allRows = result.data.map(audio => ({
                            id: audio.id,
                            token: audio.token,
                            name: audio.name || audio.display_name,
                            url: audio.url,
                            status: 'Ativo', // Padronizado como Ativo conforme JSON
                            created: audio.created_at ? new Date(audio.created_at).toLocaleString('pt-BR') : '--',
                            origem: audio.extension ? audio.extension.toUpperCase() : 'WAV'
                        }));

                        filteredRows = allRows;
                        renderAudioTable(); // <--- RENDERIZAÇÃO INICIAL
                    }
                }).catch(err => {
                console.error("Erro ao carregar áudios:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-red-500 italic">Erro ao carregar áudios.</td></tr>`;
            });
        }

        // Inicializa listeners de filtros e modal
        setupFilterListeners();
        setupUploadAllListener();
    });

    // ======= 1. FUNÇÕES DA TABELA =======

    function renderAudioTable() {
        const tbody = document.getElementById('audioTableBody');
        const rowsPerPageSelect = document.getElementById('audioRowsPerPage');
        const pageInfo = document.getElementById('audioPageInfo');
        const prevBtn = document.getElementById('audioPrevPage');
        const nextBtn = document.getElementById('audioNextPage');

        if (!tbody) return;
        tbody.innerHTML = '';

        const perPage = parseInt(rowsPerPageSelect?.value || 10, 10);
        const start = (currentPage - 1) * perPage;
        const rows = filteredRows.slice(start, start + perPage);

        if (rows.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6" class="px-4 py-8 text-center text-slate-400 italic font-medium">
                    Nenhum áudio encontrado com os filtros aplicados.
                </td>
            </tr>`;
        } else {
            rows.forEach(audio => {
                const badge = audio.status === 'Ativo' ? 'bg-emerald-500' : 'bg-slate-400';

                const formato = (audio.formato || audio.origem || audio.extension || '-').toString().toUpperCase();
                const formatoLower = formato.toLowerCase();

                const mimeType =
                    formatoLower === 'wav' ? 'audio/wav' :
                        formatoLower === 'ogg' ? 'audio/ogg' :
                            formatoLower === 'mp3' ? 'audio/mpeg' :
                                formatoLower === 'mpeg' ? 'audio/mpeg' :
                                    'audio/mpeg';

                tbody.insertAdjacentHTML('beforeend', `
                <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
                    <td class="px-4 py-3 text-xs text-slate-500">
                        ${audio.created || '-'}
                    </td>

                    <td class="px-4 py-3 text-left">
                        <div class="flex items-center gap-2">
                            <span class="text-emerald-500 text-base">🎵</span>
                            <span class="text-sm font-bold text-slate-700">
                                ${audio.name || 'Sem nome'}
                            </span>
                        </div>
                    </td>

                    <td class="px-4 py-3 text-center">
                        ${audio.url
                    ? `<audio controls class="h-8 mx-auto w-44">
                                   <source src="${audio.url}" type="${mimeType}">
                                   Seu navegador não suporta áudio.
                               </audio>`
                    : '<span class="text-xxs italic text-slate-400">Sem URL</span>'
                }
                    </td>

                    <td class="px-4 py-3 text-center">
                        <span class="inline-flex items-center px-2 py-1 rounded-md bg-slate-100 text-slate-600 text-[11px] font-bold uppercase">
                            ${formato}
                        </span>
                    </td>

                    <td class="px-4 py-3 text-center">
                        <span class="${badge} px-2.5 py-1 text-[9px] rounded-lg font-bold uppercase text-white shadow-sm">
                            ${audio.status || '-'}
                        </span>
                    </td>

                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteAudio(${audio.id}, '${audio.token}', '${audio.name}')"
                                class="text-slate-400 hover:text-red-500 transition-all p-2">
                            <i class="fa fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>`);
            });
        }

        const totalPages = Math.ceil(filteredRows.length / perPage) || 1;

        if (pageInfo) pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
        if (prevBtn) prevBtn.disabled = (currentPage === 1);
        if (nextBtn) nextBtn.disabled = (currentPage === totalPages);

        const nav = document.getElementById('audioPageNumbers');
        if (nav) {
            nav.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                nav.insertAdjacentHTML('beforeend', `
                <button onclick="window.changeAudioPage(${i})"
                    class="px-3 py-1 text-xs font-bold border rounded-lg transition-all ${
                    i === currentPage
                        ? 'bg-emerald-500 border-emerald-500 text-white shadow-md'
                        : 'border-slate-200 hover:bg-slate-100 dark:text-white'
                }">
                    ${i}
                </button>
            `);
            }
        }
    }

    window.changeAudioPage = (p) => {
        currentPage = p;
        renderAudioTable();
    };

    // ======= 2. FILTROS (MÁQUINA DE BUSCA LOCAL) =======

    function setupFilterListeners() {
        const filterIds = ['audioSearchInput', 'audioStatusFilter', 'audioDateFrom', 'audioDateTo', 'audioRowsPerPage'];
        filterIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => {
                    applyAudioFilters();
                });
            }
        });
    }

    function applyAudioFilters() {
        const query = document.getElementById('audioSearchInput')?.value.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "").trim() || "";
        const status = document.getElementById('audioStatusFilter')?.value || "";

        filteredRows = allRows.filter(row => {
            const normName = row.name.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "");
            const mName = !query || normName.includes(query);
            const mStatus = !status || row.status === status;
            return mName && mStatus;
        });

        currentPage = 1;
        renderAudioTable();
    }

    // ======= 3. MODAL E FILA DE UPLOAD (AUTOMATIZADO) =======

    function openAudioModal() {
        document.getElementById('audioModal').classList.remove('hidden');
        // Garante que o listener do botão final de envio seja configurado
        setupUploadAllListener();
    }

    function closeAudioModal() {
        document.getElementById('audioModal').classList.add('hidden');
        // Para todos os players ao fechar para não ficar áudio tocando no fundo
        Object.keys(audioPlayers).forEach(k => {
            if (audioPlayers[k]) audioPlayers[k].pause();
        });
    }

    /**
     * Disparado automaticamente pelo onchange="handleFileSelection(this)" no HTML
     */
    function handleFileSelection(input) {
        const files = Array.from(input.files || []);
        if (files.length === 0) return;

        files.forEach(file => {
            // Validação básica de tamanho (5MB)
            if (file.size > 5 * 1024 * 1024) {
                return notyf.error(`Arquivo ${file.name} muito grande (Máx 5MB)`);
            }

            const id = crypto.randomUUID();
            // Adiciona à fila com nome padrão (sem a extensão do arquivo)
            manualAudios.push({
                id,
                name: file.name.replace(/\.[^/.]+$/, ""),
                file: file,
                progress: 0
            });
        });

        input.value = ''; // Limpa para permitir selecionar o mesmo arquivo novamente se quiser
        renderAudioQueue();
    }

    /**
     * Renderiza a lista com Player e Input de nome para cada áudio selecionado
     */
    function renderAudioQueue() {
        const list = document.getElementById('audioList');
        if (!list) return;

        if (manualAudios.length === 0) {
            list.innerHTML = '<p class="text-xs text-slate-400 italic text-center p-4">Nenhum áudio selecionado</p>';
            return;
        }

        list.innerHTML = manualAudios.map(audio => `
        <div class="border rounded-xl p-4 bg-slate-50 dark:bg-slate-800/50 mb-3 border-slate-200 dark:border-slate-700 shadow-sm transition-all">
            <div class="flex flex-col sm:flex-row items-center gap-3 mb-3">

                <div class="flex items-center gap-2 bg-white dark:bg-slate-700 px-3 py-2 rounded-full shadow-inner border dark:border-slate-600">
                    <button onclick="window.toggleQueueAudio('${audio.id}')" id="btn-q-${audio.id}" class="bg-emerald-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:scale-110 transition shadow-md">
                        <i class="fas fa-play text-[10px]" id="icon-q-${audio.id}"></i>
                    </button>
                    <div class="w-24 h-1.5 bg-slate-100 dark:bg-slate-500 rounded-full overflow-hidden">
                        <div id="bar-q-${audio.id}" class="h-full bg-emerald-500 w-0 transition-all"></div>
                    </div>
                </div>

                <div class="flex-1 w-full">
                    <input type="text" value="${audio.name}"
                           oninput="window.updateAudioName('${audio.id}', this.value)"
                           class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-bold outline-none focus:border-emerald-500 dark:bg-slate-800 dark:text-white transition-all"
                           placeholder="Nome do áudio">
                </div>

                <button onclick="window.removeFromQueue('${audio.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2">
                    <i class="fa fa-trash-alt"></i>
                </button>
            </div>

            <div class="h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                <div id="progress-q-${audio.id}" class="h-full bg-blue-500 transition-all shadow-[0_0_8px_rgba(59,130,246,0.5)]" style="width:${audio.progress}%"></div>
            </div>
        </div>
    `).join('');
    }

    // ======= AUXILIARES GLOBAIS PARA O MODAL =======

    window.updateAudioName = (id, newName) => {
        const audio = manualAudios.find(a => a.id === id);
        if (audio) audio.name = newName;
    };

    window.removeFromQueue = (id) => {
        manualAudios = manualAudios.filter(a => a.id !== id);
        if (audioPlayers[id]) {
            audioPlayers[id].pause();
            delete audioPlayers[id];
        }
        renderAudioQueue();
    };

    window.toggleQueueAudio = (id) => {
        const audioObj = manualAudios.find(a => a.id === id);
        const btn = document.getElementById(`btn-q-${id}`);
        const icon = document.getElementById(`icon-q-${id}`);

        if (!audioPlayers[id]) {
            audioPlayers[id] = new Audio(URL.createObjectURL(audioObj.file));
            audioPlayers[id].ontimeupdate = () => {
                const pct = (audioPlayers[id].currentTime / (audioPlayers[id].duration || 1)) * 100;
                const bar = document.getElementById(`bar-q-${id}`);
                if (bar) bar.style.width = pct + '%';
            };
            audioPlayers[id].onended = () => {
                if (icon) icon.className = 'fas fa-play text-[10px]';
            };
        }

        const p = audioPlayers[id];
        if (p.paused) {
            // Pausa outros players antes de tocar este
            Object.keys(audioPlayers).forEach(k => {
                if(k !== id) {
                    audioPlayers[k].pause();
                    const otherIcon = document.getElementById(`icon-q-${k}`);
                    if (otherIcon) otherIcon.className = 'fas fa-play text-[10px]';
                }
            });
            p.play();
            if (icon) icon.className = 'fas fa-pause text-[10px]';
        } else {
            p.pause();
            if (icon) icon.className = 'fas fa-play text-[10px]';
        }
    };

    function setupUploadAllListener() {
        const uploadAllBtn = document.getElementById('uploadAllBtn');
        if (uploadAllBtn && !uploadAllBtn.dataset.bound) {
            uploadAllBtn.dataset.bound = "1";
            uploadAllBtn.onclick = async () => {
                if (manualAudios.length === 0) return notyf.error('Selecione ao menos um áudio');

                uploadAllBtn.disabled = true;
                uploadAllBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> Enviando...';

                for (const audio of manualAudios.slice()) {
                    const success = await processSingleUpload(audio);
                    if (success) {
                        manualAudios = manualAudios.filter(a => a.id !== audio.id);
                        renderAudioQueue();
                    }
                }

                uploadAllBtn.disabled = false;
                uploadAllBtn.textContent = 'Enviar todos';
                notyf.success("Upload finalizado!");
                setTimeout(() => location.reload(), 1000);
            };
        }
    }

    async function processSingleUpload(audioObj) {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        return new Promise(resolve => {
            const form = new FormData();
            form.append('file', audioObj.file);
            form.append('name', audioObj.name);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${baseUrl}/campaign/voice/audio-upload`);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    const bar = document.getElementById(`progress-q-${audioObj.id}`);
                    if(bar) bar.style.width = pct + '%';
                }
            };

            xhr.onload = () => resolve(xhr.status === 200);
            xhr.onerror = () => resolve(false);
            xhr.send(form);
        });
    }

    // ======= 4. EXCLUSÃO =======

    async function deleteAudio(id, token, name) {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        Swal.fire({
            title: "Excluir Áudio?",
            html: `Deseja excluir permanentemente o áudio: <strong>${name}</strong>?`,
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Sim, excluir",
            cancelButtonText: "Cancelar",
            confirmButtonColor: "#e3342f",
        }).then(async (result) => {
            if (!result.isConfirmed) return;
            try {
                const res = await fetch(`${baseUrl}/campaign/voice/audio-delete`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({token, id}),
                });
                const json = await res.json();
                if (json.success) {
                    notyf.success("Áudio removido!");
                    setTimeout(() => location.reload(), 800);
                } else {
                    notyf.error(json.message || "Erro ao excluir.");
                }
            } catch (e) { notyf.error("Erro de conexão."); }
        });
    }
</script>
