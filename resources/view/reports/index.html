    <div class="flex flex-wrap -mx-3">

                    </button>

<style>

    .dataTables_wrapper .dataTables_filter {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .dataTables_wrapper .dataTables_length {
        float: left;
    }

    .dataTables_wrapper .dataTables_filter {
        float: right;
    }

    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input {
        margin-left: 0.5rem;
    }

    /* Remove margin lateral padrão */
    #table-sms_wrapper {
        margin-left: 0;
        margin-right: 0;
    }

    /* Reduz fontes e padding do info abaixo */
    .dataTables_wrapper .dataTables_info {
        font-size: 0.75rem;
        color: #475569; /* slate-600 */
        padding-top: 0.5rem;
    }

    /* Remove float no responsivo */
    @media (max-width: 640px) {
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            float: none;
            justify-content: space-between;
            flex-wrap: wrap;
        }
    }

    /* Faz o conteúdo da célula quebrar linhas e ter largura máxima ajustável */
    .break-message {
        white-space: normal;
        word-break: break-word;
    }

    /* Permite que a largura da célula se ajuste automaticamente */
    .auto-width-message {
        display: inline-block;
        max-width: 100%;
        width: auto;
        min-width: 150px;
    }
</style>


<script>
    document.addEventListener('DOMContentLoaded', function () {

        const table = $('#table-sms').DataTable({
            responsive: true,
            serverSide: true,
            processing: true,
            pageLength: 10,
            autoWidth: false,
            ajax: 'reports/sms',
            language: {
                lengthMenu: "_MENU_",
                zeroRecords: "Nenhum Registro econtrado",
                info: "_START_-_END_ de _TOTAL_",
                infoEmpty: "Nenhum Registro econtrado",
                infoFiltered: "(de _MAX_)",
                search: "🔍",
                loadingRecords: "Carregando...",
                processing: "Processando...",
                paginate: {
                    first: "«",
                    last: "»",
                    next: "›",
                    previous: "‹"
                }
            },
            columnDefs: [
                { targets: 5, type: 'datetime' } // Força a coluna 5 a ser tratada como data
            ],
            columns: [
                {
                    data: 'id',
                    //className: "text-left",
                    className: "dt-head-center dt-body-center",
                    render: data => `#${data}`
                },
                {
                    data: 'phone_sms',
                    className: "dt-head-center dt-body-center",
                    render: data => `${data}`
                },
                {
                    data: 'camp_name',
                    className: "dt-head-center dt-body-center",
                    render: data => `
                    <div class="auto-width-message">
                        ${data}
                    </div>
                `
                },
                {
                    data: 'operator',
                    className: "dt-head-center dt-body-center",
                    render: data => {
                        const op = data?.toLowerCase() || 'desconhecida';
                        let badgeClass = 'bg-gradient-to-r from-purple-700 to-violet-300';
                        let label = data || 'Desconhecida';

                        switch (op) {
                            case 'claro':
                                badgeClass = 'bg-gradient-to-r from-red-700 to-rose-300';
                                break;
                            case 'vivo':
                                badgeClass = 'bg-gradient-to-r from-blue-700 to-sky-300';
                                break;
                            case 'tim':
                                badgeClass = 'bg-gradient-to-r from-cyan-700 to-teal-300';
                                break;
                            case 'ctbc':
                                badgeClass = 'bg-gradient-to-r from-green-700 to-emerald-300';
                                break;
                        }

                        return `
                            <span class="text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${badgeClass}">
                                ${label}
                            </span>
                        `;
                    }
                },
                {
                    data: 'status_sms',
                    className: "dt-head-center dt-body-center",
                    render: data => {
                        let badgeClass = 'bg-slate-500';
                        let label = 'Desconhecido';

                        switch (data?.toUpperCase()) {
                            case 'SENT':
                                badgeClass = 'bg-gradient-to-r from-indigo-900 to-blue-300';
                                label = 'Enviada';
                                break;
                            case 'DELIVERED':
                                badgeClass = 'bg-gradient-to-r from-emerald-900 to-green-300';
                                label = 'Entregue';
                                break;
                            case 'EXPIRED':
                                badgeClass = 'bg-gradient-to-r from-yellow-900 to-amber-300';
                                label = 'Expirada';
                                break;
                            case 'REJECTED':
                                badgeClass = 'bg-gradient-to-r from-rose-900 to-red-300';
                                label = 'Rejeitada';
                                break;
                            case 'DELETED':
                                badgeClass = 'bg-gradient-to-r from-slate-900 to-gray-300';
                                label = 'Deletada';
                                break;
                            case 'BLACKLIST':
                                badgeClass = 'bg-gradient-to-r from-zinc-900 to-neutral-300';
                                label = 'Blacklist';
                                break;
                            case 'UNKNOWN':
                                badgeClass = 'bg-gradient-to-r from-red-700 to-orange-600';
                                label = 'Falhada';
                                break;
                            case 'UNDELIVERABLE':
                                badgeClass = 'bg-gradient-to-r from-red-900 to-orange-300';
                                label = 'Não Entregável';
                                break;
                            case 'ACCEPTED':
                                badgeClass = 'bg-gradient-to-r from-gray-900 to-blue-300';
                                label = 'Aceita';
                                break;
                        }

                        return `
                            <span class="text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${badgeClass}">
                                ${label}
                            </span>
                        `;
                    }
                },
                {
                    data: 'update_date',
                    className: "dt-head-center dt-body-center",
                    render: data => {
                        if (!data) return `<span class="italic text-slate-400">-</span>`;

                        const date = new Date(data);
                        if (isNaN(date)) return `<span class="italic text-slate-400">-</span>`;

                        const iso = date.toISOString();
                        const formatted = `${date.toLocaleDateString('pt-BR')} ${date.toLocaleTimeString('pt-BR', {
                            hour: '2-digit',
                            minute: '2-digit'
                        })}`;

                        return `<span class="font-medium" data-order="${iso}">${formatted}</span>`;
                    }
                },
                {
                    defaultContent: '',
                    className: "dt-head-center dt-body-center",
                    render: (data, type, row) => {
                        return `
                            <!--<button
                                class="btn-send-unique disabled inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-semibold text-xs px-2 py-1 rounded"
                                data-id="${row.id}"
                                data-phone="${row.phone_sms}"
                                data-camp-name="${row.camp_name}"
                                title="Enviar"
                                                >
                                <span class="icon-send">
                                    <i data-feather="send" class="w-4 h-4"></i>
                                </span>
                                <span class="icon-spinner hidden">
                                    <svg class="animate-spin h-4 w-4 text-emerald-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                                    </svg>
                                </span>
                            </button> -->`;
                    }
                }
            ],

            order: [[0, 'desc']],
            drawCallback: function () {
                feather.replace();

                const wrapper = $('#table-sms_wrapper');
                const paginate = $('#table-sms_paginate');
                const length = $('#table-sms_length label');
                const info = $('#table-sms_info');
                const filter = $('#table-sms_filter input');
                const select = $('#table-sms_length select');

                // Aplica Tailwind diretamente na div do wrapper
                wrapper.addClass('w-full text-slate-700 dark:text-slate-200 text-sm');

                // Estiliza paginação
                paginate.find('a').each(function () {
                    const $this = $(this);
                    const text = $this.text().trim();
                    let svg = '';

                    if (text === '‹') {
                        svg = `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>`;
                    } else if (text === '›') {
                        svg = `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`;
                    } else {
                        svg = text;
                    }

                    $this
                        .html(svg)
                        .addClass(`
                inline-flex items-center justify-center text-xs font-medium rounded-md
                bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-300
                border border-slate-300 dark:border-slate-600
                px-2 py-1 mx-0.5 hover:bg-slate-100 dark:hover:bg-slate-600 transition
            `);
                });

                paginate.find('.current')
                    .addClass('bg-emerald-600 text-white dark:bg-emerald-500 dark:text-white');

                // Fontes pequenas
                length.addClass('text-xs');
                info.addClass('text-xs');

                // Input de busca
                filter
                    .addClass('text-xs px-2 py-1 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200')
                    .attr('placeholder', 'Buscar...');

                // Select do _MENU_
                select
                    .addClass('text-xs px-2 py-1 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200');
            },


        });

    });
</script>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const refreshButton = document.getElementById('refreshButton');

        let smsSource = null;

        // ===================== Recarrega DataTable =====================
        function reloadSmsTable() {
            if ($.fn.DataTable.isDataTable('#table-sms')) {
                //console.log("🔄 Reloading DataTable...");
                $('#table-sms').DataTable().ajax.reload(null, false);
            }
        }

        // ===================== Início do SSE =====================
        function startSmsStream() {
            if (smsSource) return; // evita abrir várias conexões

            smsSource = new EventSource(`${baseUrl}/reports/sms-stream`);

            smsSource.onopen = () => {
                //console.log("✅ Conexão SSE aberta");
            };

            // Evento customizado enviado pelo PHP → "sms-status"
            smsSource.addEventListener("sms-status", (event) => {
                //console.log("📩 Evento [sms-status] recebido:", event.data);

                try {
                    const payload = JSON.parse(event.data);

                    if (payload?.status === 200) {
                        // Atualiza tabela
                        reloadSmsTable();
                        // Se quiser exibir contagem:
                        //console.log("Total de SMS:", payload.total);
                    } else if (payload?.status === 401) {
                        notyf.error(payload.message || "Não autenticado");
                        stopSmsStream();
                    }

                } catch (err) {
                    //console.error("Erro ao processar SSE [sms-status]:", err);
                }
            });

            // Evento de autenticação (quando backend manda event: auth)
            smsSource.addEventListener("auth", (event) => {
                const payload = JSON.parse(event.data);
                notyf.error(payload.message || "Auth error");
                stopSmsStream();
            });

            smsSource.onerror = (err) => {
                //console.error("❌ Erro na conexão SSE:", err);

                // Fecha e tenta reconectar
                smsSource.close();
                smsSource = null;
                setTimeout(startSmsStream, 5000);
            };
        }

        // ===================== Parar SSE =====================
        function stopSmsStream() {
            if (smsSource) {
                smsSource.close();
                smsSource = null;
                console.log("🔌 SSE desconectado");
            }
        }

        // ===================== Início automático =====================
        if (window.location.pathname.startsWith("/reports")) {
            startSmsStream();
        }

        // ===================== Botão manual de refresh =====================
        refreshButton.addEventListener('click', () => {
            refreshButton.disabled = true;
            refreshButton.classList.add('opacity-50', 'cursor-not-allowed');

            // força reload da tabela manualmente
            reloadSmsTable();

            // reinicia a conexão SSE
            stopSmsStream();
            startSmsStream();

            setTimeout(() => {
                refreshButton.disabled = false;
                refreshButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 2000);
        });

        // ===================== Fechar conexão ao sair da página =====================
        window.addEventListener('beforeunload', () => {
            stopSmsStream();
        });
    });
</script>




<script>
    // ===================== FUNÇÃO SPINNER BOTÃO =====================
    function toggleButtonSpinnerUnique(button, show = true, minVisibleMs = 1000) {
        const spinner = button.querySelector('.icon-spinner');
        const others = button.querySelectorAll('[class^="icon-"]:not(.icon-spinner)');

        if (show) {
            button.disabled = true;
            spinner.classList.remove('hidden');
            others.forEach(el => el.classList.add('hidden'));

            button.dataset.spinnerStart = Date.now();
        } else {
            const elapsed = Date.now() - (button.dataset.spinnerStart || 0);
            const delay = Math.max(minVisibleMs - elapsed, 0);

            setTimeout(() => {
                button.disabled = false;
                spinner.classList.add('hidden');
                others.forEach(el => el.classList.remove('hidden'));
            }, delay);
        }
    }

    // ===================== BOTÕES DA TABELA (um por linha) =====================
    document.addEventListener("click", async (e) => {
        const btn = e.target.closest(".btn-send-unique");
        if (!btn) return; // não é um botão de envio

        toggleButtonSpinnerUnique(btn, true);

        const phone = btn.dataset.phone || "";
        const campName = btn.dataset.campName || "";

        if (!phone) {
            notyf.error("Telefone inválido.");
            toggleButtonSpinnerUnique(btn, false);
            return;
        }

        const formData = new FormData();
        formData.append("message", campName); // aqui vai o nome da campanha como mensagem
        formData.append("phones[0]", phone);

        try {
            const response = await fetch("{{URL}}/campaign/single-shot-send", {
                method: "POST",
                body: formData,
            });

            const data = await response.json();

            if (data.status === 200) {
                notyf.success(data.message || "SMS enviado com sucesso!");
            } else {
                notyf.error(data.message || "Não foi possível enviar o SMS.");
            }
        } catch (err) {
            console.error("Erro:", err);
            notyf.error("Erro de conexão ao enviar o SMS.");
        } finally {
            toggleButtonSpinnerUnique(btn, false);
        }
    });

</script>
