<div class="w-full px-6 py-6 mx-auto">
    <div class="flex flex-wrap -mx-3">
        <div class="flex-none w-full max-w-full px-3">
            <div class="relative flex flex-col min-w-0 mb-6 bg-white shadow-xl rounded-2xl border border-slate-100">

                <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between px-6 pt-6 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-blue-100 text-blue-700 text-lg">💰</span>
                        <div>
                            <h2 id="pixTitle" class="text-lg font-semibold text-slate-800">Transações Pix</h2>
                            <p id="pixSubtitle" class="text-xs text-slate-400">Relatório consolidado de pagamentos e recargas</p>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 justify-end">
                        <button id="pixExportCsv" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium rounded-lg bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">
                            <span class="text-base">📄</span> CSV
                        </button>
                        <button id="pixReloadBtn" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">
                            <span class="text-base">🔄</span> Recarregar
                        </button>

                        <div class="flex items-center gap-2 ml-2">
                            <label class="inline-flex relative items-center cursor-pointer">
                                <input id="pixAutoReload" type="checkbox" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-300 rounded-full transition-all peer-checked:bg-blue-500"></div>
                                <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow transition-all peer-checked:translate-x-full"></div>
                                <span class="ml-2 text-xs text-slate-600">Auto</span>
                            </label>
                            <select id="pixReloadInterval" class="px-2 py-1 text-xs border border-slate-200 rounded-lg bg-white text-slate-700 outline-none">
                                <option value="5000">5s</option>
                                <option value="10000" selected>10s</option>
                                <option value="30000">30s</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="px-6 pb-4 pt-3 bg-slate-50 border-y border-slate-100">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
                        <div>
                            <label class="text-xs font-medium text-slate-500">Mostrar</label>
                            <select id="pixRowsPerPage" class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-slate-500">Status</label>
                            <select id="pixStatusFilter" class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Todos</option>
                                <option value="PAYMENT_RECEIVED">Aprovado</option>
                                <option value="PAYMENT_CREATED">Aguardando</option>
                                <option value="PAYMENT_REFUNDED">Estornado</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-slate-500">ID / Fatura</label>
                            <input id="pixSearchID" type="text" class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ID...">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-slate-500">De</label>
                            <input type="date" id="pixDateFrom" class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-slate-500">Até</label>
                            <input type="date" id="pixDateTo" class="mt-1 w-full px-2 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="md:col-span-2 lg:col-span-1">
                            <label class="text-xs font-medium text-slate-500">E-mail</label>
                            <div class="relative mt-1">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                    <i class="fa fa-search"></i>
                                </span>
                                <input id="pixSearchEmail" class="w-full pl-9 pr-3 py-1.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="cliente@email.com">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-auto px-0 pt-0 pb-2">
                    <div class="p-0 overflow-x-auto">
                        <table id="pix-table" class="w-full text-sm text-slate-700 border-collapse text-center">
                            <thead id="pixTableHead" class="bg-slate-100 text-xs uppercase tracking-wide">
                            </thead>
                            <tbody id="pixTableBody">
                            <tr><td colspan="6" class="px-4 py-6 text-center text-slate-400 italic">Carregando registros...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="px-6 py-4 flex justify-between items-center border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                    <p id="pixPageInfo" class="text-xxs font-bold text-slate-400 uppercase">Página 1 de 1</p>
                    <div class="flex gap-1 items-center">
                        <button id="pixPrevPage" class="px-3 py-1 text-xs font-bold border border-slate-200 rounded-lg disabled:opacity-50 transition-all">Anterior</button>
                        <div id="pixPageNumbers" class="flex gap-1"></div>
                        <button id="pixNextPage" class="px-3 py-1 text-xs font-bold border border-slate-200 rounded-lg disabled:opacity-50 transition-all">Próximo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tbody       = document.getElementById("pixTableBody");
        const thead       = document.getElementById("pixTableHead");
        const searchID    = document.getElementById("pixSearchID");
        const searchEmail = document.getElementById("pixSearchEmail");
        const statusFilt  = document.getElementById("pixStatusFilter");
        const dateFrom    = document.getElementById("pixDateFrom");
        const dateTo      = document.getElementById("pixDateTo");
        const perPageSel  = document.getElementById("pixRowsPerPage");
        const prevBtn     = document.getElementById("pixPrevPage");
        const nextBtn     = document.getElementById("pixNextPage");
        const pageInfo    = document.getElementById("pixPageInfo");
        const pageNumbers = document.getElementById("pixPageNumbers");
        const reloadBtn   = document.getElementById("pixReloadBtn");
        const autoReload  = document.getElementById("pixAutoReload");
        const intervalSel = document.getElementById("pixReloadInterval");

        let allItems = [];
        let filteredItems = [];
        let currentPage = 1;
        let perPage = 10;
        let userType = 'admin';
        let autoReloadTimer = null;

        // Formatação de Moeda
        const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        // Badges de Status
        function getStatusBadge(status) {
            const map = {
                'PAYMENT_RECEIVED': { text: 'Aprovado',  cls: 'bg-green-100 text-green-700' },
                'PAYMENT_CREATED':  { text: 'Aguardando', cls: 'bg-yellow-100 text-yellow-700' },
                'PAYMENT_REFUNDED': { text: 'Estornado', cls: 'bg-red-100 text-red-700' },
                'completed':        { text: 'Concluído', cls: 'bg-green-100 text-green-700' },
                'pending':          { text: 'Pendente',  cls: 'bg-yellow-100 text-yellow-700' },
                'failed':           { text: 'Falhou',    cls: 'bg-red-100 text-red-700' }
            };
            const s = map[status] || { text: status, cls: 'bg-gray-100 text-gray-700' };
            return `<span class="px-2.5 py-1 rounded-full text-xs font-bold ${s.cls}">${s.text}</span>`;
        }

        // Gerador de Cabeçalho Dinâmico
        function updateHeaders() {
            if (userType === 'reseller') {
                document.getElementById('pixTitle').textContent = "Recargas";
                thead.innerHTML = `<tr>
                <th class="px-4 py-2 border border-slate-100">ID</th>
                <th class="px-4 py-2 border border-slate-100">ID Transação</th>
                <th class="px-4 py-2 border border-slate-100">E-mail</th>
                <th class="px-4 py-2 border border-slate-100">Valor</th>
                <th class="px-4 py-2 border border-slate-100">Tipo</th>
                <th class="px-4 py-2 border border-slate-100">Status</th>
                <th class="px-4 py-2 border border-slate-100">Data</th>
            </tr>`;
            } else {
                document.getElementById('pixTitle').textContent = "Transações Pix";
                thead.innerHTML = `<tr>
                <th class="px-4 py-2 border border-slate-100">ID</th>
                <th class="px-4 py-2 border border-slate-100">Status Pagamento</th>
                <th class="px-4 py-2 border border-slate-100">Valor</th>
                <th class="px-4 py-2 border border-slate-100">Número Fatura</th>
                <th class="px-4 py-2 border border-slate-100">Data Pagamento</th>
                <th class="px-4 py-2 border border-slate-100">Comprovante</th>
            </tr>`;
            }
        }

        // Template de Linha
        // Template de Linha (Ajustado para os nomes das chaves do seu JSON)
        function rowTemplate(item) {
            if (userType === 'reseller') {
                return `<tr>
                        <td class="px-4 py-2 border border-slate-100">#${item.id}</td>
                        <td class="px-4 py-2 border border-slate-100">${item.transaction_id || '-'}</td>
                        <td class="px-4 py-2 border border-slate-100">${item.email || '-'}</td>
                        <td class="px-4 py-2 border border-slate-100 font-bold">${formatBRL(item.value)}</td>
                        <td class="px-4 py-2 border border-slate-100 text-xs uppercase">${item.type || '-'}</td>
                        <td class="px-4 py-2 border border-slate-100">${getStatusBadge(item.status)}</td>
                        <td class="px-4 py-2 border border-slate-100 text-xs">${item.date || '-'}</td>
                    </tr>`;
            }

            // Ajuste aqui: usando item.receipt_url e item.invoice_number que vem no seu JSON
            const receipt = item.receipt_url ? `<a href="${item.receipt_url}" target="_blank" class="text-red-600"><i class="fa fa-file-pdf"></i></a>` : '-';

            return `<tr>
                        <td class="px-4 py-2 border border-slate-100">#${item.id}</td>
                        <td class="px-4 py-2 border border-slate-100">${getStatusBadge(item.status)}</td>
                        <td class="px-4 py-2 border border-slate-100 font-bold">${formatBRL(item.value)}</td>
                        <td class="px-4 py-2 border border-slate-100">${item.invoice_number || '-'}</td>
                        <td class="px-4 py-2 border border-slate-100 text-xs">${item.date || '-'}</td>
                        <td class="px-4 py-2 border border-slate-100">${receipt}</td>
                    </tr>`;
        }

        async function fetchData(showLoading = true) {
            if (showLoading) tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-6 text-center text-slate-400 italic">Carregando...</td></tr>';
            try {
                const r = await fetch('transactions-realtime');
                const res = await r.json();
                userType = res.user_type || 'admin';
                allItems = res.data || [];
                updateHeaders();
                applyFilters();
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-6 text-center text-red-500">Erro ao carregar dados.</td></tr>';
            }
        }

        function applyFilters() {
            const idQ = searchID.value.toLowerCase();
            const emailQ = searchEmail.value.toLowerCase();
            const statusQ = statusFilt.value;
            const dFrom = dateFrom.value;
            const dTo = dateTo.value;

            filteredItems = allItems.filter(i => {
                const matchesStatus = statusQ ? (i.payment_status === statusQ || i.status === statusQ) : true;
                const matchesID = idQ ? (String(i.webhook_id || i.id || '').toLowerCase().includes(idQ) || String(i.invoiceNumber || '').toLowerCase().includes(idQ)) : true;
                const matchesEmail = emailQ ? (String(i.email || '').toLowerCase().includes(emailQ)) : true;

                // Filtro de data simples
                if (dFrom || dTo) {
                    const itemDate = new Date(i.confirmed_date || i.created_at || i.started);
                    if (dFrom && itemDate < new Date(dFrom)) return false;
                    if (dTo && itemDate > new Date(dTo + "T23:59:59")) return false;
                }

                return matchesStatus && matchesID && matchesEmail;
            });

            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            tbody.innerHTML = "";
            const total = filteredItems.length;
            const totalPages = Math.max(1, Math.ceil(total / perPage));
            const start = (currentPage - 1) * perPage;

            if (!total) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-6 text-center text-slate-400">Nenhum registro.</td></tr>';
            } else {
                filteredItems.slice(start, start + perPage).forEach(item => {
                    tbody.insertAdjacentHTML("beforeend", rowTemplate(item));
                });
            }

            // --- AJUSTE AQUI PARA MANTER O PADRÃO (1 usuários) ---
            const labelRegistro = total === 1 ? 'transação' : 'transações';
            pageInfo.textContent = `Página ${currentPage} de ${totalPages} (${total} ${labelRegistro})`;
            // ------------------------------------------------------

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage >= totalPages;
            renderPageNumbers(totalPages);
        }

        function renderPageNumbers(totalPages) {
            pageNumbers.innerHTML = "";
            for (let i = 1; i <= totalPages; i++) {
                if (totalPages > 5 && (i > 3 && i < totalPages)) {
                    if (i === 4) pageNumbers.insertAdjacentHTML("beforeend", `<span class="px-2">...</span>`);
                    continue;
                }
                const btn = document.createElement("button");
                btn.textContent = i;
                btn.className = `px-3 py-1 text-xs font-bold border rounded-lg transition-all ${i === currentPage ? 'bg-blue-500 text-white border-blue-500' : 'border-slate-200 hover:bg-slate-100'}`;
                btn.onclick = () => { currentPage = i; renderPage(); };
                pageNumbers.appendChild(btn);
            }
        }

        // Função para exportar os dados filtrados para CSV
        document.getElementById('pixExportCsv').onclick = function() {
            if (filteredItems.length === 0) return alert('Não há dados para exportar.');

            let csv = 'ID;Status;Valor;Fatura;Data\n'; // Cabeçalho
            filteredItems.forEach(item => {
                csv += `${item.id};${item.status};${item.value};${item.invoice_number};${item.date}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "relatorio_pix.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Eventos
        reloadBtn.onclick = () => fetchData(true);
        perPageSel.onchange = () => { perPage = Number(perPageSel.value); currentPage = 1; renderPage(); };
        [searchID, searchEmail, statusFilt, dateFrom, dateTo].forEach(el => el.oninput = applyFilters);
        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
        nextBtn.onclick = () => { if (currentPage < Math.ceil(filteredItems.length / perPage)) { currentPage++; renderPage(); } };

        // Auto Reload logic
        autoReload.onchange = () => {
            if (autoReloadTimer) clearInterval(autoReloadTimer);
            if (autoReload.checked) {
                autoReloadTimer = setInterval(() => {
                    if (!document.hidden) fetchData(false);
                }, intervalSel.value);
            }
        };

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (autoReloadTimer) clearInterval(autoReloadTimer);
                autoReloadTimer = null;
                return;
            }

            if (autoReload.checked) {
                fetchData(false);
                autoReload.onchange();
            }
        });
        window.addEventListener('beforeunload', () => {
            if (autoReloadTimer) clearInterval(autoReloadTimer);
            autoReloadTimer = null;
        });

        fetchData();
    });
</script>
