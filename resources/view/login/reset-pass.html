<!doctype html>
<html lang="pt-br" class="dark">

<head>
  <title>{{title}} | Maxx Solutions</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="base-url" content="{{URL}}">
  <link rel="icon" type="image/png" href="{{URL}}/resources/assets/img/favicon-transparent.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/fonts/tabler-icons.min.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/notify.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/auth-notify.css" />
  <link rel="stylesheet" href="{{URL}}/resources/view/login/assets/css/support-whatsapp.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              "50": "#eff6ff", "100": "#dbeafe", "200": "#bfdbfe", "300": "#93c5fd", "400": "#60a5fa",
              "500": "#38bdf8", "600": "#0ea5e9", "700": "#0284c7", "800": "#0369a1", "900": "#075985", "950": "#082f49"
            },
            darkSurface: "#0f172a",
            darkCard: "#1e293b"
          }
        }
      }
    };
  </script>
  <style>
    .reset-channel-selected {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.10);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.45), 0 14px 30px rgba(8, 47, 73, 0.24);
    }
  </style>
</head>

<body class="bg-darkSurface font-sans text-white antialiased">
  <section class="min-h-screen flex items-center justify-center py-8 px-4 lg:py-0">
    <div class="max-w-6xl w-full grid lg:grid-cols-12 gap-12 items-center">
      <div class="lg:col-span-7 flex flex-col items-center lg:items-end">
        <div class="w-full max-w-lg bg-darkCard rounded-2xl shadow-2xl p-8 border border-gray-700">
          <div class="mb-8 flex items-center gap-4">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center">
              <img src="{{URL}}/resources/view/login/assets/images/maxx-logo-transparent.png" alt="Maxx Solutions" class="h-12 w-12 object-contain">
            </div>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.28em] text-gray-400">Plataforma</p>
              <p class="text-lg font-semibold tracking-tight text-gray-100">Maxx Solutions</p>
            </div>
          </div>

          <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">Redefinir senha</h1>
            <p class="text-gray-400">
              Informe o e-mail da sua conta e escolha como deseja receber o codigo.
              <a href="{{URL}}/login" class="text-primary-500 font-semibold hover:underline">Voltar ao login</a>
            </p>
          </div>

          <form id="resetPasswordForm" class="space-y-6">
            <div>
              <label for="resetEmail" class="block mb-2 text-sm font-medium text-gray-300">E-mail</label>
              <input type="email" id="resetEmail" required class="bg-gray-700 border border-gray-600 text-white text-sm rounded-xl focus:ring-primary-500 focus:border-primary-500 block w-full p-3.5 transition duration-200" placeholder="nome@empresa.com">
            </div>

            <div>
              <p class="block mb-2 text-sm font-medium text-gray-300">Receber código por</p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label data-channel-option class="cursor-pointer rounded-xl border border-gray-600 bg-gray-700/60 p-3 transition hover:border-primary-500/70">
                  <input type="radio" name="resetChannel" value="sms" checked class="sr-only peer">
                  <span class="flex items-center justify-between gap-2 text-sm font-semibold text-gray-200 peer-checked:text-primary-400">
                    <span class="flex items-center gap-2">
                      <i class="ti ti-message-2"></i>
                      SMS
                    </span>
                    <i data-channel-check class="ti ti-check hidden text-primary-400"></i>
                  </span>
                </label>
                <label data-channel-option class="cursor-pointer rounded-xl border border-gray-600 bg-gray-700/60 p-3 transition hover:border-primary-500/70">
                  <input type="radio" name="resetChannel" value="email" class="sr-only peer">
                  <span class="flex items-center justify-between gap-2 text-sm font-semibold text-gray-200 peer-checked:text-primary-400">
                    <span class="flex items-center gap-2">
                      <i class="ti ti-mail"></i>
                      E-mail
                    </span>
                    <i data-channel-check class="ti ti-check hidden text-primary-400"></i>
                  </span>
                </label>
                <label data-channel-option class="cursor-pointer rounded-xl border border-gray-600 bg-gray-700/60 p-3 transition hover:border-primary-500/70">
                  <input type="radio" name="resetChannel" value="both" class="sr-only peer">
                  <span class="flex items-center justify-between gap-2 text-sm font-semibold text-gray-200 peer-checked:text-primary-400">
                    <span class="flex items-center gap-2">
                      <i class="ti ti-shield-check"></i>
                      Ambos
                    </span>
                    <i data-channel-check class="ti ti-check hidden text-primary-400"></i>
                  </span>
                </label>
              </div>
            </div>

            <button id="btnResetPassword" type="submit" class="w-full text-white bg-gradient-to-r from-sky-500 via-cyan-500 to-blue-500 hover:from-sky-400 hover:via-cyan-400 hover:to-blue-500 focus:ring-4 focus:ring-cyan-800 font-bold rounded-xl text-md px-5 py-4 text-center transition-all flex items-center justify-center gap-3 shadow-lg shadow-cyan-950/25">
              <span class="btn-text">Enviar codigo de recuperacao</span>
              <svg class="btn-spinner hidden h-6 w-6 animate-spin text-white" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-5 hidden lg:block">
        <div class="relative">
          <div class="absolute -top-20 -left-20 w-64 h-64 bg-cyan-400/20 rounded-full blur-3xl"></div>
          <div class="absolute -bottom-20 -right-10 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>
          <img src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/authentication/illustration.svg" alt="Ilustração Maxx" class="relative z-10 w-full transform hover:scale-105 transition duration-700">
        </div>
      </div>
    </div>
  </section>

  <a id="support-whatsapp-floating"
     href="https://wa.me/5521968943160"
     target="_blank"
     rel="noopener noreferrer"
     class="support-whatsapp-floating"
     aria-label="Fale conosco no WhatsApp">
    <span class="support-whatsapp-floating__status" aria-hidden="true"></span>
    <span class="support-whatsapp-floating__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.52 3.48A11.87 11.87 0 0 0 12 0a11.88 11.88 0 0 0-10.6 17.25L0 24l6.9-1.81A11.88 11.88 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.2-1.25-6.21-3.48-8.52zm-8.52 18c-1.57 0-3.09-.4-4.44-1.15l-.32-.18-4.08 1.07 1.09-3.97-.21-.33a9.92 9.92 0 0 1 8.95-14.92c5.48 0 9.93 4.45 9.93 9.93s-4.45 9.93-9.93 9.93zm5.47-7.5c-.3-.15-1.77-.87-2.04-.96-.27-.1-.47-.15-.66.15s-.76.96-.93 1.15-.34.22-.63.07a8.08 8.08 0 0 1-2.38-1.46 8.8 8.8 0 0 1-1.62-2.01c-.17-.3 0-.46.13-.61.13-.13.3-.34.45-.51.15-.17.2-.3.3-.5.1-.2.05-.38-.02-.53s-.66-1.6-.91-2.2c-.24-.58-.49-.5-.67-.5-.17 0-.36 0-.55 0-.2 0-.53.08-.8.38s-1.05 1.02-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.24 5.13 4.55.72.31 1.28.5 1.72.64.72.23 1.37.2 1.88.12.57-.08 1.77-.73 2.02-1.43.25-.7.25-1.3.18-1.43-.07-.13-.27-.2-.57-.35z"/>
      </svg>
    </span>
    <span class="support-whatsapp-floating__copy">
      <span id="support-whatsapp-status-text" class="support-whatsapp-floating__eyebrow">Verificando status</span>
      <span id="support-whatsapp-label" class="support-whatsapp-floating__label">Fale com a Maxx</span>
      <span id="support-whatsapp-hours" class="support-whatsapp-floating__hours">Seg a sex, 09h as 18h</span>
    </span>
  </a>

  <script src="{{URL}}/resources/view/login/assets/js/notify.js"></script>
  <script src="{{URL}}/resources/view/login/assets/js/support-whatsapp.js"></script>
  <script>
    const resetForm = document.getElementById('resetPasswordForm');
    const btnResetPassword = document.getElementById('btnResetPassword');
    const btnText = btnResetPassword.querySelector('.btn-text');
    const btnSpinner = btnResetPassword.querySelector('.btn-spinner');
    const channelOptions = document.querySelectorAll('[data-channel-option]');
    const notyf = new Notyf({
      duration: 5000,
      ripple: false,
      position: { x: 'right', y: 'top' },
      types: [
        { type: 'success', backgroundColor: '#10b981', icon: { className: 'notyf__icon--success', tagName: 'i' } },
        { type: 'error', backgroundColor: '#e11d48', icon: { className: 'notyf__icon--error', tagName: 'i' } },
        { type: 'info', backgroundColor: '#334155', icon: false }
      ]
    });

    function updateSelectedChannel() {
      channelOptions.forEach((option) => {
        const input = option.querySelector('input[name="resetChannel"]');
        const check = option.querySelector('[data-channel-check]');
        const selected = Boolean(input?.checked);

        option.classList.toggle('reset-channel-selected', selected);
        option.classList.toggle('border-primary-400', selected);
        option.classList.toggle('bg-primary-500/10', selected);
        option.classList.toggle('shadow-lg', selected);
        option.classList.toggle('shadow-cyan-950/30', selected);
        option.classList.toggle('ring-1', selected);
        option.classList.toggle('ring-primary-400/60', selected);
        check?.classList.toggle('hidden', !selected);
      });
    }

    channelOptions.forEach((option) => {
      option.querySelector('input[name="resetChannel"]')?.addEventListener('change', updateSelectedChannel);
    });
    updateSelectedChannel();

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        notyf.error('Digite um e-mail valido.');
        return;
      }

      btnResetPassword.disabled = true;
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      const dataPost = new FormData();
      dataPost.append('email', email);
      dataPost.append('channel', document.querySelector('input[name="resetChannel"]:checked')?.value || 'sms');

      try {
        const response = await fetch("{{URL}}/reset-pass", { method: 'POST', body: dataPost });
        const data = await response.json();

        if (response.status === 200) {
          window.location.href = "{{URL}}/reset-pass-code";
        } else {
          notyf.error(data.message || 'E-mail nao encontrado.');
          resetButton();
        }
      } catch (err) {
        notyf.error('Erro na comunicacao com o servidor.');
        resetButton();
      }
    });

    function resetButton() {
      btnResetPassword.disabled = false;
      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
    }
  </script>
</body>
</html>
