<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} - Maxx Solutions</title>
    <style>
        :root {
            color-scheme: light;
            --text: #1f2937;
            --muted: #64748b;
            --line: #dbe3ea;
            --accent: #dc2626;
            --bg: #f8fafc;
            --paper: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        main {
            width: min(880px, calc(100% - 32px));
            margin: 48px auto;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 36px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }

        .brand {
            margin: 0 0 24px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.2;
        }

        .updated {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0 0 28px;
        }

        .links a {
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .section + .section {
            margin-top: 24px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        p {
            margin: 0 0 16px;
        }

        .contact {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <p class="brand">Maxx Solutions</p>
        <h1>{{heading}}</h1>
        <p class="updated">Ultima atualizacao: {{updated_at}}</p>
        <nav class="links">{{document_links}}</nav>
        {{content}}
        <p class="contact">Contato: {{contact_email}}</p>
    </main>
</body>
</html>
