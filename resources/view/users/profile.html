<div id="addressModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300 flex">
    <div id="addressModalContent" class="relative w-full max-w-2xl p-0 bg-white dark:bg-slate-850 rounded-2xl shadow-2xl transform transition-all duration-300 scale-95 opacity-0 overflow-hidden">

        <div class="flex items-center justify-between p-4 border-b dark:border-slate-700 bg-gray-50 dark:bg-slate-900/50">
            <h6 class="mb-0 dark:text-white font-bold"><i class="ni ni-map-big text-emerald-500 mr-2"></i> Atualizar Localização</h6>
            <button onclick="closeAddressModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
                <i class="fa fa-times text-lg"></i>
            </button>
        </div>

        <form id="address-form" class="p-6">
            <div class="flex flex-wrap -mx-3">
                <div class="w-full px-3 md:w-4/12 mb-4">
                    <label for="inputZip" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">CEP</label>
                    <div class="relative">
                        <input type="text" id="inputZip" maxlength="8" placeholder="00000000" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                        <i class="fa fa-search absolute right-3 top-3 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div class="w-full px-3 md:w-8/12 mb-4">
                    <label for="inputAddress" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Logradouro / Rua</label>
                    <input type="text" id="inputAddress" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>

                <div class="w-full px-3 md:w-3/12 mb-4">
                    <label for="inputNumber" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Número</label>
                    <input type="text" id="inputNumber" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>
                <div class="w-full px-3 md:w-5/12 mb-4">
                    <label for="neighBorHood" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Bairro</label>
                    <input type="text" id="neighBorHood" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>
                <div class="w-full px-3 md:w-4/12 mb-4">
                    <label for="inputComplement" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Complemento</label>
                    <input type="text" id="inputComplement" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>

                <div class="w-full px-3 md:w-8/12 mb-4">
                    <label for="inputCity" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Cidade</label>
                    <input type="text" id="inputCity" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>
                <div class="w-full px-3 md:w-4/12 mb-4">
                    <label for="inputState" class="block text-xs font-bold text-slate-700 dark:text-white/80 mb-1 ml-1 uppercase">Estado (UF)</label>
                    <input type="text" id="inputState" data-input disabled class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg text-sm focus:border-emerald-500 focus:outline-none transition-all" />
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-4 border-t dark:border-slate-700">
                <button type="button" onclick="closeAddressModal()"
                        class="px-5 py-2 text-xs font-bold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-all uppercase">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-5 py-2 text-xs font-bold text-white bg-gradient-to-tl from-emerald-600 to-teal-400 rounded-lg shadow-md hover:scale-102 transition-all uppercase">
                    Salvar Alterações
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    /**
     * CONFIGURAÇÕES GERAIS E SELETORES
     */
    const addressUp = document.querySelector('#addressUp');
    const addressForm = document.querySelector("#address-form");
    const cepInput = document.querySelector("#inputZip");
    const addressInput = document.querySelector("#inputAddress");
    const complementInput = document.querySelector("#inputComplement");
    const cityInput = document.querySelector("#inputCity");
    const stateInput = document.querySelector("#inputState");
    const neighborhoodInput = document.querySelector("#neighBorHood");
    const numberInput = document.querySelector("#inputNumber");
    const formInputs = document.querySelectorAll("[data-input]");

    const addressModal = document.getElementById('addressModal');
    const addressModalContent = document.getElementById('addressModalContent');

    const modalImage = document.getElementById('uploadModalImage');
    const modalImageContent = document.getElementById('uploadModalContent');
    const previewImage = document.getElementById('previewImage');
    const imageInput = document.getElementById('imageInput');
    const progressBar = document.getElementById('uploadProgress');
    const percentText = document.getElementById('uploadPercent');
    const uploadBackdrop = document.getElementById('uploadModalBackdrop');

    /**
     * MÓDULO: ENDEREÇO (ViaCEP e Modal)
     */
    function openAddressModal() {
        addressModal?.classList.remove('hidden');
        setTimeout(() => {
            addressModalContent?.classList.remove('scale-95', 'opacity-0');
            addressModalContent?.classList.add('scale-100', 'opacity-100');
        }, 50);
    }

    function closeAddressModal() {
        addressModalContent?.classList.add('scale-95', 'opacity-0');
        addressModalContent?.classList.remove('scale-100', 'opacity-100');
        setTimeout(() => {
            addressModal?.classList.add('hidden');
            addressForm?.reset();
            toggleDisabled(true);
        }, 300);
    }

    const toggleDisabled = (disabled = false) => {
        formInputs.forEach(input => {
            if (disabled) input.setAttribute("disabled", "disabled");
            else input.removeAttribute("disabled");
        });
    };

    const getAddress = async (cep) => {
        cepInput.blur();
        try {
            const apiUrl = `https://viacep.com.br/ws/${cep}/json/`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.erro) {
                toggleDisabled(true);
                addressForm.reset();
                Swal.fire({ icon: 'error', title: 'CEP Inválido', text: 'Tente novamente!' });
                return;
            }

            toggleDisabled(false);
            addressInput.value = data.logradouro || '';
            cityInput.value = data.localidade || '';
            neighborhoodInput.value = data.bairro || '';
            stateInput.value = data.uf || '';
            numberInput?.focus();
        } catch (e) {
            console.error("Erro ViaCEP:", e);
        }
    };

    // Listeners de Endereço
    addressUp?.addEventListener('click', (e) => { e.preventDefault(); openAddressModal(); });

    cepInput?.addEventListener("keypress", (e) => {
        if (!/[0-9]/.test(String.fromCharCode(e.keyCode))) e.preventDefault();
    });

    cepInput?.addEventListener("keyup", (e) => {
        if (e.target.value.length === 8) getAddress(e.target.value);
    });

    addressForm?.addEventListener("submit", (e) => {
        e.preventDefault();
        const btn = e.submitter;
        const btnText = btn.innerHTML;

        const payload = {
            cep: cepInput.value,
            logradouro: addressInput.value,
            numero: numberInput.value,
            bairro: neighborhoodInput.value,
            complemento: complementInput.value,
            cidade: cityInput.value,
            estado: stateInput.value
        };

        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> Salvando...';

        fetch(baseUrl + '/users/profile/update-address', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 200) {
                    notyf.success(data.message);
                    setTimeout(() => location.reload(), 1500);
                } else {
                    notyf.error(data.message);
                    btn.disabled = false;
                    btn.innerHTML = btnText;
                }
            })
            .catch(() => {
                notyf.error("Erro na conexão.");
                btn.disabled = false;
                btn.innerHTML = btnText;
            });
    });

    /**
     * MÓDULO: SENHA (Redefinição e Visibilidade)
     */
    function togglePassword(fieldId, el) {
        const input = document.getElementById(fieldId);
        const icon = el.querySelector("i");
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function handlePasswordReset(event) {
        event.preventDefault();
        const button = $("#resetPasswordForm button[type='submit']");
        const formData = new FormData(event.target);

        toggleButtonSpinner(button, true);

        fetch(baseUrl + "/users/profile/reset-pass", {
            method: "POST",
            body: formData
        })
            .then(res => res.json())
            .then(data => {
                toggleButtonSpinner(button, false);
                if (data.success) {
                    event.target.reset();
                    notyf.success(data.message);
                } else {
                    notyf.error(data.message);
                }
            })
            .catch(() => {
                toggleButtonSpinner(button, false);
                notyf.error("Erro inesperado.");
            });
        return false;
    }

    function toggleButtonSpinner(button, show = true, minVisibleMs = 1000) {
        const spinner = button.find('.icon-spinner');
        const others = button.find('[class^="icon-"]:not(.icon-spinner)');
        if (show) {
            button.prop('disabled', true);
            spinner.removeClass('hidden');
            others.addClass('hidden');
            button.data('spinner-start', Date.now());
        } else {
            const elapsed = Date.now() - (button.data('spinner-start') || 0);
            const delay = Math.max(minVisibleMs - elapsed, 0);
            setTimeout(() => {
                button.prop('disabled', false);
                spinner.addClass('hidden');
                others.removeClass('hidden');
            }, delay);
        }
    }

    /**
     * MÓDULO: UPLOAD DE IMAGEM
     */
    function openModal() {
        modalImage?.classList.remove('hidden');
        setTimeout(() => {
            modalImageContent?.classList.remove('scale-95', 'opacity-0');
            modalImageContent?.classList.add('scale-100', 'opacity-100');
        }, 50);
    }

    function closeModal() {
        modalImageContent?.classList.add('scale-95', 'opacity-0');
        modalImageContent?.classList.remove('scale-100', 'opacity-100');
        setTimeout(() => {
            modalImage?.classList.add('hidden');
            resetModal();
        }, 200);
    }

    function resetModal() {
        if(progressBar) progressBar.style.width = '0%';
        if(percentText) percentText.textContent = '0%';
        imageInput.value = '';
        previewImage.src = '';
        previewImage.classList.add('hidden');
    }

    imageInput?.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
            previewImage.src = URL.createObjectURL(file);
            previewImage.classList.remove('hidden');
        }
    });

    function saveImage() {
        const file = imageInput.files[0];
        if (!file) return notyf.error("Selecione uma imagem!");

        const formData = new FormData();
        formData.append("image", file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', baseUrl + '/users/profile/upload-images');
        xhr.responseType = 'json';

        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable && progressBar) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + '%';
                percentText.textContent = percent + '%';
            }
        });

        xhr.onload = () => {
            if (xhr.status === 200 && xhr.response.status === 200) {
                notyf.success(xhr.response.message);
                closeModal();
                setTimeout(() => location.reload(), 500);
            } else {
                notyf.error(xhr.response?.message || 'Erro no upload');
            }
        };
        xhr.send(formData);
    }

    // Eventos de Fechamento Globais (Esc e Click Out)
    uploadBackdrop?.addEventListener('click', closeModal);
    addressModal?.addEventListener('click', e => { if (e.target === addressModal) closeAddressModal(); });
    document.addEventListener('keydown', e => {
        if (e.key === "Escape") { closeModal(); closeAddressModal(); }
    });
</script>
