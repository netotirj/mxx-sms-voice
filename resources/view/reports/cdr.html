<script>
    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function digitsOnly(value) {
        return String(value ?? "").replace(/\D+/g, "");
    }

    function formatCdrPhone(value) {
        const raw = String(value ?? "").trim();
        if (!raw) return "-";

        let digits = digitsOnly(raw);
        if (!digits) return raw;

        if (digits.startsWith("55")) {
            const national = digits.slice(2);
            if (/^\d{10,11}$/.test(national)) {
                digits = national;
            }
        }

        if (/^\d{11}$/.test(digits)) {
            return digits.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
        }

        if (/^\d{10}$/.test(digits)) {
            return digits.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3");
        }

        return digits;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const baseUrl        = document.querySelector('meta[name="base-url"]').content;
        const tbody          = document.getElementById("cdrTableBody");
        const search         = document.getElementById("cdrSearchInput");
        const perPageSel     = document.getElementById("cdrRowsPerPage");
        const prevBtn        = document.getElementById("cdrPrevPage");
        const nextBtn        = document.getElementById("cdrNextPage");
        const pageInfo       = document.getElementById("cdrPageInfo");
        const pageNumbers    = document.getElementById("cdrPageNumbers");
        const typeFilter     = document.getElementById("cdrTypeFilter");
        const statusFilter   = document.getElementById("cdrStatusFilter");
        const dateFromInp    = document.getElementById("cdrDateFrom");
        const dateToInp      = document.getElementById("cdrDateTo");
        const exportCsvBtn   = document.getElementById("cdrExportCsv");
        const exportXlsBtn   = document.getElementById("cdrExportXls");
        const statsBox       = document.getElementById("cdrStats");

        const reloadBtn      = document.getElementById("cdrReloadBtn");
        const autoReloadChk  = document.getElementById("cdrAutoReload");
        const reloadInterval = document.getElementById("cdrReloadInterval");

        let allItems = [];
        let filteredItems = [];
        let currentPage = 1;
        let perPage = Number(perPageSel.value || 10);
        let autoReloadTimer = null;

        // ========= Helpers de estilo =========

        function cdrTypeBadge(type) {
            type = (type || "").toLowerCase();

            const map = {
                normal:      { text: "normal",      icon: "📞", color: "bg-emerald-100 text-emerald-700" },
                voice:       { text: "voice",       icon: "📞", color: "bg-emerald-100 text-emerald-700" },
                torpedo:     { text: "torpedo",     icon: "✉️", color: "bg-fuchsia-100 text-fuchsia-700" },
                sms:         { text: "sms",         icon: "💬", color: "bg-blue-100 text-blue-700" },
                whatsapp:    { text: "whatsapp",    icon: "🟢", color: "bg-green-100 text-green-700" },
                local:       { text: "local",       icon: "🏠", color: "bg-slate-200 text-slate-700" },
                outbound:    { text: "outbound",    icon: "📤", color: "bg-orange-100 text-orange-700" },

                // 💰 TAXA DE SERVIÇO
                service_fee: { text: "taxa",        icon: "💰", color: "bg-yellow-100 text-yellow-700" }
            };

            const item = map[type] || {
                text: type || "-",
                icon: "❔",
                color: "bg-gray-200 text-gray-600"
            };

            return `
        <span class="cdr-pill inline-flex items-center gap-1 rounded-full font-semibold ${item.color}">
            ${item.icon} ${item.text}
        </span>
    `;
        }


        function translateStatus(status) {
            const s = (status || "").toUpperCase();

            const map = {
                // sucesso
                ANSWER:           "Atendida",
                NORMAL_CLEARING:  "Atendida",

                // não atendidas
                NOANSWER:         "Não atendida",
                NO_ANSWER:        "Não atendida",
                NO_USER_RESPONDING:"Sem resposta",

                // ocupado
                BUSY:             "Ocupado",
                USER_BUSY:        "Ocupado",
                BUSY_HERE:        "Ocupado",

                // cancelamentos
                CANCEL:           "Cancelada",
                CALL_REJECTED:    "Rejeitada",
                DECLINE:          "Recusada",
                REQUEST_TERMINATED:"Cancelada",

                // falhas técnicas
                FAILED:           "Falhou",
                CONGESTION:       "Congestion",
                TEMPORARY_FAILURE:"Falha temporária",
                RESOURCE_UNAVAILABLE:"Recurso indisponível",
                CHANUNAVAIL:      "Indisponível",
                INVALID_NUMBER_FORMAT:"Número inválido",

                // estados intermediários
                RINGING:          "Chamando",
                RING:             "Chamando",
                PROGRESS:         "Em progresso",
                EARLYMEDIA:       "Mídia antecipada",

                UNKNOWN:          "Desconhecido"
            };

            return map[s] || status || "-";
        }


        function statusBadge(status) {
            const raw   = (status || "").toUpperCase();
            const label = translateStatus(raw);

            const map = {
                // sucesso
                ANSWER:           "bg-emerald-100 text-emerald-700",
                NORMAL_CLEARING:  "bg-emerald-100 text-emerald-700",

                // não atendida
                NOANSWER:         "bg-yellow-100 text-yellow-700",
                NO_ANSWER:        "bg-yellow-100 text-yellow-700",

                // ocupado
                BUSY:             "bg-red-100 text-red-700",
                USER_BUSY:        "bg-red-100 text-red-700",

                // cancelamentos
                CANCEL:           "bg-slate-100 text-slate-700",
                CALL_REJECTED:    "bg-slate-100 text-slate-700",
                DECLINE:          "bg-slate-100 text-slate-700",

                // falhas técnicas
                FAILED:           "bg-rose-100 text-rose-700",
                CONGESTION:       "bg-orange-100 text-orange-700",
                TEMPORARY_FAILURE:"bg-orange-100 text-orange-700",
                RESOURCE_UNAVAILABLE:"bg-orange-100 text-orange-700",
                CHANUNAVAIL:      "bg-gray-200 text-gray-700",
                INVALID_NUMBER_FORMAT:"bg-gray-200 text-gray-700"
            };

            const cls = map[raw] || "bg-slate-100 text-slate-700";

            return `
        <span class="cdr-pill inline-flex items-center rounded-full font-semibold ${cls}">
            ${label}
        </span>
    `;
        }


        function durationBadge(sec) {
            const s = Number(sec) || 0;
            let cls = "bg-slate-100 text-slate-700";
            if (s <= 30) cls = "bg-slate-100 text-slate-700";
            else if (s <= 60) cls = "bg-blue-100 text-blue-700";
            else if (s <= 120) cls = "bg-emerald-100 text-emerald-700";
            else if (s <= 300) cls = "bg-orange-100 text-orange-700";
            else cls = "bg-red-100 text-red-700";
            return `
            <span class="cdr-pill inline-flex items-center rounded-full font-semibold ${cls}">
                ${s}s
            </span>
        `;
        }

        function costBadge(value) {
            const v = Number(value) || 0;
            let cls = "bg-slate-100 text-slate-700";
            if (v === 0) cls = "bg-slate-100 text-slate-500";
            else if (v < 0.05) cls = "bg-emerald-100 text-emerald-700";
            else if (v < 0.15) cls = "bg-yellow-100 text-yellow-800";
            else cls = "bg-red-100 text-red-700";
            return `
            <span class="cdr-pill inline-flex items-center rounded-full font-semibold ${cls}">
                R$ ${v.toFixed(4)}
            </span>
        `;
        }

        // ========= Template da linha =========
        function rowTemplate(item) {
            const typeHtml   = cdrTypeBadge(item.type);
            const durHtml    = durationBadge(item.duration);
            const costHtml   = costBadge(item.value);
            const taxaHtml   = costBadge(item.taxa);
            const statusHtml = statusBadge(item.dialstatus);
            const started    = escapeHtml(item.started || "-");
            const dest       = escapeHtml(formatCdrPhone(item.destination));
            const channel    = escapeHtml(formatCdrPhone(item.channelNumber));
            const cause      = escapeHtml(item.cause_txt || "-");
            const endpoints  = escapeHtml(item.endpoints || "-");
            const name       = escapeHtml(item.user_name || "");
            const acc        = escapeHtml(item.user_account_code || "");

            const userInfo = item.user_name && item.user_account_code
                ? `<div class="cdr-cell-stack leading-tight">
                       <div class="cdr-cell-clip font-semibold text-slate-700 cdr-cell-medium">${name}</div>
                       <div class="cdr-cell-clip text-[11px] text-slate-500 cdr-cell-medium">${acc}</div>
                   </div>`
                : "-";

            const payload    = encodeURIComponent(JSON.stringify(item));

            return `
            <tr class="hover:bg-slate-50 transition">
                <td class="border border-slate-100 text-center"><span class="cdr-cell-clip cdr-cell-medium">${started}</span></td>
                <td class="border border-slate-100 text-center"><span class="cdr-cell-clip cdr-cell-medium">${channel}</span></td>
                <td class="border border-slate-100 text-center"><span class="cdr-cell-clip cdr-cell-medium">${dest}</span></td>
                <td class="border border-slate-100 text-center"><span class="cdr-cell-clip cdr-cell-wide">${endpoints}</span></td>
                <td class="border border-slate-100 text-center">${typeHtml}</td>
                <td class="border border-slate-100 text-center">${taxaHtml}</td>
                <td class="border border-slate-100 text-center">${costHtml}</td>
                <td class="border border-slate-100 text-center">${durHtml}</td>
                <td class="border border-slate-100 text-center">${userInfo}</td>
                <td class="border border-slate-100 text-center">${statusHtml}</td>
                <td class="border border-slate-100 text-center"><span class="cdr-cell-clip cdr-cell-wide">${cause}</span></td>
                <td class="border border-slate-100 text-center">
                    <button onclick='openCdrDetails(JSON.parse(decodeURIComponent("${payload}")))'
                        class="px-2 py-1.5 text-[10.5px] font-medium bg-slate-600 text-white rounded-lg hover:bg-slate-700">
                        Ver
                    </button>
                </td>
            </tr>
        `;
        }

        // ========= Estatísticas =========
        function updateStats() {
            if (!statsBox) return;

            if (!filteredItems.length) {
                statsBox.classList.add("hidden");
                statsBox.innerHTML = "";
                return;
            }

            const total = filteredItems.length;

            // Contagem por status
            const atendidas = filteredItems.filter(i => (i.dialstatus || "").toUpperCase() === "ANSWER").length;
            const noanswer  = filteredItems.filter(i => (i.dialstatus || "").toUpperCase() === "NOANSWER").length;
            const busy      = filteredItems.filter(i => (i.dialstatus || "").toUpperCase() === "BUSY").length;
            const failed    = filteredItems.filter(i => (i.dialstatus || "").toUpperCase() === "FAILED").length;
            const cancel    = filteredItems.filter(i => (i.dialstatus || "").toUpperCase() === "CANCEL").length;

            // Percentuais
            const pct = (v) => total > 0 ? ((v / total) * 100).toFixed(1) : "0.0";

            const callSum  = filteredItems.reduce((acc, x) => acc + (Number(x.value) || 0), 0);
            const taxaSum  = filteredItems.reduce((acc, x) => acc + (Number(x.taxa)  || 0), 0);
            const totalSum = callSum + taxaSum;

            statsBox.innerHTML = `
                    <div class="flex flex-wrap gap-4 items-center text-[12px]">
                        <span><strong>Total:</strong> ${total}</span>

                        <span><strong>Atendidas:</strong>
                            ${atendidas} (${pct(atendidas)}%)
                        </span>

                        <span><strong>Não atendidas:</strong>
                            ${noanswer} (${pct(noanswer)}%)
                        </span>

                        <span><strong>Ocupadas:</strong>
                            ${busy} (${pct(busy)}%)
                        </span>

                        <span><strong>Falhas:</strong>
                            ${failed} (${pct(failed)}%)
                        </span>

                        <span><strong>Canceladas:</strong>
                            ${cancel} (${pct(cancel)}%)
                        </span>

                        <span><strong>Custo chamadas:</strong> R$ ${callSum.toFixed(4)}</span>
                        <span><strong>Taxas:</strong> R$ ${taxaSum.toFixed(4)}</span>
                        <span><strong>Total:</strong> R$ ${totalSum.toFixed(4)}</span>
                    </div>
                `;

            statsBox.classList.remove("hidden");
        }


        // ========= Render / Paginação =========
        function renderPage() {
            tbody.innerHTML = "";
            const total      = filteredItems.length;
            const totalPages = Math.max(1, Math.ceil(total / perPage));
            if (currentPage > totalPages) currentPage = totalPages;

            if (!total) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="12" class="px-4 py-6 text-center text-slate-400 italic">
                        Nenhum registro encontrado
                    </td>
                </tr>`;
            } else {
                const start = (currentPage - 1) * perPage;
                const end   = start + perPage;
                filteredItems.slice(start, end).forEach(item => {
                    tbody.insertAdjacentHTML("beforeend", rowTemplate(item));
                });
            }

            pageInfo.textContent = `Página ${currentPage} de ${Math.max(1, Math.ceil(total / perPage))}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage >= totalPages;

            renderPageNumbers(totalPages);
            updateStats();
        }

        function renderPageNumbers(totalPages) {
            pageNumbers.innerHTML = "";
            if (totalPages <= 1) return;

            const makeBtn = (page, label = null) => {
                const isActive = page === currentPage;
                const text = label || page;
                const btn = document.createElement("button");
                btn.textContent = text;
                btn.className =
                    "min-w-[28px] px-2.5 py-1.5 text-[12px] rounded-lg border " +
                    (isActive
                        ? "bg-emerald-500 text-white border-emerald-500"
                        : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100");
                btn.addEventListener("click", () => {
                    currentPage = page;
                    renderPage();
                });
                return btn;
            };

            const maxButtons = 5;
            let start = Math.max(1, currentPage - 2);
            let end   = Math.min(totalPages, start + maxButtons - 1);
            if (end - start < maxButtons - 1) {
                start = Math.max(1, end - maxButtons + 1);
            }

            if (start > 1) {
                pageNumbers.appendChild(makeBtn(1));
                if (start > 2) {
                    const dots = document.createElement("span");
                    dots.textContent = "...";
                    dots.className = "text-[12px] text-slate-400 px-1";
                    pageNumbers.appendChild(dots);
                }
            }

            for (let p = start; p <= end; p++) {
                pageNumbers.appendChild(makeBtn(p));
            }

            if (end < totalPages) {
                if (end < totalPages - 1) {
                    const dots2 = document.createElement("span");
                    dots2.textContent = "...";
                    dots2.className = "text-[12px] text-slate-400 px-1";
                    pageNumbers.appendChild(dots2);
                }
                pageNumbers.appendChild(makeBtn(totalPages));
            }
        }

        // ========= Filtros & busca =========
        const normalize = str => (str || "").toString().toLowerCase();

        function applyFilters() {
            const q        = normalize(search.value);
            const typeVal  = (typeFilter.value || "").toLowerCase();
            const stVal    = (statusFilter.value || "").toUpperCase();
            const dateFrom = dateFromInp.value ? new Date(dateFromInp.value + " 00:00:00") : null;
            const dateTo   = dateToInp.value   ? new Date(dateToInp.value   + " 23:59:59") : null;

            filteredItems = allItems.filter(item => {
                if (typeVal && (item.type || "").toLowerCase() !== typeVal) return false;
                if (stVal && (item.dialstatus || "").toUpperCase() !== stVal) return false;

                if ((dateFrom || dateTo) && item.started) {
                    const dt = new Date(item.started.replace(" ", "T"));
                    if (dateFrom && dt < dateFrom) return false;
                    if (dateTo && dt > dateTo) return false;
                }

                if (q) {
                    const blob = [
                        item.number,
                        item.destination,
                        item.channelNumber,
                        item.channel_id,
                        item.dialstatus,
                        item.type,
                        item.cause_txt,
                        formatCdrPhone(item.number),
                        formatCdrPhone(item.destination),
                        formatCdrPhone(item.channelNumber),
                        String(item.taxa ?? ""),
                        String(item.value ?? "")
                    ].map(normalize).join(" ");

                    if (!blob.includes(q)) return false;
                }
                return true;
            });

            currentPage = 1;
            renderPage();
        }

        // ========= Export =========
        function exportCsv(isExcel = false) {
            if (!filteredItems.length) {
                alert("Nenhum registro para exportar.");
                return;
            }
            const header = ["Data", "CID", "Destino", "Número", "Duração (s)", "Tipo", "Taxa", "Custo", "Total", "Status", "Causa"];
            const rows = filteredItems.map(item => {
                const taxa = (Number(item.taxa) || 0);
                const custo = (Number(item.value) || 0);
                const total = taxa + custo;

                return [
                    item.started || "",
                    formatCdrPhone(item.channelNumber),
                    formatCdrPhone(item.destination),
                    formatCdrPhone(item.number),
                    item.duration || 0,
                    item.type || "",
                    taxa.toFixed(4),
                    custo.toFixed(4),
                    total.toFixed(4),
                    translateStatus(item.dialstatus),
                    item.cause || ""
                ];
            });


            const csvLines = [
                header.join(";"),
                ...rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";"))
            ];

            const blob = new Blob([csvLines.join("\n")], {
                type: isExcel
                    ? "application/vnd.ms-excel;charset=utf-8;"
                    : "text/csv;charset=utf-8;"
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = isExcel ? "cdr-report.xls" : "cdr-report.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ========= Auto-reload =========
        function clearAutoReload() {
            if (autoReloadTimer) {
                clearInterval(autoReloadTimer);
                autoReloadTimer = null;
            }
        }

        function setupAutoReload() {
            clearAutoReload();
            if (!autoReloadChk.checked) return;
            const intervalMs = Number(reloadInterval.value || 10000);
            autoReloadTimer = setInterval(() => {
                if (!document.hidden) fetchCdrData(false);
            }, intervalMs);
        }

        // ========= Fetch de dados =========
        let errorCount = 0;

       async function fetchCdrData(showLoading = true) {
            if (showLoading) {
                tbody.innerHTML = `
        <tr>
            <td colspan="12" class="px-4 py-6 text-center text-slate-400 italic">
                Carregando registros...
            </td>
        </tr>`;
            }

          await  fetch(`${baseUrl}/reports/list-cdr`)
                .then(r => r.json())
                .then(result => {
                    errorCount = 0; // reset erro
                    allItems = Array.isArray(result.data) ? result.data : [];
                    allItems = allItems.map(item => ({
                        ...item,
                        type: (item.type || "").toLowerCase(),
                        value: Number(item.value) || 0,
                        taxa: Number(item.taxa) || 0,
                        duration: Number(item.duration) || 0
                    }));
                    applyFilters();
                })
                .catch(() => {
                    errorCount++;

                    // ⚠️ Só mostra erro se falhar 3 vezes seguidas
                    if (errorCount >= 3) {
                        tbody.innerHTML = `
                <tr>
                    <td colspan="12" class="px-4 py-6 text-center text-red-500">
                        Erro ao carregar CDR.
                    </td>
                </tr>`;
                        statsBox && statsBox.classList.add("hidden");
                    }
                });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearAutoReload();
                return;
            }

            if (autoReloadChk?.checked) {
                fetchCdrData(false);
                setupAutoReload();
            }
        });
        window.addEventListener('beforeunload', clearAutoReload);

        // ========= Eventos =========
        perPageSel.addEventListener("change", () => {
            perPage = Number(perPageSel.value || 10);
            currentPage = 1;
            renderPage();
        });

        prevBtn.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener("click", () => {
            const totalPages = Math.max(1, Math.ceil(filteredItems.length / perPage));
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });

        search.addEventListener("input", applyFilters);
        typeFilter.addEventListener("change", applyFilters);
        statusFilter.addEventListener("change", applyFilters);
        dateFromInp.addEventListener("change", applyFilters);
        dateToInp.addEventListener("change", applyFilters);

        exportCsvBtn.addEventListener("click", () => exportCsv(false));
        exportXlsBtn.addEventListener("click", () => exportCsv(true));

        reloadBtn.addEventListener("click", () => {
            fetchCdrData(true);
        });

        autoReloadChk.addEventListener("change", () => {
            setupAutoReload();
        });

        reloadInterval.addEventListener("change", () => {
            if (autoReloadChk.checked) setupAutoReload();
        });

        // Inicial
        fetchCdrData(true);
        setupAutoReload();
    });

    // ======= Modal Detalhes =======
    function openCdrDetails(item) {
        const html = `
        <p><strong>Data:</strong> ${escapeHtml(item.started ?? "-")}</p>
        <p><strong>Tipo:</strong> ${escapeHtml(item.type ?? "-")}</p>
        <p><strong>Número:</strong> ${escapeHtml(formatCdrPhone(item.number))}</p>
        <p><strong>Destino:</strong> ${escapeHtml(formatCdrPhone(item.destination))}</p>
        <p><strong>Duração:</strong> ${item.duration ?? 0} s</p>
        <p><strong>Taxa:</strong> R$ ${(Number(item.taxa) || 0).toFixed(4)}</p>
        <p><strong>Valor:</strong> R$ ${(Number(item.value) || 0).toFixed(4)}</p>
        <p><strong>Status:</strong> ${escapeHtml(item.dialstatus ?? "-")}</p>
        <p><strong>Motivo:</strong> ${escapeHtml(item.cause_txt ?? "-")}</p>
        <p><strong>CID:</strong> ${escapeHtml(formatCdrPhone(item.channelNumber))}</p>
        <p><strong>Canal:</strong> ${escapeHtml(item.channel_id ?? "-")}</p>
    `;
        document.getElementById("cdrDetailContent").innerHTML = html;
        document.getElementById("cdrDetailModal").classList.remove("hidden");
        document.getElementById("cdrDetailModal").classList.add("flex");
    }

    function closeCdrModal() {
        const modal = document.getElementById("cdrDetailModal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }
</script>
