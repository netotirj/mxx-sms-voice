    <script>
    (function () {
        if (typeof window === 'undefined' || typeof window.EventSource === 'undefined') {
            return;
        }

        if (window.__appRealtime && window.__appRealtime.version) {
            return;
        }

        const NativeEventSource = window.EventSource;
        const activeSources = new Set();

        function unregisterSource(source) {
            if (!source) {
                return;
            }

            activeSources.delete(source);
        }

        function registerSource(source, meta = null) {
            if (!source || source.__appRealtimeManaged) {
                return source;
            }

            const originalClose = typeof source.close === 'function'
                ? source.close.bind(source)
                : null;

            Object.defineProperty(source, '__appRealtimeManaged', {
                value: true,
                configurable: true
            });

            Object.defineProperty(source, '__appRealtimeMeta', {
                value: meta,
                configurable: true
            });

            if (originalClose) {
                source.close = function () {
                    unregisterSource(source);
                    return originalClose();
                };
            }

            activeSources.add(source);
            return source;
        }

        function closeAllSources(reason = 'manual') {
            const sources = Array.from(activeSources);
            if (!sources.length) {
                return 0;
            }

            sources.forEach((source) => {
                try {
                    source.close?.();
                } catch (error) {
                } finally {
                    activeSources.delete(source);
                }
            });

            document.dispatchEvent(new CustomEvent('app:realtime-closed-all', {
                detail: {
                    reason,
                    count: sources.length
                }
            }));

            return sources.length;
        }

        function ManagedEventSource(url, configuration) {
            return registerSource(
                new NativeEventSource(url, configuration),
                { url: String(url || '') }
            );
        }

        ManagedEventSource.prototype = NativeEventSource.prototype;
        ['CONNECTING', 'OPEN', 'CLOSED'].forEach((key) => {
            if (key in NativeEventSource) {
                ManagedEventSource[key] = NativeEventSource[key];
            }
        });

        window.__appRealtime = {
            version: '1.0.0',
            nativeEventSource: NativeEventSource,
            registerSource,
            unregisterSource,
            closeAllSources,
            activeCount: () => activeSources.size,
            activeSources: () => Array.from(activeSources)
        };

        window.EventSource = ManagedEventSource;

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                closeAllSources('visibility-hidden');
            }
        }, true);

        window.addEventListener('pagehide', () => {
            closeAllSources('pagehide');
        }, true);

        window.addEventListener('beforeunload', () => {
            closeAllSources('beforeunload');
        }, true);

        window.addEventListener('popstate', () => {
            closeAllSources('popstate');
        }, true);

        document.addEventListener('click', (event) => {
            const target = event.target;
            if (!(target instanceof Element)) {
                return;
            }

            const anchor = target.closest('a[href]');
            if (!anchor) {
                return;
            }

            const href = String(anchor.getAttribute('href') || '').trim();
            if (
                href === ''
                || href.startsWith('#')
                || href.startsWith('javascript:')
                || anchor.target === '_blank'
                || event.defaultPrevented
                || event.button !== 0
                || event.metaKey
                || event.ctrlKey
                || event.shiftKey
                || event.altKey
            ) {
                return;
            }

            closeAllSources('link-navigation');
        }, true);
    })();
    </script>

    <script>
    (function () {
        if (typeof window === 'undefined' || typeof document === 'undefined') {
            return;
        }

        const FIELD_SELECTOR = [
            'input:not([type])',
            'input[type="text"]',
            'input[type="search"]',
            'input[type="tel"]',
            'input[type="url"]',
            'input[type="number"]',
            'input[type="email"]',
            'textarea'
        ].join(',');

        function canSkipField(field) {
            if (!(field instanceof HTMLElement)) {
                return true;
            }

            if (field.dataset.allowAutofill === 'true' || field.closest('[data-allow-autofill="true"]')) {
                return true;
            }

            if (field.matches('[type="hidden"], [type="password"], [type="file"], [type="date"], [type="datetime-local"], [type="month"], [type="time"], [type="week"], [type="color"], [type="range"]')) {
                return true;
            }

            if (field.disabled || field.readOnly || field.dataset.autofillGuardReady === 'true') {
                return true;
            }

            return false;
        }

        function looksLikeSearchField(field) {
            const bag = [
                field.getAttribute('type') || '',
                field.getAttribute('name') || '',
                field.getAttribute('id') || '',
                field.getAttribute('placeholder') || '',
                field.getAttribute('aria-label') || ''
            ].join(' ').toLowerCase();

            return field.type === 'search'
                || /search|filter|busca|buscar|pesquisa|pesquisar/.test(bag);
        }

        function clearSuspiciousAutofill(field) {
            const value = String(field.value || '').trim();
            if (!value) {
                return;
            }

            if (looksLikeSearchField(field) && value.includes('@')) {
                field.value = '';
            }
        }

        function attachReadonlyGuard(field) {
            if (field.dataset.noReadonlyGuard === 'true' || String(field.value || '').trim() !== '') {
                return;
            }

            field.setAttribute('readonly', 'readonly');

            const unlock = () => {
                field.removeAttribute('readonly');
                field.removeEventListener('focus', unlock, true);
                field.removeEventListener('pointerdown', unlock, true);
                field.removeEventListener('keydown', unlock, true);
                field.removeEventListener('touchstart', unlock, true);
            };

            field.addEventListener('focus', unlock, true);
            field.addEventListener('pointerdown', unlock, true);
            field.addEventListener('keydown', unlock, true);
            field.addEventListener('touchstart', unlock, true);
        }

        function prepareField(field) {
            if (canSkipField(field)) {
                return;
            }

            field.dataset.autofillGuardReady = 'true';
            field.setAttribute('autocomplete', 'off');
            field.setAttribute('autocapitalize', 'off');
            field.setAttribute('autocorrect', 'off');
            field.setAttribute('spellcheck', 'false');
            field.setAttribute('data-lpignore', 'true');

            clearSuspiciousAutofill(field);
            attachReadonlyGuard(field);
        }

        function prepareRoot(root) {
            if (!root) {
                return;
            }

            if (root.matches && root.matches(FIELD_SELECTOR)) {
                prepareField(root);
            }

            if (root.querySelectorAll) {
                root.querySelectorAll(FIELD_SELECTOR).forEach(prepareField);
            }
        }

        function installDecoyAutofillTrap() {
            if (document.getElementById('app-autofill-decoy')) {
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.id = 'app-autofill-decoy';
            wrapper.setAttribute('aria-hidden', 'true');
            wrapper.style.position = 'fixed';
            wrapper.style.left = '-9999px';
            wrapper.style.top = '-9999px';
            wrapper.style.width = '1px';
            wrapper.style.height = '1px';
            wrapper.style.opacity = '0';
            wrapper.style.pointerEvents = 'none';

            wrapper.innerHTML = `
                <form autocomplete="on" tabindex="-1">
                    <input type="text" name="email" autocomplete="username email">
                    <input type="password" name="fake_password" autocomplete="current-password">
                </form>
            `;

            document.body.prepend(wrapper);
        }

        function init() {
            installDecoyAutofillTrap();
            prepareRoot(document.body);

            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node instanceof HTMLElement) {
                            prepareRoot(node);
                        }
                    });
                });
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init, { once: true });
        } else {
            init();
        }
    })();
    </script>

    <script>
    (function () {
        const button = document.getElementById('support-whatsapp-floating');
        if (!button) return;

        const statusText = document.getElementById('support-whatsapp-status-text');
        const label = document.getElementById('support-whatsapp-label');
        const hours = document.getElementById('support-whatsapp-hours');
        const panel = document.getElementById('support-whatsapp-panel');
        const closeBtn = document.getElementById('support-whatsapp-close');
        const messages = document.getElementById('support-bot-messages');
        const options = document.getElementById('support-bot-options');
        const afterTicketOptions = document.getElementById('support-bot-after-ticket');
        const supportActions = document.getElementById('support-bot-support-actions');
        const contact = document.getElementById('support-bot-contact');
        const phoneInput = document.getElementById('support-bot-phone');
        const noteInput = document.getElementById('support-bot-note');
        const backBtn = document.getElementById('support-bot-back');
        const ticketBtn = document.getElementById('support-bot-ticket');
        const whatsappBtn = document.getElementById('support-bot-whatsapp');
        const feedback = document.getElementById('support-whatsapp-feedback');
        const apiBaseUrl = document.querySelector('meta[name="base-url"]')?.getAttribute('content') || '';
        const supportWhatsappPhone = (button.dataset.supportWhatsappPhone || '').replace(/\D+/g, '') || '5568992024512';
        const supportTicketUrl = button.dataset.supportTicketUrl || `${apiBaseUrl}/support`;
        const supportTicketsUrl = button.dataset.supportTicketsUrl || supportTicketUrl;
        const externalWhatsAppDelayMs = 1800;
        const optionCopy = {
            support: {
                label: 'Suporte técnico',
                onlineReply: 'Certo, vou te ajudar com suporte.',
                offlineReply: 'No momento nosso atendimento em tempo real está offline. Você pode deixar seu WhatsApp e um resumo do problema para o time responder no próximo expediente.'
            },
            commercial: {
                label: 'Comercial',
                onlineReply: 'Perfeito. Vou abrir a central WhatsApp da empresa para o atendimento comercial.',
                offlineReply: 'No momento nosso atendimento em tempo real está offline. Deixe seu WhatsApp e o assunto comercial para o time continuar no próximo expediente.'
            },
            sales: {
                label: 'Vendas',
                onlineReply: 'Legal. Vou abrir a central WhatsApp da empresa para o time de vendas.',
                offlineReply: 'No momento nosso atendimento em tempo real está offline. Deixe seu WhatsApp e o que você procura para o time de vendas continuar no próximo expediente.'
            },
            finance: {
                label: 'Financeiro',
                onlineReply: 'Tudo bem. Vou abrir a central WhatsApp da empresa para o atendimento financeiro.',
                offlineReply: 'No momento nosso atendimento em tempo real está offline. Deixe seu WhatsApp e o assunto financeiro para o time responder no próximo expediente.'
            },
            updates: {
                label: 'Novidades/Melhorias',
                onlineReply: 'Certo. Vou abrir a central WhatsApp da empresa para falar sobre novidades e melhorias.',
                offlineReply: 'No momento nosso atendimento em tempo real está offline. Deixe seu WhatsApp e qual módulo, melhoria ou novidade você quer acompanhar.'
            }
        };
        let selectedOption = null;
        let lastAvailabilityMode = null;

        const SUPPORT_TIME_ZONE = 'America/Sao_Paulo';
        const SUPPORT_WEEKDAY_INDEX = {
            Sun: 0,
            Mon: 1,
            Tue: 2,
            Wed: 3,
            Thu: 4,
            Fri: 5,
            Sat: 6
        };
        const SUPPORT_WEEKDAY_LABELS = [
            'domingo',
            'segunda-feira',
            'terca-feira',
            'quarta-feira',
            'quinta-feira',
            'sexta-feira',
            'sabado'
        ];

        function getSupportTimeParts(referenceDate = new Date()) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: SUPPORT_TIME_ZONE,
                weekday: 'short',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hourCycle: 'h23'
            });

            const parts = formatter.formatToParts(referenceDate).reduce((acc, part) => {
                if (part.type !== 'literal') acc[part.type] = part.value;
                return acc;
            }, {});

            return {
                weekday: SUPPORT_WEEKDAY_INDEX[parts.weekday] ?? 0,
                year: Number(parts.year),
                month: Number(parts.month),
                day: Number(parts.day),
                hour: Number(parts.hour),
                minute: Number(parts.minute),
                second: Number(parts.second)
            };
        }

        function addSupportCalendarDays(parts, daysToAdd) {
            const nextDate = new Date(Date.UTC(parts.year, parts.month - 1, parts.day));
            nextDate.setUTCDate(nextDate.getUTCDate() + daysToAdd);

            return {
                year: nextDate.getUTCFullYear(),
                month: nextDate.getUTCMonth() + 1,
                day: nextDate.getUTCDate(),
                weekday: nextDate.getUTCDay()
            };
        }

        function isSameSupportDate(left, right) {
            return left.year === right.year && left.month === right.month && left.day === right.day;
        }

        function formatSupportHour(hour, minute) {
            return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }

        function isBusinessOpen(parts) {
            const minutes = parts.hour * 60 + parts.minute;
            return parts.weekday >= 1 && parts.weekday <= 5 && minutes >= 540 && minutes < 1080;
        }

        function getNextBusinessOpening(parts) {
            if (parts.weekday >= 1 && parts.weekday <= 5 && parts.hour < 9) {
                return { ...parts, hour: 9, minute: 0, second: 0 };
            }

            let next = addSupportCalendarDays(parts, 1);

            do {
                if (next.weekday >= 1 && next.weekday <= 5) {
                    return { ...next, hour: 9, minute: 0, second: 0 };
                }
                next = addSupportCalendarDays(next, 1);
            } while (true);
        }

        function formatNextBusinessOpening(nextParts, nowParts) {
            const tomorrow = addSupportCalendarDays(nowParts, 1);
            const time = formatSupportHour(nextParts.hour, nextParts.minute);

            if (isSameSupportDate(nextParts, nowParts)) return `hoje às ${time}`;
            if (isSameSupportDate(nextParts, tomorrow)) return `amanhã às ${time}`;

            return `${SUPPORT_WEEKDAY_LABELS[nextParts.weekday]}, ${String(nextParts.day).padStart(2, '0')}/${String(nextParts.month).padStart(2, '0')} às ${time}`;
        }

        function getSupportAvailability() {
            const now = getSupportTimeParts();
            const online = isBusinessOpen(now);
            const nextOpening = getNextBusinessOpening(now);

            return {
                online,
                mode: online ? 'online' : 'offline',
                nextOpeningText: formatNextBusinessOpening(nextOpening, now)
            };
        }

        function updateWhatsAppSupportStatus() {
            const availability = getSupportAvailability();
            const online = availability.online;

            button.classList.toggle('is-offline', !online);
            button.href = '#';
            button.setAttribute('aria-label', online ? 'Abrir assistente online da Maxx' : 'Abrir assistente da Maxx');

            if (statusText) statusText.textContent = online ? 'Assistente online' : 'Assistente offline';
            if (label) label.textContent = online ? 'Precisa de ajuda?' : 'Abrir ticket';
            if (hours) hours.textContent = online ? 'Atendimento até 18h' : `Retorno ${availability.nextOpeningText}`;
        }

        function setSupportFeedback(message, type = '') {
            if (!feedback) return;
            feedback.textContent = message || '';
            feedback.classList.toggle('is-error', type === 'error');
            feedback.classList.toggle('is-success', type === 'success');
        }

        function openSupportPanel() {
            button.classList.add('is-open');
            panel?.classList.remove('hidden');
            panel?.setAttribute('aria-hidden', 'false');
        }

        function closeSupportPanel() {
            button.classList.remove('is-open');
            panel?.classList.add('hidden');
            panel?.setAttribute('aria-hidden', 'true');
        }

        function appendBotMessage(text, from = 'bot') {
            if (!messages) return;
            const div = document.createElement('div');
            div.className = `support-bot-message support-bot-message--${from}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            if (!messages) return null;
            const div = document.createElement('div');
            div.className = 'support-bot-message support-bot-message--bot support-bot-message--typing';
            div.innerHTML = '<span></span><span></span><span></span>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function appendBotMessageWithTyping(text, delay = 650) {
            const typing = showTyping();
            window.setTimeout(() => {
                typing?.remove();
                appendBotMessage(text, 'bot');
            }, delay);
        }

        function showContactForm() {
            supportActions?.classList.add('hidden');
            afterTicketOptions?.classList.add('hidden');
            contact?.classList.remove('hidden');
            phoneInput?.focus();
        }

        function createDiagnosticsMessage() {
            if (!messages) return null;

            const div = document.createElement('div');
            div.className = 'support-bot-message support-bot-message--bot support-bot-message--diagnostics';
            div.innerHTML = `
                <div class="support-diagnostics-title">Checagem do ambiente</div>
                <div class="support-diagnostics-steps">
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="server">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">Servidor</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="asterisk">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">Asterisk</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="redis">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">Redis</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="trunks">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">Troncos</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="balance">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">Saldo</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="sms_api">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">API SMS</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                    <div class="support-diagnostics-step is-checking" data-diagnostic-step="whatsapp_api">
                        <span class="support-diagnostics-step__left"><span class="support-diagnostics-step__icon">•</span><span class="support-diagnostics-step__label">API WhatsApp</span></span>
                        <span class="support-diagnostics-step__detail">checando...</span>
                    </div>
                </div>
                <div class="support-diagnostics-summary">Aguarde só um instante.</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;

            return div;
        }

        function updateDiagnosticStep(container, key, item) {
            const step = container?.querySelector(`[data-diagnostic-step="${key}"]`);
            if (!step || !item) return;

            step.classList.remove('is-checking', 'is-ok', 'is-alert');
            step.classList.add(item.ok ? 'is-ok' : 'is-alert');
            const icon = step.querySelector('.support-diagnostics-step__icon');
            const detail = step.querySelector('.support-diagnostics-step__detail');

            if (icon) icon.textContent = item.ok ? '✓' : '!';
            if (detail) detail.textContent = item.detail || (item.ok ? 'OK' : 'alerta');
        }

        async function runSupportDiagnostics() {
            const container = createDiagnosticsMessage();
            supportActions?.classList.add('hidden');

            try {
                const response = await fetch(`${apiBaseUrl}/support/diagnostics`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Não consegui executar o diagnóstico agora.');
                }

                const diagnostics = data.data || {};
                const ordered = [
                    ['server', diagnostics.server],
                    ['asterisk', diagnostics.asterisk],
                    ['redis', diagnostics.redis],
                    ['trunks', diagnostics.trunks],
                    ['balance', diagnostics.balance],
                    ['sms_api', diagnostics.sms_api],
                    ['whatsapp_api', diagnostics.whatsapp_api]
                ];

                ordered.forEach(([key, item], index) => {
                    window.setTimeout(() => updateDiagnosticStep(container, key, item), index * 320);
                });

                window.setTimeout(() => {
                    const summary = container?.querySelector('.support-diagnostics-summary');
                    if (summary) summary.textContent = data.summary || `Checagem concluída às ${data.checked_at || '--:--:--'}.`;
                    supportActions?.classList.remove('hidden');
                    messages.scrollTop = messages.scrollHeight;
                }, ordered.length * 320 + 180);
            } catch (error) {
                const summary = container?.querySelector('.support-diagnostics-summary');
                if (summary) summary.textContent = error.message || 'Não consegui executar o diagnóstico agora.';
                container?.querySelectorAll('.support-diagnostics-step').forEach((step) => {
                    step.classList.remove('is-checking', 'is-ok');
                    step.classList.add('is-alert');
                    const icon = step.querySelector('.support-diagnostics-step__icon');
                    if (icon) icon.textContent = '!';
                });
                supportActions?.classList.remove('hidden');
            }
        }

        function openCompanyWhatsAppForArea(includeContactDetails = false) {
            const userPhone = (phoneInput?.value || '').replace(/\D+/g, '');
            const note = (noteInput?.value || '').trim();

            if (!selectedOption) {
                setSupportFeedback('Escolha uma área de atendimento.', 'error');
                return false;
            }

            if (includeContactDetails && userPhone.length < 8) {
                setSupportFeedback('Informe seu WhatsApp com DDI e DDD.', 'error');
                return false;
            }

            if (includeContactDetails && !note) {
                setSupportFeedback('Conte rapidamente o que você precisa.', 'error');
                return false;
            }

            const area = optionCopy[selectedOption]?.label || 'Atendimento';
            const text = [
                `Olá, preciso falar com ${area}.`,
                `Estou na tela: ${document.title || 'Maxx Solutions'}.`,
                includeContactDetails ? `Meu WhatsApp: ${userPhone}.` : '',
                note ? `Mensagem: ${note}` : ''
            ].filter(Boolean).join('\n');

            if (includeContactDetails) {
                localStorage.setItem('support_bot_last_phone', userPhone);
                setSupportFeedback('Mensagem preparada. Em breve entraremos em contato.', 'success');
                appendBotMessage('Enviar para WhatsApp da empresa', 'user');
                appendBotMessageWithTyping('Tudo certo. Vou preparar sua mensagem e abrir o WhatsApp externo da empresa em instantes. Em breve entraremos em contato.', 520);
            } else {
                appendBotMessage('Abrir WhatsApp da empresa', 'user');
                appendBotMessageWithTyping('Tudo certo. Vou abrir o WhatsApp externo da empresa em instantes para você conferir a conversa. Em breve entraremos em contato.', 520);
            }

            window.setTimeout(() => {
                window.open(`https://wa.me/${supportWhatsappPhone}?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
            }, externalWhatsAppDelayMs);
            return true;
        }

        function chooseOption(option) {
            const data = optionCopy[option];
            if (!data) return;

            selectedOption = option;
            const availability = getSupportAvailability();
            setSupportFeedback('');
            appendBotMessage(data.label, 'user');
            options?.classList.add('hidden');
            contact?.classList.add('hidden');
            supportActions?.classList.add('hidden');

            if (option === 'support') {
                appendBotMessageWithTyping(
                    availability.online
                        ? `${data.onlineReply} Se quiser, eu posso checar o status do ambiente antes de abrir o ticket.`
                        : `${data.offlineReply} O retorno acontece no próximo expediente (${availability.nextOpeningText}).`,
                    720
                );

                window.setTimeout(() => {
                    if (availability.online) {
                        supportActions?.classList.remove('hidden');
                        return;
                    }

                    showContactForm();
                }, 900);
                return;
            }

            if (availability.online) {
                appendBotMessageWithTyping(data.onlineReply, 720);
                window.setTimeout(() => {
                    openCompanyWhatsAppForArea(false);
                }, 880);
                return;
            }

            appendBotMessageWithTyping(
                `${data.offlineReply} O retorno acontece no próximo expediente (${availability.nextOpeningText}).`,
                720
            );
            window.setTimeout(() => {
                showContactForm();
            }, 760);
        }

        function resetBot() {
            selectedOption = null;
            setSupportFeedback('');
            if (phoneInput) phoneInput.value = localStorage.getItem('support_bot_last_phone') || '';
            if (noteInput) noteInput.value = '';
            contact?.classList.add('hidden');
            supportActions?.classList.add('hidden');
            afterTicketOptions?.classList.add('hidden');
            options?.classList.remove('hidden');
            ticketBtn?.classList.remove('is-done');
            if (ticketBtn) ticketBtn.textContent = 'Abrir ticket no sistema';
        }

        function showAfterTicketOptions() {
            selectedOption = null;
            setSupportFeedback('');
            if (phoneInput) phoneInput.value = localStorage.getItem('support_bot_last_phone') || '';
            if (noteInput) noteInput.value = '';
            contact?.classList.add('hidden');
            supportActions?.classList.add('hidden');
            options?.classList.add('hidden');
            afterTicketOptions?.classList.remove('hidden');
            ticketBtn?.classList.remove('is-done');
            if (ticketBtn) ticketBtn.textContent = 'Abrir ticket';
        }

        function openSupportPanelPage() {
            window.location.href = supportTicketUrl;
        }

        function openOpenTicketsPage() {
            window.location.href = supportTicketsUrl;
        }

        async function createSupportTicket() {
            const userPhone = (phoneInput?.value || '').replace(/\D+/g, '');
            const note = (noteInput?.value || '').trim();

            if (!selectedOption) {
                setSupportFeedback('Escolha uma área de atendimento.', 'error');
                return;
            }

            if (userPhone.length < 8) {
                setSupportFeedback('Informe seu WhatsApp com DDI e DDD.', 'error');
                return;
            }

            if (!note) {
                setSupportFeedback('Conte rapidamente o que você precisa.', 'error');
                return;
            }

            ticketBtn.disabled = true;
            whatsappBtn.disabled = true;
            setSupportFeedback('Abrindo ticket...', '');

            try {
                const response = await fetch(`${apiBaseUrl}/support/tickets`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({
                        department: selectedOption,
                        requester_phone: userPhone,
                        message: note
                    })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Não consegui abrir o ticket agora.');
                }

                localStorage.setItem('support_bot_last_phone', userPhone);
                setSupportFeedback(`Ticket #${data.id} aberto com sucesso.`, 'success');
                ticketBtn.classList.add('is-done');
                ticketBtn.textContent = 'Ticket aberto';
                const availability = getSupportAvailability();
                appendBotMessageWithTyping(
                    availability.online
                        ? `Seu ticket #${data.id} foi aberto com sucesso. Você pode acompanhar pelo painel de suporte lá em cima, pelo e-mail cadastrado ou pelo WhatsApp informado.`
                        : `Seu ticket #${data.id} foi aberto com sucesso. Nosso atendimento em tempo real está offline agora; o time responde no próximo expediente (${availability.nextOpeningText}).`,
                    620
                );

                document.dispatchEvent(new CustomEvent('support:tickets-updated'));
                window.setTimeout(() => {
                    appendBotMessageWithTyping('Posso ajudar em mais alguma coisa?', 520);
                    showAfterTicketOptions();
                }, 1300);
            } catch (error) {
                setSupportFeedback(error.message || 'Falha ao abrir ticket.', 'error');
            } finally {
                ticketBtn.disabled = false;
                whatsappBtn.disabled = false;
            }
        }

        let supportStatusPollTimer = null;

        function startSupportStatusPolling() {
            if (supportStatusPollTimer) return;
            supportStatusPollTimer = window.setInterval(() => {
                if (!document.hidden) {
                    updateWhatsAppSupportStatus();
                }
            }, 60000);
        }

        function stopSupportStatusPolling() {
            if (!supportStatusPollTimer) return;
            window.clearInterval(supportStatusPollTimer);
            supportStatusPollTimer = null;
        }

        updateWhatsAppSupportStatus();
        if (phoneInput) {
            phoneInput.value = localStorage.getItem('support_bot_last_phone') || '';
        }
        startSupportStatusPolling();
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopSupportStatusPolling();
                return;
            }

            updateWhatsAppSupportStatus();
            startSupportStatusPolling();
        });
        window.addEventListener('beforeunload', stopSupportStatusPolling);

        button.addEventListener('click', (event) => {
            event.preventDefault();
            openSupportPanel();
            const availability = getSupportAvailability();
            if (!availability.online && lastAvailabilityMode !== availability.mode) {
                appendBotMessageWithTyping(`Estamos fora do horário de atendimento agora. Você pode abrir um ticket e ele será tratado no próximo expediente (${availability.nextOpeningText}).`, 420);
                lastAvailabilityMode = availability.mode;
            } else if (availability.online) {
                lastAvailabilityMode = availability.mode;
            }
        });
        closeBtn?.addEventListener('click', closeSupportPanel);
        options?.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-support-option]');
            if (btn) chooseOption(btn.dataset.supportOption);
        });
        afterTicketOptions?.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-support-action]');
            if (!btn) return;

            if (btn.dataset.supportAction === 'new-ticket') {
                appendBotMessage('Quero abrir um novo ticket', 'user');
                appendBotMessageWithTyping('Claro. Escolha a área que melhor combina com o novo atendimento.', 520);
                resetBot();
                return;
            }

            if (btn.dataset.supportAction === 'view-open-tickets') {
                appendBotMessage('Ver tickets abertos', 'user');
                appendBotMessageWithTyping('Vou abrir o painel para você acompanhar os tickets em aberto.', 520);
                window.setTimeout(openOpenTicketsPage, 500);
                return;
            }

            if (btn.dataset.supportAction === 'open-support-panel') {
                appendBotMessage('Abrir painel de suporte', 'user');
                appendBotMessageWithTyping('Vou abrir o painel completo de suporte para você.', 520);
                window.setTimeout(openSupportPanelPage, 500);
                return;
            }

            appendBotMessage('Encerrar conversa', 'user');
            appendBotMessageWithTyping('Tudo certo. Quando precisar, eu fico por aqui.', 520);
            afterTicketOptions?.classList.add('hidden');
        });
        supportActions?.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-support-action]');
            if (!btn) return;

            if (btn.dataset.supportAction === 'diagnostics') {
                appendBotMessage('Checar status', 'user');
                runSupportDiagnostics();
                return;
            }

            appendBotMessage('Abrir ticket no sistema', 'user');
            showContactForm();
        });
        backBtn?.addEventListener('click', resetBot);
        ticketBtn?.addEventListener('click', createSupportTicket);
        whatsappBtn?.addEventListener('click', () => openCompanyWhatsAppForArea(true));
    })();

    </script>

    <script>
    const notyf = new Notyf({
        duration: 4000,
        ripple: false,
        position: { x: 'right', y: 'top' },
        types: [
            { type: 'success', backgroundColor: '#10b981', icon: { className: 'notyf__icon--success', tagName: 'i' } },
            { type: 'error', backgroundColor: '#e11d48', icon: { className: 'notyf__icon--error', tagName: 'i' } },
            { type: 'info', className: 'notyf__toast--info', backgroundColor: '#334155', icon: false }
        ]
    });
    window.notyf = window.notyf || notyf;
    </script>

    <script>
    (function () {
        if (typeof window === 'undefined' || typeof document === 'undefined') {
            return;
        }

        const MANAGED_ATTR = 'data-app-modal-root';
        const HOISTED_ATTR = 'data-app-modal-hoisted';
        const managedModals = new Set();

        function normalizeLower(value) {
            return String(value ?? '').toLowerCase();
        }

        function isModalRoot(element) {
            if (!(element instanceof HTMLElement)) {
                return false;
            }

            const id = normalizeLower(element.id);
            const role = normalizeLower(element.getAttribute('role'));
            const className = typeof element.className === 'string'
                ? normalizeLower(element.className)
                : normalizeLower(element.getAttribute('class'));

            if (
                id.includes('backdrop')
                || id.includes('overlay')
                || className.includes('backdrop')
                || className.includes('overlay')
            ) {
                return false;
            }

            const looksLikeModal =
                role === 'dialog'
                || element.getAttribute('aria-modal') === 'true'
                || (
                    id.includes('modal')
                    && (
                        element.classList.contains('hidden')
                        || className.includes(' hidden')
                        || className.includes(' items-center')
                        || className.includes(' justify-center')
                    )
                )
                || className.includes(' modal');

            const isFullscreenLayer =
                element.classList.contains('fixed')
                || className.includes('fixed')
                || className.includes('inset-0');

            return looksLikeModal && isFullscreenLayer;
        }

        function applyModalChrome(modal) {
            modal.setAttribute(MANAGED_ATTR, 'true');
            modal.style.zIndex = '100050';
            modal.style.position = 'fixed';
            modal.style.inset = '0';
            modal.style.isolation = 'isolate';
            modal.classList.add('flex', 'items-start', 'justify-center', 'overflow-y-auto', 'overscroll-contain', 'p-4', 'sm:items-center');

            const panel = modal.lastElementChild;
            if (panel instanceof HTMLElement) {
                panel.classList.add('my-auto', 'max-h-[calc(100vh-2rem)]', 'max-h-[calc(100dvh-2rem)]');
                if (!panel.style.zIndex) {
                    panel.style.position = panel.style.position || 'relative';
                    panel.style.zIndex = '100051';
                }
            }

            managedModals.add(modal);
        }

        function hoistModal(modal) {
            if (!(modal instanceof HTMLElement)) {
                return;
            }

            applyModalChrome(modal);

            if (modal.parentElement !== document.body) {
                document.body.appendChild(modal);
            }

            modal.setAttribute(HOISTED_ATTR, 'true');
        }

        function syncBodyModalState() {
            const hasOpenModal = Array.from(managedModals).some((modal) => {
                if (!document.body.contains(modal)) {
                    managedModals.delete(modal);
                    return false;
                }

                return !modal.classList.contains('hidden')
                    && window.getComputedStyle(modal).display !== 'none';
            });

            document.body.classList.toggle('overflow-hidden', hasOpenModal);
        }

        function closeModal(modal) {
            if (!(modal instanceof HTMLElement)) {
                return;
            }

            const closeButton = modal.querySelector(
                '[data-modal-close], [data-pc-modal-dismiss], button[onclick*="close"], button[onclick*="Close"], .modal-close'
            );

            if (closeButton instanceof HTMLElement) {
                closeButton.click();
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            window.setTimeout(syncBodyModalState, 0);
        }

        function wireModal(modal) {
            if (!(modal instanceof HTMLElement) || modal.dataset.appModalWired === 'true') {
                return;
            }

            hoistModal(modal);

            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeModal(modal);
                }
            });

            modal.dataset.appModalWired = 'true';
        }

        function collectModals(root = document) {
            root.querySelectorAll('*').forEach((element) => {
                if (isModalRoot(element)) {
                    wireModal(element);
                }
            });

            syncBodyModalState();
        }

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') {
                return;
            }

            const openModals = Array.from(managedModals).filter((modal) =>
                document.body.contains(modal)
                && !modal.classList.contains('hidden')
                && window.getComputedStyle(modal).display !== 'none'
            );

            const topModal = openModals.at(-1);
            if (topModal) {
                closeModal(topModal);
            }
        });

        const observer = new MutationObserver((mutations) => {
            let shouldSync = false;

            mutations.forEach((mutation) => {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach((node) => {
                        if (node instanceof HTMLElement) {
                            if (isModalRoot(node)) {
                                wireModal(node);
                            }
                            collectModals(node);
                        }
                    });
                    shouldSync = true;
                    return;
                }

                if (mutation.target instanceof HTMLElement && managedModals.has(mutation.target)) {
                    applyModalChrome(mutation.target);
                    shouldSync = true;
                }
            });

            if (shouldSync) {
                syncBodyModalState();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            collectModals(document);
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style']
            });
        });
    })();
    </script>

<script>
        const flashErrorFromUrl = new URLSearchParams(window.location.search).get('flash_error');
        const flashError = localStorage.getItem('flash_error');
        const flashMessage = flashErrorFromUrl || flashError;

        if (flashMessage) {
            notyf.error(flashMessage);
            if (flashErrorFromUrl) {
                const cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.delete('flash_error');
                window.history.replaceState({}, document.title, cleanUrl.toString());
            }
            localStorage.removeItem('flash_error');
        }
    </script>

    <!-- Tailwind custom animation -->
    <style>
        @keyframes pulse-custom {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }

        .animate-pulse-custom {
            animation: pulse-custom 1.5s infinite;
        }
    </style>

    <!-- Dropdown Handler -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userDropdownTrigger = document.getElementById('userDropdownTrigger');
            const userDropdownMenu = document.getElementById('userDropdownMenu');

            const toggleDropdown = () => {
                if (userDropdownMenu.classList.contains('hidden')) {
                    userDropdownMenu.classList.remove('hidden');
                    setTimeout(() => {
                        userDropdownMenu.classList.add('opacity-100', 'pointer-events-auto');
                        userDropdownMenu.classList.remove('opacity-0', 'pointer-events-none');
                    }, 10);
                } else {
                    userDropdownMenu.classList.remove('opacity-100', 'pointer-events-auto');
                    userDropdownMenu.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        userDropdownMenu.classList.add('hidden');
                    }, 250);
                }
            };

            userDropdownTrigger?.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleDropdown();
            });

            document.addEventListener('click', (e) => {
                if (!userDropdownMenu?.contains(e.target) && !userDropdownTrigger?.contains(e.target)) {
                    userDropdownMenu?.classList.remove('opacity-100', 'pointer-events-auto');
                    userDropdownMenu?.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        userDropdownMenu?.classList.add('hidden');
                    }, 250);
                }
            });
        });
    </script>
