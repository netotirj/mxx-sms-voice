<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 1. CONFIGURAÇÕES E ESTADO
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const tbody = document.getElementById('defaultTableBody');

        // Mapeamento correto dos inputs de filtro
        const searchInput = document.getElementById('afSearchInput');
        const statusFilter = document.getElementById('afStatusAccountFilter');
        const onlineFilter = document.getElementById('afOnlineStatusFilter');
        const roleFilter = document.getElementById('afRoleFilter');
        const rowsPerPageSelect = document.getElementById('afRowsPerPage');

        let allData = [];
        let filteredData = [];
        window.allData = [];
        window.afCurrentPage = 1; // Global para o HTML enxergar
        window.auth = { role: '', id: '' };

        // 2. FUNÇÕES DE SUPORTE
        const removeDiacritics = (str) =>
            str ? str.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase() : "";

        window.getAuthRole = () => {
            return String(
                window.auth?.role ||
                window.auth?.user_function ||
                ''
            )
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '_');
        };

        window.isAdmin = () => {
            const role = window.getAuthRole();
            return ['admin', 'super_admin', 'superadmin'].includes(role);
        };

        window.isReseller = () => {
            return window.getAuthRole() === 'reseller';
        };

        window.isOwnUser = (user) => {
            return String(user?.id ?? '') === String(window.auth?.id ?? '');
        };

        window.isMyUser = (user) => {
            return String(user?.user_id ?? '') === String(window.auth?.id ?? '');
        };

        // Mantém a recarga SOMENTE para admin/superadmin
        window.canEditBalance = () => {
            return window.isAdmin();
        };

        // Reseller não edita por esta tela
        window.canEditUser = (user) => {
            if (window.isAdmin()) return true;

            if (window.isReseller()) {
                // não pode editar a própria conta
                if (window.isOwnUser(user)) return false;

                // pode editar usuários criados por ele
                return window.isMyUser(user);
            }

            return false;
        };

        // Admin pode tudo
        // Reseller: não pode excluir a própria conta, mas pode excluir usuários criados por ele
        window.canDeleteUser = (user) => {
            if (window.isAdmin()) return true;

            if (window.isReseller()) {
                if (window.isOwnUser(user)) return false;
                return window.isMyUser(user);
            }

            return false;
        };

        // Admin pode tudo
        // Reseller: não pode alterar o próprio status, mas pode alterar usuários criados por ele
        window.canChangeStatus = (user) => {
            if (window.isAdmin()) return true;

            if (window.isReseller()) {
                if (window.isOwnUser(user)) return false;
                return window.isMyUser(user);
            }

            return false;
        };

        // Regra do modal de criação:
        // reseller só pode criar agent
        window.applyRoleModalRules = function () {
            const roleSelect = document.getElementById('role');
            if (!roleSelect) return;

            if (window.isReseller()) {
                roleSelect.value = 'agent';

                Array.from(roleSelect.options).forEach(option => {
                    option.disabled = option.value !== 'agent';
                });

                roleSelect.setAttribute('disabled', 'disabled');
            } else {
                Array.from(roleSelect.options).forEach(option => {
                    option.disabled = false;
                });

                roleSelect.removeAttribute('disabled');
            }
        };

        // 3. RENDERIZAÇÃO DA TABELA
        window.renderTable = function() {
            if (typeof tbody === 'undefined' || !tbody) return;

            const pageInfo = document.getElementById('afPageInfo');
            const prevBtn = document.getElementById('afPrevPage');
            const nextBtn = document.getElementById('afNextPage');

            tbody.innerHTML = '';
            const perPage = parseInt(rowsPerPageSelect?.value || 10);
            const totalRecords = filteredData.length;
            const totalPages = Math.ceil(totalRecords / perPage) || 1;

            if (window.afCurrentPage > totalPages) window.afCurrentPage = totalPages;
            if (window.afCurrentPage < 1) window.afCurrentPage = 1;

            const slice = filteredData.slice((window.afCurrentPage - 1) * perPage, window.afCurrentPage * perPage);

            if (pageInfo) pageInfo.textContent = `Página ${window.afCurrentPage} de ${totalPages} (${totalRecords} usuários)`;
            if (prevBtn) prevBtn.disabled = (window.afCurrentPage === 1);
            if (nextBtn) nextBtn.disabled = (window.afCurrentPage === totalPages);

            if (slice.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400 italic">Nenhum usuário encontrado</td></tr>`;
                updateKpis();
                return;
            }

            const souAdmin = window.canEditBalance();

            slice.forEach(user => {
                const saldoFormatado = `R$ ${Number(user.balance || 0).toFixed(2).replace('.', ',')}`;
                let colSaldoHTML = '';

                const podeEditar = window.canEditUser(user);
                const podeExcluir = window.canDeleteUser(user);
                const podeAlterarStatus = window.canChangeStatus(user);

                if (String(user.user_function || '').toLowerCase() === 'reseller') {
                    if (souAdmin) {
                        colSaldoHTML = `<span class="cursor-pointer px-2 py-0.5 text-xxs font-bold rounded bg-blue-100 text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white transition-all shadow-sm"
                    onclick="openRecargaModal('${user.id}', '${String(user.email || '').replace(/'/g, "\\'")}', '${user.balance}')">
                    ${saldoFormatado}
                </span>`;
                    } else {
                        colSaldoHTML = `<span class="px-2 py-0.5 text-xxs font-bold rounded bg-slate-100 text-slate-500 border border-slate-200 opacity-90 cursor-not-allowed">
                    ${saldoFormatado}
                </span>`;
                    }
                } else {
                    colSaldoHTML = '<span class="text-slate-300">-</span>';
                }

                const statusClass =
                    user.status_account === 'active'
                        ? 'bg-emerald-500'
                        : user.status_account === 'suspended'
                            ? 'bg-yellow-500 text-black'
                            : 'bg-red-500';

                const row = `
        <tr class="border-b dark:border-slate-700 hover:bg-slate-50/50 transition-colors">
            <td class="p-2 text-left">
                <div class="flex items-center px-2">
                    <img src="${user.avatar}" class="h-9 w-9 rounded-xl mr-3 shadow-sm">
                    <div class="flex flex-col">
                        <h6 class="mb-0 text-sm font-bold dark:text-white">${user.nome}</h6>
                        <p class="mb-0 text-xxs text-slate-400">${user.email}</p>
                    </div>
                </div>
            </td>
            <td class="p-2 text-center text-xs dark:text-white">${user.funcao}</td>
            <td class="p-2 text-center">
                <span class="px-2 py-1 text-xxs font-bold rounded-lg text-white ${user.status === 'Online' ? 'bg-emerald-500' : 'bg-slate-400'}">${user.status}</span>
            </td>

            <td class="p-2 text-center">
                ${colSaldoHTML}
            </td>

            <td class="p-2 text-center">
                ${
                    podeAlterarStatus
                        ? `
                        <button onclick="handleStatusClick('${user.id}', this)"
                            class="px-2.5 py-1 text-xxs font-bold rounded-lg uppercase text-white transition-all ${statusClass}">
                            ${user.status_account}
                        </button>
                        `
                        : `
                        <span class="px-2.5 py-1 text-xxs font-bold rounded-lg uppercase bg-slate-100 text-slate-500 border border-slate-200 opacity-90 cursor-not-allowed">
                            ${user.status_account}
                        </span>
                        `
                }
            </td>

            <td class="p-2 text-center text-xs text-slate-400">${user.created || '-'}</td>

            <td class="p-2 text-center">
                <div class="flex justify-center gap-1">
                    ${
                    podeEditar
                        ? `<button onclick="editUser('${user.id}')" class="text-orange-500 p-1.5 hover:bg-orange-50 rounded-lg transition-all"><i class="fa fa-edit"></i></button>`
                        : `<button type="button" disabled class="text-slate-300 p-1.5 rounded-lg cursor-not-allowed"><i class="fa fa-edit"></i></button>`
                }

                    ${
                    podeExcluir
                        ? `<button onclick="confirmDelete('${user.id}')" class="text-red-500 p-1.5 hover:bg-red-50 rounded-lg transition-all"><i class="fa fa-trash"></i></button>`
                        : `<button type="button" disabled class="text-slate-300 p-1.5 rounded-lg cursor-not-allowed"><i class="fa fa-trash"></i></button>`
                }
                </div>
            </td>
        </tr>`;

                tbody.insertAdjacentHTML('beforeend', row);
            });

            updateKpis();
        };

        // 4. LÓGICA DE FILTRO (Chamada pelos inputs do HTML)
        window.applyFilters = function() {
            const query = removeDiacritics(searchInput?.value || "");
            const sit = statusFilter?.value || "";
            const online = onlineFilter?.value || "";
            const role = roleFilter?.value || "";

            filteredData = allData.filter(u => {
                const matchesSearch = removeDiacritics(u.nome).includes(query) || String(u.email || '').toLowerCase().includes(query);
                const matchesSit = !sit || String(u.status_account || '').toUpperCase() === sit.toUpperCase();
                const matchesOnline = !online || String(u.status || '').toUpperCase() === online.toUpperCase();
                const matchesRole = !role || String(u.funcao || '').includes(role) || String(u.user_function || '') === role;
                return matchesSearch && matchesSit && matchesOnline && matchesRole;
            });
            window.renderTable();
        };

        // Função que o seu HTML chama nos onchange/oninput
        window.renderDefaultTable = function() {
            window.afCurrentPage = 1;
            window.applyFilters();
        };

        window.resetDefaultFilters = function() {
            if(searchInput) searchInput.value = '';
            if(statusFilter) statusFilter.value = '';
            if(onlineFilter) onlineFilter.value = '';
            if(roleFilter) roleFilter.value = '';
            window.renderDefaultTable();
        };

        // 5. MODAIS E CARGA
        window.openUserModal = function() {
            const form = document.getElementById('userForm');
            if (form) form.reset();

            // Limpa o ID para o sistema saber que NÃO é edição
            const userIdField = document.getElementById('user_id');
            if (userIdField) userIdField.value = '';

            // Ajusta textos para modo de CRIAÇÃO
            const modalTitle = document.getElementById('modalTitle');
            const saveBtn = document.getElementById('saveBtn');
            const roleSelect = document.getElementById('role');
            const statusSelect = document.getElementById('user_status');

            if (modalTitle) modalTitle.innerText = 'Criar Novo Usuário';
            if (saveBtn) saveBtn.innerText = 'SALVAR USUÁRIO';

            if (window.isReseller()) {
                if (roleSelect) roleSelect.value = 'agent';
                if (statusSelect) statusSelect.value = 'active';
            }

            window.applyRoleModalRules();

            const modal = document.getElementById('userModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        };

        window.closeUserModal = function() {
            document.getElementById('userModal').classList.replace('flex', 'hidden');
        };

        const userForm = document.getElementById('userForm');
        if (userForm) {
            userForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const saveBtn = document.getElementById('saveBtn');
                const userId = document.getElementById('user_id').value;

                // Se tem ID no hidden field, vai para EDIT, se não, vai para NEW
                const endpoint = userId ? `${baseUrl}/users/edit` : `${baseUrl}/users/new`;

                saveBtn.disabled = true;
                const formData = new FormData(userForm);

                // Trava de segurança no front: reseller só cria agent
                if (window.isReseller()) {
                    formData.set('role', 'agent');
                }

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.status === 200 || result.status === 'SUCCESS') {
                        if(typeof notyf !== 'undefined') notyf.success(result.message || 'Sucesso!');
                        window.closeUserModal();
                        window.loadData(); // Recarrega a tabela e KPIs
                    } else {
                        if(typeof notyf !== 'undefined') notyf.error(result.message || 'Erro ao salvar');
                    }
                } catch (err) {
                    console.error("Erro na requisição:", err);
                    if(typeof notyf !== 'undefined') notyf.error("Falha na comunicação com o servidor.");
                } finally {
                    saveBtn.disabled = false;
                }
            });
        }

        window.editUser = function(id) {
            // Busca no allData que é populado no seu loadData
            const user = allData.find(u => String(u.id) === String(id));
            if (!user) return;

            if (!window.canEditUser(user)) {
                if (typeof notyf !== 'undefined') {
                    notyf.error('Você não tem permissão para editar este usuário.');
                }
                return;
            }

            window.openUserModal(); // Isso reseta o form e abre o modal

            document.getElementById('modalTitle').innerText = 'Editar Usuário';
            document.getElementById('saveBtn').innerText = 'ATUALIZAR USUÁRIO';

            // PREENCHIMENTO DOS CAMPOS
            document.getElementById('user_id').value = user.id;
            document.getElementById('first_name').value = user.nome || '';
            document.getElementById('last_name').value = user.last_name || '';
            document.getElementById('user_email').value = user.email || '';
            document.getElementById('role').value = user.user_function || '';
            document.getElementById('user_status').value = user.status_account || 'active';

            window.applyRoleModalRules();
        };

        window.loadData = function() {
            fetch(`${baseUrl}/users/search`)
                .then(r => r.json())
                .then(res => {
                    allData = res.data || [];
                    filteredData = [];
                    window.allData = allData;
                    window.auth = res.meta || {};

                    window.applyFilters();
                })
                .catch(err => {
                    console.error('Erro ao carregar usuários:', err);
                    allData = [];
                    filteredData = [];
                    window.allData = [];
                    window.auth = { role: '', id: '' };
                    window.applyFilters();
                });
        };

        // 1. FUNÇÃO GLOBAL PARA ABRIR RECARGA
        // Mantida com a regra original: SOMENTE ADMIN / SUPERADMIN
        window.openRecargaModal = function(id, email, balance) {
            if (!window.canEditBalance()) {
                if (typeof notyf !== 'undefined') {
                    notyf.error('Você não tem permissão para inserir crédito.');
                }
                return;
            }

            const idField = document.getElementById("recarga_usuario_id");
            const emailField = document.getElementById("recarga_usuario");
            const balanceField = document.getElementById("recarga_saldo");

            if (idField) idField.value = id;
            if (emailField) emailField.value = email;
            if (balanceField) balanceField.value = `R$ ${parseFloat(balance || 0).toFixed(2)}`;

            const modal = document.getElementById("recarga-modal");
            if (modal) {
                modal.classList.remove("hidden");
                modal.classList.add("flex");
            } else {
                console.error("Modal de recarga não encontrado no HTML!");
            }
        };

        // 2. FUNÇÃO GLOBAL PARA FECHAR RECARGA
        window.closeRecargaModal = function() {
            const modal = document.getElementById("recarga-modal");
            if (modal) modal.classList.replace("flex", "hidden");

            const form = document.getElementById("form-recarga");
            if (form) form.reset();
        };

        const formRecarga = document.getElementById("form-recarga");
        if (formRecarga) {
            formRecarga.addEventListener("submit", async (e) => {
                e.preventDefault();

                if (!window.canEditBalance()) {
                    if (typeof notyf !== 'undefined') {
                        notyf.error('Você não tem permissão para realizar recarga.');
                    }
                    return;
                }

                const btn = document.getElementById("btnConfirmarRecarga");
                const formData = new FormData(formRecarga);

                btn.disabled = true;
                btn.innerText = "PROCESSANDO...";

                try {
                    const response = await fetch(`${baseUrl}/users/refills`, {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();

                    if (result.status === 200 || result.status === 'SUCCESS') {
                        if (typeof notyf !== 'undefined') notyf.success("💰 Recarga efetuada!");
                        window.closeRecargaModal();
                        window.loadData(); // Atualiza o saldo na tabela na hora
                    } else {
                        if (typeof notyf !== 'undefined') notyf.error(result.message || "Erro na recarga");
                    }
                } catch (error) {
                    console.error(error);
                    if (typeof notyf !== 'undefined') notyf.error("Falha na comunicação com o servidor.");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "CONFIRMAR RECARGA";
                }
            });
        }

        function updateKpis() {
            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if(el) el.innerText = val;
            };

            const total = allData.length;
            const online = allData.filter(u => u.status === 'Online').length;
            const active = allData.filter(u => u.status_account === 'active').length;
            const suspended = allData.filter(u => u.status_account === 'suspended').length;
            const inactive = allData.filter(u => u.status_account === 'inactive').length;

            setVal('totalCount', total);
            setVal('onlineCount', online);
            setVal('activeCount', active);
            setVal('suspendedCount', suspended);
            setVal('inactiveCount', inactive);
        }

        // Botões de Paginação
        const prevPageBtn = document.getElementById('afPrevPage');
        const nextPageBtn = document.getElementById('afNextPage');

        if (prevPageBtn) {
            prevPageBtn.onclick = () => {
                if (window.afCurrentPage > 1) {
                    window.afCurrentPage--;
                    window.renderTable();
                }
            };
        }

        if (nextPageBtn) {
            nextPageBtn.onclick = () => {
                const totalPages = Math.ceil(filteredData.length / parseInt(rowsPerPageSelect?.value || 10)) || 1;
                if (window.afCurrentPage < totalPages) {
                    window.afCurrentPage++;
                    window.renderTable();
                }
            };
        }

        window.loadData();
    });

    // FUNÇÕES EXTERNAS
    function handleStatusClick(userId, el) {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const user = (window.allData || []).find(u => String(u.id) === String(userId));

        if (!user || !window.canChangeStatus(user)) {
            if (typeof notyf !== 'undefined') {
                notyf.error('Você não pode alterar o status desta conta.');
            }
            return;
        }

        let current = el.textContent.trim().toLowerCase();
        let next = '';

        // Ciclo: Ativo -> Suspenso -> Inativo -> Ativo
        if (current === 'active') {
            next = 'suspended';
        } else if (current === 'suspended') {
            next = 'inactive';
        } else {
            next = 'active';
        }

        const fd = new FormData();
        fd.append("id", userId);
        fd.append("status", next);

        fetch(`${baseUrl}/users/up-status`, { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if(data.status === 200 || data.status === 'SUCCESS') {
                    window.loadData();
                    if (typeof notyf !== 'undefined') notyf.success("Status atualizado!");
                } else {
                    if (typeof notyf !== 'undefined') notyf.error(data.message || "Erro ao atualizar status.");
                }
            })
            .catch(err => {
                console.error(err);
                if (typeof notyf !== 'undefined') notyf.error("Falha na comunicação com o servidor.");
            });
    }

    function confirmDelete(id) {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const user = (window.allData || []).find(u => String(u.id) === String(id));

        if (!user || !window.canDeleteUser(user)) {
            if (typeof notyf !== 'undefined') {
                notyf.error('Você não pode excluir esta conta.');
            }
            return;
        }

        if(confirm("Excluir usuário?")) {
            fetch(`${baseUrl}/users/${id}/delete`, { method: 'POST' })
                .then(() => window.loadData())
                .catch(err => {
                    console.error(err);
                    if (typeof notyf !== 'undefined') notyf.error("Falha na comunicação com o servidor.");
                });
        }
    }
</script>
