            <div class="flex justify-end">

<!-- Script -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const baseUrl = document.querySelector('meta[name="base-url"]').getAttribute('content');
        const tbody = document.querySelector('table tbody');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');
        const searchInput = document.getElementById('searchInput');

        let allRows = [];
        let filteredRows = [];
        let currentPage = 1;
        const perPage = 5;

        // 🔹 Remove acentos
        function removeDiacritics(str) {
            return str.normalize("NFD").replace(/\p{Diacritic}/gu, "");
        }

        // 🔹 Filtro de busca
        function applySearch(query) {
            const normalizedQuery = removeDiacritics(query.toLowerCase());
            filteredRows = allRows.filter(row =>
                removeDiacritics(row.nome_lista.toLowerCase()).includes(normalizedQuery)
            );
            currentPage = 1;
            renderPage();
        }

        // 🔹 Renderização paginada
        function renderPage() {
            tbody.innerHTML = '';
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const rows = filteredRows.slice(start, end);

            if (rows.length === 0) {
                tbody.innerHTML = `
        <tr>
          <td colspan="5" class="p-3 text-center text-slate-400 italic">
            Nenhuma lista encontrada
          </td>
        </tr>`;
            } else {
                rows.forEach(list => {
                    const statusBadge =
                        list.status === 'Ativa'
                            ? `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                 <i data-feather="check-circle" class="w-4 h-4"></i> Ativa
               </span>`
                            : `<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">
                 <i data-feather="x-circle" class="w-4 h-4"></i> Inativa
               </span>`;

                    const rowHTML = `
          <tr class="hover:bg-gray-50 transition" data-id="${list.id}">
            <!-- Nome -->
            <td class="p-3 align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
              <div class="flex items-center gap-2">
                <i data-feather="list" class="w-4 h-4 text-emerald-500"></i>
                <h6 class="mb-0 text-sm font-medium text-gray-800">${list.nome_lista}</h6>
              </div>
            </td>

            <!-- Contatos -->
            <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap text-sm text-slate-600">
              ${list.num_contatos ?? 0}
            </td>

            <!-- Status -->
            <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
              ${statusBadge}
            </td>

            <!-- Criado em -->
            <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap text-sm text-slate-600">
              ${list.created ?? '--/--/---- --:--'}
            </td>

            <!-- Ações -->
            <td class="p-3 text-center align-middle bg-transparent border-b border-gray-100 whitespace-nowrap">
              <div class="flex justify-center gap-2">
                <button class="btn-delete-list inline-flex items-center gap-1 bg-red-100 text-red-700 hover:bg-red-200 font-semibold text-xs px-3 py-1 rounded transition" data-id="${list.id}" data-name="${list.nome_lista}"">
                  <i data-feather="trash-2" class="w-4 h-4"></i> Excluir
                </button>
              </div>
            </td>
          </tr>`;
                    tbody.insertAdjacentHTML('beforeend', rowHTML);
                });
            }

            const totalPages = Math.ceil(filteredRows.length / perPage) || 1;
            pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            feather.replace();
        }

        // 🔹 Paginação
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredRows.length / perPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });

        // 🔹 Busca em tempo real
        searchInput.addEventListener('input', e => applySearch(e.target.value));

        // 🔹 Carrega listas do backend
        fetch(`${baseUrl}/campaign/voice/search`)
            .then(response => response.json())
            .then(result => {
                if (!result.data || !Array.isArray(result.data)) {
                    console.error('Formato inválido:', result);
                    return;
                }
                allRows = result.data;
                filteredRows = allRows;
                renderPage();
            })
            .catch(error => {
                console.error('Erro ao buscar listas:', error);
                tbody.innerHTML = `
        <tr>
          <td colspan="5" class="p-3 text-center text-red-400 italic">
            Erro ao carregar listas.
          </td>
        </tr>`;
            });
    });
</script>


<script>
    const voiceModal = document.getElementById('uploadModalVoice');
    const voiceContent = document.getElementById('uploadModalVoiceContent');
    const voiceInput = document.getElementById('voiceCsvInput');
    const progressBar = document.getElementById('voiceUploadProgress');
    const percentText = document.getElementById('voiceUploadPercent');
    const voiceBackdrop = document.getElementById('uploadModalVoiceBackdrop');
    const voicePreviewContainer = document.getElementById('voicePreviewContainer');
    const voiceHeader = document.getElementById('voiceHeader');
    const voiceBody = document.getElementById('voiceBody');
    const voiceCount = document.getElementById('voiceCount');
    const voiceListIdInput = document.getElementById('voiceListId');

    function openVoiceModal(listId = null) {
        if (listId) voiceListIdInput.value = listId;
        voiceModal.classList.remove('hidden');
        setTimeout(() => {
            voiceContent.classList.remove('scale-95', 'opacity-0');
            voiceContent.classList.add('scale-100', 'opacity-100');
        }, 50);
    }

    function closeVoiceModal() {
        voiceContent.classList.add('scale-95', 'opacity-0');
        voiceContent.classList.remove('scale-100', 'opacity-100');
        setTimeout(() => {
            voiceModal.classList.add('hidden');
            resetVoiceModal();
        }, 200);
    }

    function resetVoiceModal() {
        progressBar.style.width = '0%';
        percentText.textContent = '0%';
        voiceInput.value = '';
        voiceHeader.innerHTML = '';
        voiceBody.innerHTML = '';
        voicePreviewContainer.classList.add('hidden');
        voiceCount.classList.add('hidden');
    }

    voiceInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'csv') readCsvFile(file, 'voice');
        else if (ext === 'xlsx' || ext === 'xls') readExcelFile(file, 'voice');
        else notyf.error('Formato inválido. Use CSV ou Excel (.xlsx, .xls)');
    });

    function readCsvFile(file, type) {
        const reader = new FileReader();
        reader.onload = e => {
            const text = e.target.result;
            const delimiter = text.includes(';') ? ';' : ',';
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            if (!lines.length) return notyf.error('Arquivo CSV vazio!');
            const headers = lines[0].split(delimiter).map(h => h.trim());
            const rows = lines.slice(1).map(line => line.split(delimiter));
            renderPreview(headers, rows, type);
        };
        reader.readAsText(file, 'utf-8');
    }

    function readExcelFile(file, type) {
        const reader = new FileReader();
        reader.onload = e => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheetName = workbook.SheetNames[0];
            const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});
            if (!sheet.length) return notyf.error('Planilha vazia!');
            const headers = sheet[0];
            const rows = sheet.slice(1);
            renderPreview(headers, rows, type);
        };
        reader.readAsArrayBuffer(file);
    }

    function renderPreview(headers, rows, type) {
        const headerEl = type === 'voice' ? voiceHeader : null;
        const bodyEl = type === 'voice' ? voiceBody : null;
        const previewEl = type === 'voice' ? voicePreviewContainer : null;
        const countEl = type === 'voice' ? voiceCount : null;
        const saveBtn = type === 'voice' ? document.getElementById('saveVoiceButton') : null;

        if (!headerEl || !bodyEl || !previewEl || !countEl || !saveBtn) return;

        headerEl.innerHTML = '<tr>' + headers.map(h => `<th class="px-3 py-2 border-b">${h}</th>`).join('') + '</tr>';
        bodyEl.innerHTML = rows.map(r => `<tr>${r.map(c => `<td class="px-3 py-2 border-b break-words">${c ?? ''}</td>`).join('')}</tr>`).join('');

        previewEl.classList.remove('hidden');
        countEl.textContent = `Total de registros: ${rows.length}`;
        countEl.classList.remove('hidden');

    }


    voiceBackdrop.addEventListener('click', closeVoiceModal);
    document.addEventListener('keydown', e => {
        if (e.key === "Escape") closeVoiceModal();
    });

    async function createVoiceListAndUpload() {
        const saveButton = document.getElementById('saveVoiceButton');
        const listName = document.getElementById('voiceListName').value.trim();
        const file = voiceInput.files[0];

        if (!listName) return notyf.error("Informe o nome da lista!");
        if (!file) return notyf.error("Selecione um arquivo!");

        // Desabilita o botão e adiciona spinner
        saveButton.disabled = true;
        saveButton.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l5-5-5-5v4a8 8 0 00-8 8z"></path>
        </svg> Enviando...
    `;

        try {
            const formData = new FormData();
            formData.append("fileInput", file);
            formData.append("listName", listName);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', baseURL + '/campaign/voice/upload');
            xhr.responseType = 'json';

            // Progresso do upload
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    percentText.textContent = percent + '%';
                }
            });

            // Sucesso na requisição
            xhr.onload = () => {
                saveButton.disabled = false;
                saveButton.innerHTML = 'Salvar Lista';

                let response;
                try {
                    response = typeof xhr.response === 'string'
                        ? JSON.parse(xhr.response)
                        : xhr.response;
                } catch (e) {
                    return notyf.error('Resposta inválida do servidor.');
                }

                if (!response) {
                    return notyf.error('Resposta inválida do servidor.');
                }

                switch (xhr.status) {
                    case 200:
                        if (response.status === 200) {
                            notyf.success(response.message || 'Lista criada com sucesso!');
                            closeVoiceModal();
                            setTimeout(() => location.reload(), 1000);
                        } else {
                            notyf.error(response.message || 'Erro no upload!');
                        }
                        break;

                    case 422:
                        notyf.error(response.message || 'Dados inválidos!');
                        break;

                    case 401:
                        notyf.error(response.message || 'Usuário não autenticado!');
                        break;

                    case 500:
                    default:
                        notyf.error(response.message || 'Erro interno do servidor!');
                        break;
                }
            };


            // Erro de rede ou CORS
            xhr.onerror = () => {
                saveButton.disabled = false;
                saveButton.innerHTML = 'Salvar Lista';
                notyf.error('Erro ao enviar o arquivo! Verifique sua conexão ou permissões do servidor.');
            };

            // Enviar a requisição
            saveButton.disabled = true;
            saveButton.innerHTML = 'Enviando...';
            xhr.send(formData);

        } catch (err) {
            console.error('Erro inesperado:', err);
            saveButton.disabled = false;
            saveButton.innerHTML = 'Salvar Lista';
            notyf.error(err.message || 'Erro inesperado ao enviar o arquivo.');
        }


    }

    document.addEventListener("click", async function (e) {
        const btn = e.target.closest(".btn-delete-list");
        if (!btn) return;

        //console.log(btn)

        const id = btn.dataset.id;
        const name = btn.dataset.name;

        if (!id) return;

        Swal.fire({
            title: "Excluir lista?",
            html: `Tem certeza que deseja excluir a lista <strong>${name}</strong>?`,
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Sim, excluir",
            cancelButtonText: "Cancelar",
            confirmButtonColor: "#e3342f",
        }).then(async (result) => {
            if (!result.isConfirmed) return;

            try {
                const res = await fetch(`${baseURL}/campaign/voice/list-delete`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ids: [id] }),
                });

                const json = await res.json();

                // ============ 🛑 Tratamento de status HTTP ============
                if (res.status === 401) {
                    return notyf.error(json.message || "Usuário não autenticado.");
                }

                if (res.status === 400) {
                    return notyf.error(json.message || "Requisição inválida.");
                }

                if (res.status >= 500) {
                    return notyf.error(json.message || "Erro interno no servidor.");
                }

                // ============ ✅ Sucesso ============
                if (json.success) {

                    const qtd = json.deleted ?? 1;

                    notyf.success(json.message || `${qtd} lista(s) excluída(s)!`);

                    // Remove visualmente sem reload
                    const row = btn.closest("tr");
                    if (row) row.remove();
                    setTimeout(() => location.reload(), 1000);

                } else {
                    notyf.error(json.message || "Erro ao excluir lista.");
                }

            } catch (error) {
                console.error(error);
                notyf.error("Falha ao comunicar com o servidor.");
            }


        });
    });




</script>
