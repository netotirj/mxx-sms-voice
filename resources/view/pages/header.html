<script>
    async function swapPlan(planId) {
        if (!planId) return;

        try {
            const response = await fetch(baseURL + '/dashboard/swap-plan', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ plan_id: planId })
            });

            const data = await response.json(); // <-- já pega o JSON retornado

            if (response.ok) {
                // Sucesso → mostra notyf
                notyf.success(data.message || 'Plano alterado com sucesso!');

                // Aguarda 1.5 segundos antes de recarregar a página
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } else {
                notyf.error(data.error || 'Erro ao alterar o plano.');
            }

        } catch (err) {
            //console.error(err);
            //alert('Falha na comunicação com o servidor.');
        }
    }
</script>






<script>
    document.addEventListener('DOMContentLoaded', () => {
        const bell = document.getElementById('notificationBell');
        const badgeT = document.getElementById('badgeT');
        const badgeCount = document.getElementById('badgeCount');
        const badgePulse = document.getElementById('badgePulse');
        const dropdown = document.getElementById('dropdownMenu');
        const supportTicketsButton = document.getElementById('supportTicketsButton');
        const supportTicketsMenu = document.getElementById('supportTicketsMenu');
        const supportTicketsList = document.getElementById('supportTicketsList');
        const supportTicketsBadge = document.getElementById('supportTicketsBadge');
        const supportTicketsRefresh = document.getElementById('supportTicketsRefresh');
        const supportTicketsSummary = document.getElementById('supportTicketsSummary');
        const productUpdatesButton = document.getElementById('productUpdatesButton');
        const productUpdatesMenu = document.getElementById('productUpdatesMenu');
        const productUpdatesBadge = document.getElementById('productUpdatesBadge');
        const productUpdatesList = document.getElementById('productUpdatesList');
        const headerBaseUrl = document.querySelector('meta[name="base-url"]')?.getAttribute('content') || '';

        // Barra de ações
        const clearAll = document.getElementById('clearAll');
        const markAllRead = document.getElementById('markAllRead');
        let productUpdatesSeenMarker = '';

        // Container para notificações
        let msgNot = document.getElementById('msgNot');
        if (!msgNot) {
            msgNot = document.createElement('div');
            msgNot.id = 'msgNot';
            dropdown.appendChild(msgNot);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function renderNotifications(notifications) {
            if (!msgNot) return;
            let htmlContent = '';

            if (!notifications || !notifications.length) {
                htmlContent = `<div class="text-center text-gray-500 p-3">Sem novas notificações.</div>`;
            } else {
                htmlContent = `
            <ul class="divide-y divide-gray-200">
                ${notifications.map(item => `
                    <li class="dropdown-item p-3 cursor-pointer ${item.read_at === null ? 'bg-amber-100 border-l-4 border-red-400' : 'bg-white'} rounded-lg hover:bg-gray-200"
                        data-id="${item.id}">
                        <div class="flex items-start space-x-2">
                            <i class="fa ${
                    item.type === 'alert' ? 'fa-times-circle text-red-500' :
                        item.type === 'notice' ? 'fa-exclamation-circle text-green-500' :
                            'fa-info-circle text-blue-500'
                } mt-0.5"></i>
                            <div class="flex-1">
                                <h6 class="text-sm font-semibold">${item.title}</h6>
                                <p class="text-xs text-gray-600 mt-1">${item.message}</p>
                                <div class="mt-1 text-xs text-gray-400 flex justify-end italic">${formatDate(item.created_at)}</div>
                            </div>
                        </div>
                    </li>
                `).join('')}
                <li class="text-center mt-2">
                    <a href="${baseUrl}/reports/notifications" class="text-sm font-semibold text-blue-600 hover:underline block py-2">Ver todas</a>
                </li>
            </ul>`;
            }

            msgNot.innerHTML = htmlContent;

            // --- MANTENDO SUA LÓGICA DE MARCAR UMA POR VEZ ---
            dropdown.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    if (!id) return;
                    axios.post(`${baseUrl}/notifications`, { id })
                        .then(() => item.classList.add('opacity-50'))
                        .catch(err => console.error(err));
                });
            });
        }

        function departmentLabel(department) {
            const labels = {
                support: 'Suporte',
                commercial: 'Comercial',
                sales: 'Vendas',
                finance: 'Financeiro',
                updates: 'Novidades/Melhorias'
            };

            return labels[department] || 'Suporte';
        }

        function statusLabel(status) {
            const labels = {
                open: 'Aberto',
                pending: 'Pendente',
                closed: 'Fechado'
            };

            return labels[status] || status;
        }

        function renderSupportTickets(tickets) {
            if (!supportTicketsList) return;

            const openCount = Array.isArray(tickets) ? tickets.filter(ticket => ticket.status !== 'closed').length : 0;
            if (supportTicketsSummary) {
                supportTicketsSummary.textContent = openCount === 1
                    ? '1 ticket aberto aguardando acompanhamento'
                    : `${openCount} tickets abertos aguardando acompanhamento`;
            }

            if (supportTicketsBadge) {
                supportTicketsBadge.textContent = String(openCount);
                supportTicketsBadge.classList.toggle('hidden', openCount === 0);
            }

            if (!tickets || !tickets.length) {
                supportTicketsList.innerHTML = `
                    <div class="text-center p-5">
                        <div class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 mb-3">
                            <i class="fa fa-check text-lg"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-700">Tudo em dia por aqui</p>
                        <p class="text-xs text-slate-500 mt-1">Quando a Lívia abrir um ticket, ele aparece nesta lista.</p>
                    </div>`;
                return;
            }

            supportTicketsList.innerHTML = `
                <ul class="space-y-2">
                    ${tickets.map(ticket => `
                        <li class="p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:border-emerald-200 hover:bg-emerald-50/40 transition-colors">
                            <div class="flex items-start gap-3">
                                <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 shrink-0">
                                    <i class="fa fa-life-ring text-sm"></i>
                                </span>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center justify-between gap-2">
                                        <h6 class="text-sm font-bold text-slate-800 truncate">#${ticket.id} - ${departmentLabel(ticket.department)}</h6>
                                        <span class="text-xxs font-bold text-emerald-700 bg-emerald-100 rounded-full px-2 py-1">${statusLabel(ticket.status)}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 mt-1 leading-snug">${ticket.opening_message || ticket.subject || 'Sem mensagem'}</p>
                                    <div class="mt-2 flex items-center justify-between text-xxs text-slate-400">
                                        <span>${ticket.requester_phone || 'Sem telefone'}</span>
                                        <span>${ticket.last_message_at ? formatDate(ticket.last_message_at) : formatDate(ticket.created_at)}</span>
                                    </div>
                                </div>
                            </div>
                        </li>
                    `).join('')}
                </ul>`;
        }

        function updateStatusBadge(status) {
            const labels = {
                planned: 'Planejado',
                in_progress: 'Em andamento',
                done: 'Concluído',
                cancelled: 'Cancelado'
            };
            const classes = {
                planned: 'text-violet-700 bg-violet-50',
                in_progress: 'text-cyan-700 bg-cyan-50',
                done: 'text-emerald-700 bg-emerald-50',
                cancelled: 'text-slate-600 bg-slate-100'
            };

            return `<span class="text-xxs font-bold rounded-full px-2 py-1 ${classes[status] || classes.planned}">${labels[status] || status}</span>`;
        }

        function updateCategoryBadge(category) {
            const labels = {
                bug: 'Bug',
                update: 'Update',
                correction: 'Correção',
                improvement: 'Melhoria',
                incident: 'Incidente',
                maintenance: 'Manutenção'
            };
            const classes = {
                bug: 'text-red-600 bg-red-50',
                update: 'text-cyan-700 bg-cyan-50',
                correction: 'text-amber-700 bg-amber-50',
                improvement: 'text-emerald-700 bg-emerald-50',
                incident: 'text-fuchsia-700 bg-fuchsia-50',
                maintenance: 'text-slate-600 bg-slate-100'
            };

            return `<span class="text-xxs font-bold rounded-full px-2 py-1 ${classes[category] || classes.update}">${labels[category] || labels.update}</span>`;
        }

        function parseProductUpdateSteps(value) {
            if (!value) return [];

            let steps = value;
            if (typeof value === 'string') {
                try {
                    steps = JSON.parse(value);
                } catch (e) {
                    return [];
                }
            }

            return Array.isArray(steps)
                ? steps.map(step => ({
                    label: typeof step === 'string' ? step : ((step && step.label) || ''),
                    done: typeof step === 'object' && step !== null && !!step.done
                })).filter(step => step.label)
                : [];
        }

        function renderProductUpdateProgress(item) {
            const steps = parseProductUpdateSteps(item.steps_json);
            if (!steps.length) return '';

            const done = steps.filter(step => step.done).length;
            const progress = Math.round((done / steps.length) * 100);
            const updateId = Number(item.id || 0);
            const detailsId = `productUpdateSteps-${updateId}`;

            return `
                <div class="mt-3">
                    <div class="flex items-center justify-between text-[11px] font-bold text-slate-500">
                        <span>${done}/${steps.length} etapas concluídas</span>
                        <span class="text-emerald-700">${progress}%</span>
                    </div>
                    <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-100">
                        <div class="h-full rounded-full bg-emerald-500 transition-all" style="width:${progress}%"></div>
                    </div>
                    <button type="button"
                            class="mt-2 inline-flex items-center gap-1 text-[11px] font-bold text-cyan-700 hover:text-cyan-900"
                            data-product-update-toggle="${detailsId}">
                        <i class="fa fa-chevron-down text-[9px] transition-transform"></i>
                        <span>Ver processo</span>
                    </button>
                    <div id="${detailsId}" class="hidden mt-2 space-y-1.5 rounded-lg border border-slate-100 bg-slate-50 p-2">
                        ${steps.map(step => `
                            <div class="flex items-start gap-2 text-xs ${step.done ? 'text-emerald-700' : 'text-slate-500'}">
                                <span class="mt-0.5 inline-flex h-4 w-4 shrink-0 items-center justify-center rounded-full ${step.done ? 'bg-emerald-500 text-white' : 'border border-slate-200 bg-white text-slate-300'}">
                                    ${step.done ? '<i class="fa fa-check text-[9px]"></i>' : ''}
                                </span>
                                <span class="leading-snug ${step.done ? 'line-through decoration-emerald-500' : ''}">${escapeHtml(step.label)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProductUpdates(tickets) {
            if (!productUpdatesList) return;

            const items = Array.isArray(tickets) ? tickets : [];
            const activeCount = items.filter(item => item.status !== 'done' && item.status !== 'cancelled').length;
            productUpdatesSeenMarker = items.map(item => `${item.id}:${item.updated_at || item.created_at || ''}`).join('|');
            const hasSeenCurrentUpdates = localStorage.getItem('product_updates_seen_marker') === productUpdatesSeenMarker;
            if (productUpdatesBadge) {
                productUpdatesBadge.textContent = String(activeCount || items.length);
                productUpdatesBadge.classList.toggle('hidden', (activeCount || items.length) === 0 || hasSeenCurrentUpdates);
            }

            if (!items.length) {
                productUpdatesList.innerHTML = `
                    <div class="text-center p-5">
                        <div class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-slate-50 text-slate-500 mb-3">
                            <i class="fa fa-check text-lg"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-700">Nada novo no momento</p>
                        <p class="text-xs text-slate-500 mt-1">Quando o suporte publicar uma melhoria, ela aparece aqui.</p>
                    </div>`;
                return;
            }

            productUpdatesList.innerHTML = items.slice(0, 6).map(ticket => `
                <div class="p-3 rounded-xl bg-white border border-slate-100 shadow-sm hover:border-cyan-200 hover:bg-cyan-50/40 transition-colors">
                    <div class="flex items-start gap-3">
                        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-cyan-50 text-cyan-600 shrink-0">
                            <i class="fa ${ticket.status === 'done' ? 'fa-check' : 'fa-spinner'} text-sm"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between gap-2">
                                <h6 class="text-sm font-bold text-slate-800 truncate">${escapeHtml(ticket.title || 'Novidade')}</h6>
                                <span class="flex shrink-0 items-center gap-1">
                                    ${updateCategoryBadge(ticket.category || 'update')}
                                    ${updateStatusBadge(ticket.status)}
                                </span>
                            </div>
                            <p class="text-xs text-slate-600 mt-1 leading-snug">${escapeHtml(ticket.description || 'Atualização registrada pelo suporte.')}</p>
                            ${renderProductUpdateProgress(ticket)}
                            <p class="text-xxs text-slate-400 mt-2">${ticket.updated_at ? formatDate(ticket.updated_at) : formatDate(ticket.created_at)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            bindProductUpdateStepToggles();
        }

        function bindProductUpdateStepToggles() {
            productUpdatesList?.querySelectorAll('[data-product-update-toggle]').forEach(button => {
                button.addEventListener('click', event => {
                    event.preventDefault();
                    event.stopPropagation();

                    const target = document.getElementById(button.dataset.productUpdateToggle);
                    if (!target) return;

                    const isHidden = target.classList.toggle('hidden');
                    const icon = button.querySelector('i');
                    const label = button.querySelector('span');

                    icon?.classList.toggle('rotate-180', !isHidden);
                    if (label) label.textContent = isHidden ? 'Ver processo' : 'Ocultar processo';
                });
            });
        }

        function loadSupportTickets() {
            if (!supportTicketsList || typeof axios === 'undefined') return;

            axios.get(`${headerBaseUrl}/support/tickets?status=open`)
                .then(response => renderSupportTickets(response.data?.data || []))
                .catch(() => {
                    supportTicketsList.innerHTML = `<div class="text-center text-red-500 p-3">Falha ao carregar tickets.</div>`;
                });
        }

        function loadProductUpdates() {
            if (!productUpdatesList || typeof axios === 'undefined') return;

            axios.get(`${headerBaseUrl}/system-updates/header`)
                .then(response => renderProductUpdates(response.data?.data || []))
                .catch(() => {
                    productUpdatesList.innerHTML = `<div class="text-center text-red-500 p-3">Falha ao carregar novidades.</div>`;
                });
        }

        // --- AÇÃO: APAGAR TODAS (SEM CONFIRMAÇÃO) ---
        if (clearAll) {
            clearAll.addEventListener('click', (e) => {
                e.stopPropagation(); // Mantém o dropdown aberto durante o processamento

                // Dispara para o banco direto
                axios.post(`${baseUrl}/notifications/delete-all`)
                    .then(() => {
                        // Limpa o visual imediatamente
                        msgNot.innerHTML = `<div class="text-center text-gray-500 p-3">Sem novas notificações.</div>`;

                        // Zera os badges do sino
                        if (badgeCount) badgeCount.textContent = '0';
                        if (badgePulse) badgePulse.style.display = 'none';

                        // Feedback silencioso (opcional, se usar Notyf)
                        if (typeof notyf !== 'undefined') notyf.success("Notificações apagadas");
                    })
                    .catch(err => {
                        console.error("Erro ao apagar notificações:", err);
                    });
            });
        }

        // --- AÇÃO: MARCAR TODAS COMO LIDAS (SEM CONFIRMAÇÃO) ---
        if (markAllRead) {
            markAllRead.addEventListener('click', (e) => {
                e.stopPropagation();

                axios.post(`${baseUrl}/notifications/mark-all-read`)
                    .then(() => {
                        // 1. Remove o estilo visual de "não lida" de todos os itens na hora
                        dropdown.querySelectorAll('.dropdown-item').forEach(item => {
                            item.classList.remove('bg-amber-100', 'border-l-4', 'border-red-400');
                            item.classList.add('bg-white', 'opacity-50');
                        });

                        // 2. Zera os contadores do sino
                        if (badgeCount) badgeCount.textContent = '0';
                        if (badgePulse) badgePulse.style.display = 'none';

                        // 3. Notificação de sucesso (Feedback para o usuário)
                        if (typeof notyf !== 'undefined') {
                            notyf.success("Todas as notificações foram marcadas como lidas!");
                        } else {
                            console.log("Todas lidas com sucesso.");
                        }

                    })
                    .catch(err => {
                        console.error("Erro ao marcar todas como lidas:", err);
                        if (typeof notyf !== 'undefined') notyf.error("Erro ao processar solicitação.");
                    });
            });
        }

        // --- CONTROLE DE EXIBIÇÃO ---
        function toggleDropdown(event) {
            event.preventDefault();
            event.stopPropagation();
            if (!dropdown) return;
            supportTicketsMenu?.classList.add('opacity-0', 'pointer-events-none');
            productUpdatesMenu?.classList.add('opacity-0', 'pointer-events-none');
            dropdown.classList.toggle('opacity-0');
            dropdown.classList.toggle('pointer-events-none');
        }

        function toggleSupportTickets(event) {
            event.preventDefault();
            event.stopPropagation();
            if (!supportTicketsMenu) return;

            dropdown?.classList.add('opacity-0', 'pointer-events-none');
            productUpdatesMenu?.classList.add('opacity-0', 'pointer-events-none');
            supportTicketsMenu.classList.toggle('opacity-0');
            supportTicketsMenu.classList.toggle('pointer-events-none');

            if (!supportTicketsMenu.classList.contains('opacity-0')) {
                loadSupportTickets();
            }
        }

        function toggleProductUpdates(event) {
            event.preventDefault();
            event.stopPropagation();
            if (!productUpdatesMenu) return;

            dropdown?.classList.add('opacity-0', 'pointer-events-none');
            supportTicketsMenu?.classList.add('opacity-0', 'pointer-events-none');
            productUpdatesMenu.classList.toggle('opacity-0');
            productUpdatesMenu.classList.toggle('pointer-events-none');

            if (!productUpdatesMenu.classList.contains('opacity-0')) {
                localStorage.setItem('product_updates_seen_marker', productUpdatesSeenMarker);
                productUpdatesBadge?.classList.add('hidden');
                loadProductUpdates();
            }
        }

        if (bell) bell.addEventListener('click', toggleDropdown);
        if (badgeT) badgeT.addEventListener('click', toggleDropdown);
        supportTicketsButton?.addEventListener('click', toggleSupportTickets);
        productUpdatesButton?.addEventListener('click', toggleProductUpdates);
        supportTicketsRefresh?.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            loadSupportTickets();
        });

        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target) && !(bell && bell.contains(e.target)) && !(badgeT && badgeT.contains(e.target))) {
                dropdown.classList.add('opacity-0');
                dropdown.classList.add('pointer-events-none');
            }

            if (
                supportTicketsMenu &&
                !supportTicketsMenu.contains(e.target) &&
                !(supportTicketsButton && supportTicketsButton.contains(e.target))
            ) {
                supportTicketsMenu.classList.add('opacity-0');
                supportTicketsMenu.classList.add('pointer-events-none');
            }

            if (
                productUpdatesMenu &&
                !productUpdatesMenu.contains(e.target) &&
                !(productUpdatesButton && productUpdatesButton.contains(e.target))
            ) {
                productUpdatesMenu.classList.add('opacity-0');
                productUpdatesMenu.classList.add('pointer-events-none');
            }
        });

        loadSupportTickets();
        loadProductUpdates();
        document.addEventListener('support:tickets-updated', loadSupportTickets);
        window.setInterval(loadSupportTickets, 60000);
        window.setInterval(loadProductUpdates, 60000);

        // --- SSE PARA NOTIFICAÇÕES EM TEMPO REAL ---
        if (typeof(EventSource) !== 'undefined') {
            const sse = new EventSource(`${baseUrl}/notifications`);
            sse.addEventListener('notifications', event => {
                const data = JSON.parse(event.data);
                if (!data) return;

                if (badgeCount) badgeCount.textContent = data.qtd_new || '0';
                if (badgePulse) badgePulse.style.display = (data.qtd_new > 0) ? 'block' : 'none';

                renderNotifications(data.notifications);
            });
        }
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const breadcrumbEl = document.getElementById("breadcrumb");
        const titleEl = document.getElementById("breadcrumb-title");

        const routeTitles = {
            "": "Dashboard",
            "dashboard": "Dashboard",
            "users": "Usuários",
            "users/profile": "Perfil",
            "campaign": "Campanhas",
            "campaign/whatsapp": "WhatsApp",
            "campaign/voice": "Voz",
            "refills": "Recargas",
            "rates": "Tarifas",
            "reports": "Relatórios",
            "reports/notifications": "Notificações",
            "reports/whatsapp": "WhatsApp",
            "reports/sms": "SMS",
            "support": "Suporte",
            "system-updates": "Atualizações",
            "settings": "Configurações",
            "permissions": "Permissões"
        };

        const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        const parts = path.split("/").filter(Boolean);
        const routeKey = parts.join("/");
        const fallbackPart = parts[parts.length - 1] || "dashboard";
        const currentTitle = routeTitles[routeKey] || routeTitles[fallbackPart] || fallbackPart.replace(/[-_]/g, " ");
        const homeHref = parts.length ? `/${parts[0]}` : "/";

        breadcrumbEl.innerHTML = "";
        titleEl.textContent = currentTitle;

        [
            { name: "Início", href: homeHref },
            { name: currentTitle, href: null }
        ].forEach((item, index) => {
            const li = document.createElement("li");
            li.className =
                "text-sm capitalize leading-normal text-white" +
                (index > 0 ? " pl-2 before:float-left before:pr-2 before:text-white before:content-['/']" : "");

            if (!item.href || index === 1) {
                li.textContent = item.name;
                li.setAttribute("aria-current", "page");
            } else {
                li.innerHTML = `<a href="${item.href}" class="text-white opacity-50">${item.name}</a>`;
            }

            breadcrumbEl.appendChild(li);
        });
    });
</script>
